<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每周核对清单 · Prime Anchor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<style>
:root{--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--blue:#29AAE1;--red:#dc2626;--green:#16a34a;--amber:#d97706;--navy:#0f4c6b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#eef3f8;color:#1f2937}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:.25rem;border:none;border-radius:8px;padding:.45rem .85rem;font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;text-decoration:none}
.btn-sm{padding:.25rem .6rem;font-size:.76rem}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-outline{background:#fff;color:var(--g600);border:1px solid var(--g300)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{padding:.4rem .5rem;border:1px solid var(--g300);border-radius:6px;font-size:.85rem;font-family:inherit;background:#fff}
.muted{color:var(--g500);font-size:.78rem}
.tag{display:inline-block;border-radius:999px;padding:.08rem .55rem;font-size:.72rem;font-weight:700;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-bad{background:#fee2e2;color:#991b1b}.t-warn{background:#fef3c7;color:#92400e}.t-gray{background:var(--g100);color:var(--g600)}.t-blue{background:#e0f2fe;color:#075985}
.tabs{display:flex;gap:.4rem;margin:12px 0;flex-wrap:wrap}
.tab{border:1px solid var(--g200);background:#fff;border-radius:999px;padding:.35rem .95rem;font-size:.84rem;cursor:pointer;font-family:inherit;color:var(--g600)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:10px 14px}
.stat .n{font-size:1.5rem;font-weight:800}.stat .l{font-size:.78rem;color:var(--g500)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-size:.74rem;color:var(--g500);font-weight:700;padding:.4rem .5rem;border-bottom:1px solid var(--g200);white-space:nowrap}
td{padding:.5rem;border-bottom:1px solid var(--g100);vertical-align:top}
tr.missing td{background:#fff7f7}
.scroll{overflow-x:auto}
.banner{border-radius:10px;padding:.6rem .9rem;font-size:.85rem;margin-top:10px}
.b-warn{background:#fef3c7;color:#78350f}.b-ok{background:#dcfce7;color:#14532d}
h3{margin:0 0 .5rem;font-size:.98rem;color:var(--navy)}
.inv{font-size:.8rem;margin:.1rem 0}
.co-head td{background:#f8fafc;font-weight:800;color:var(--navy)}
</style>
<script src="/pa-dialog.js"></script>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;background:#eef3f8;display:none;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="max-width:360px;width:100%;text-align:center">
    <div style="font-weight:800;margin-bottom:.6rem">📋 每周核对清单</div>
    <input id="lu" placeholder="用户名" style="width:100%;margin-bottom:.5rem">
    <input id="lp" type="password" placeholder="密码" style="width:100%" onkeydown="if(event.key==='Enter')login()">
    <div id="le" style="color:var(--red);font-size:.8rem;min-height:1.1em;margin-top:.4rem"></div>
    <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="login()">登录</button>
  </div>
</div>
<div class="wrap" id="main" style="display:none">
  <div class="row" style="justify-content:space-between">
    <div><div style="font-size:1.2rem;font-weight:800;color:var(--navy)">📋 会计每周核对清单</div>
      <div class="muted">每周五核对：① 该出的账单都出了没有（把这周的发票 link 到清单上；同一个仓库有卸柜也有劳务的，两张都要出）② 出了的账单客户都付款了没有</div></div>
    <div class="row">
      <a class="btn btn-outline" href="/accounting" target="_blank">🧾 会计对账 ↗</a>
      <button class="btn btn-outline" onclick="load()">↻ 刷新</button>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button class="btn btn-outline btn-sm" onclick="shiftWeek(-7)">◀ 上一周</button>
        <input type="date" id="wk" onchange="WEEK=monday(this.value);load()">
        <button class="btn btn-outline btn-sm" onclick="shiftWeek(7)">下一周 ▶</button>
        <b id="wkLabel"></b>
      </div>
      <div id="doneBox" class="row"></div>
    </div>
    <div id="banner"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</div>
<script>
let TOKEN = localStorage.getItem('acct_token') || localStorage.getItem('adminToken') || '';
let D = null, TAB = 'bills', WEEK = '', PAY_SCOPE = 'all';
const KIND = { container: '🚛 卸柜', labor: '👷 劳务', any: '📄 不限类型' };
const FREQ = { weekly: '每周必出', confirm: '有时有 · 每周确认', occasional: '偶尔有 · 每周确认' };
const PAY = { paid: ['✅ 已收款', 't-ok'], partial: ['🟡 部分收款', 't-warn'], review: ['⏳ 待审核', 't-blue'], unpaid: ['❌ 未收款', 't-bad'] };
function esc(s) { if (s == null) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML.replace(/"/g, '&quot;'); }
function money(n) { return '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function toast(msg, bad) {
  const t = document.createElement('div'); t.textContent = msg;
  t.style.cssText = `position:fixed;left:50%;top:18px;transform:translateX(-50%);background:${bad ? '#dc2626' : '#16a34a'};color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;z-index:3000`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || 'GET', headers: { ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}), ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { document.getElementById('gate').style.display = 'flex'; document.getElementById('main').style.display = 'none'; throw new Error('请先登录'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  if (r.status === 202 && j.message) toast(j.message);
  return j;
}
async function save(path, body, method = 'POST') {
  const j = await api(path, { method, body });
  if (j.error) { toast(j.error, true); return false; }
  await load(); return true;
}
async function login() {
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('lu').value.trim(), password: document.getElementById('lp').value }) }).then(x => x.json()).catch(() => ({}));
  if (r.mfa_required) { location.href = '/mfa?token=' + encodeURIComponent(r.mfa_token) + '&next=/acct-checklist' + (r.phone_hint ? '&hint=' + encodeURIComponent(r.phone_hint) : ''); return; }
  if (!r.success) { document.getElementById('le').textContent = r.error || '登录失败'; return; }
  TOKEN = r.token; localStorage.setItem('acct_token', TOKEN); localStorage.setItem('adminToken', TOKEN);
  document.getElementById('gate').style.display = 'none'; load();
}
// 日期工具 (都按本地日期字符串 YYYY-MM-DD)
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function monday(s) { const d = s ? new Date(s + 'T00:00:00') : new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
const md = s => s ? String(s).slice(5, 10).replace('-', '/') : '';
function shiftWeek(n) { WEEK = addDays(WEEK, n); load(); }
// 默认核对上一周 (周五核对的是上周干的活出没出账单)
WEEK = monday(addDays(monday(), -7));

async function load() {
  const j = await api('/api/acct/checklist?week=' + WEEK);
  if (j.error) { toast(j.error, true); return; }
  D = j; WEEK = j.week_start;
  document.getElementById('main').style.display = '';
  render();
}
function render() {
  document.getElementById('wk').value = D.week_start;
  document.getElementById('wkLabel').textContent = `${md(D.week_start)}（周一）– ${md(D.week_end)}（周日）`;
  const st = s => D.items.filter(x => x.state === s);
  const miss = st('missing'), conf = st('confirm'), done = st('done'), na = st('na');
  const wkInv = D.week_invoices, wkPaid = wkInv.filter(i => i.pay_status === 'paid');
  const unpaidAmt = D.unpaid.reduce((s, i) => s + Math.max(0, i.subtotal - (i.pay_got || 0)), 0);
  document.getElementById('stats').innerHTML = [
    [done.length, '✅ 已出（已 link）', 'var(--green)'],
    [miss.length, '❌ 每周必出、还没 link', miss.length ? 'var(--red)' : 'var(--g400)'],
    [conf.length, '❓ 待确认有没有', conf.length ? 'var(--amber)' : 'var(--g400)'],
    [`${wkPaid.length}/${wkInv.length}`, '本周账单已收款', wkPaid.length < wkInv.length ? 'var(--amber)' : 'var(--green)'],
    [money(unpaidAmt), `所有未收款（${D.unpaid.length} 张）`, D.unpaid.length ? 'var(--red)' : 'var(--g400)'],
  ].map(([n, l, c]) => `<div class="stat"><div class="n" style="color:${c}">${n}</div><div class="l">${l}</div></div>`).join('');
  const dn = D.done;
  document.getElementById('doneBox').innerHTML = dn
    ? `<span class="tag t-ok">✅ ${esc(dn.done_by)} 已于 ${esc(String(dn.done_at).slice(0, 16))} 核对完成</span><button class="btn btn-outline btn-sm" onclick="weekDone(false)">撤销</button>`
    : `<button class="btn btn-green" onclick="weekDone(true)">✅ 这周核对完成</button>`;
  const fri = new Date().getDay() === 5;
  const nm = x => esc(x.company_name) + (x.label ? `（${esc(x.label)}）` : '') + ' ' + KIND[x.kind];
  let ban = '';
  if (!D.items.length) ban = `<div class="banner b-warn">还没设「应出账单清单」：先到「⚙️ 应出账单清单」把每个仓库要出的账单加进去。</div>`;
  else if (miss.length || conf.length) ban = `<div class="banner b-warn">${fri ? '今天周五，' : ''}${miss.length ? `还有 <b>${miss.length}</b> 张每周必出的账单没 link：${miss.map(nm).join('、')}` : ''}${miss.length && conf.length ? '<br>' : ''}${conf.length ? `<b>${conf.length}</b> 家要确认这周有没有：${conf.map(nm).join('、')}` : ''}</div>`;
  else ban = `<div class="banner b-ok">这周清单都核对过了 👍${D.extra.length ? `（还有 ${D.extra.length} 张这周的发票没 link）` : ''}</div>`;
  document.getElementById('banner').innerHTML = ban;
  const todo = miss.length + conf.length;
  const tabs = [['bills', `① 账单都出了吗${todo ? ` (${todo})` : ''}`], ['pay', `② 都付款了吗${D.unpaid.length ? ` (${D.unpaid.length})` : ''}`], ['setup', '⚙️ 应出账单清单']];
  document.getElementById('tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${TAB === k ? 'on' : ''}" onclick="TAB='${k}';render()">${l}</button>`).join('');
  document.getElementById('pane').innerHTML = TAB === 'bills' ? paneBills() : TAB === 'pay' ? panePay() : paneSetup();
}
function payTag(i) { const p = PAY[i.pay_status] || PAY.unpaid; return `<span class="tag ${p[1]}" title="${esc((i.pay_reasons || []).join('；'))}">${p[0]}</span>`; }
// 发票号点开 → 本页弹窗里看这张发票 (嵌入会计对账页的发票查看, 不跳转)
function invA(i) { return `<a href="/accounting?invoice=${i.id}" onclick="openInv(${i.id});return false" title="打开这张发票" style="color:inherit;font-weight:700;text-decoration:underline dotted">${esc(i.invoice_number)} 🔍</a>`; }
function openInv(id) {
  let m = document.getElementById('invFrameModal');
  if (!m) {
    m = document.createElement('div'); m.id = 'invFrameModal';
    m.style.cssText = 'position:fixed;inset:0;z-index:2500;background:transparent';
    m.innerHTML = '<iframe id="invFrame" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent" allowtransparency="true"></iframe>';
    document.body.appendChild(m);
  }
  document.getElementById('invFrame').src = '/accounting?embed=1&invoice=' + id;
  m.style.display = 'block';
}
function closeInv() { const m = document.getElementById('invFrameModal'); if (m) { m.style.display = 'none'; document.getElementById('invFrame').src = 'about:blank'; } }
window.addEventListener('message', e => { if (e.origin === location.origin && e.data === 'pa-inv-close') closeInv(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeInv(); });
// 页面中间的确认弹窗 (返回 Promise<boolean>)
function confirmBox(html, okLabel = '确定') {
  return new Promise(resolve => {
    const m = document.createElement('div');
    m.style.cssText = 'position:fixed;inset:0;z-index:3000;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px';
    m.innerHTML = `<div class="card" style="max-width:440px;width:100%;margin:0;box-shadow:0 10px 30px rgba(0,0,0,.25)"><div style="font-size:.9rem;line-height:1.6">${html}</div>
      <div class="row" style="justify-content:flex-end;margin-top:.9rem;gap:.5rem"><button class="btn btn-outline" data-v="0">取消</button><button class="btn btn-blue" data-v="1">${esc(okLabel)}</button></div></div>`;
    const done = v => { m.remove(); resolve(v); };
    m.addEventListener('click', e => { if (e.target === m) done(false); const b = e.target.closest('button[data-v]'); if (b) done(b.dataset.v === '1'); });
    document.body.appendChild(m);
    m.querySelector('button[data-v="1"]').focus();
  });
}
function findInv(id) {
  const all = [...(D.candidates || []), ...(D.extra || []), ...(D.unpaid || []), ...D.items.flatMap(x => [...(x.hints || []), ...(x.invoices || [])])];
  return all.find(i => i.id === id) || null;
}
function invLine(i) {
  const per = i.period_start || i.period_end ? `${md(i.period_start)}–${md(i.period_end)}` : md(i.invoice_date);
  return `<div class="inv">${invA(i)} · ${per} · ${money(i.subtotal)} ${payTag(i)}</div>`;
}

// ① 账单都出了吗: 会计把这周的发票 link 到清单项上才算出了
const STATE = {
  missing: '<span class="tag t-bad">❌ 还没出</span>',
  confirm: '<span class="tag t-warn">❓ 待确认有没有</span>',
  done: '<span class="tag t-ok">✅ 已出</span>',
};
function itemName(x) { return `<b>${esc(x.company_name)}</b>${x.label ? ` <span class="tag t-blue">${esc(x.label)}</span>` : ''}`; }
function candOptions(x) {
  const hintIds = new Set(x.hints.map(i => i.id));
  const opt = i => `<option value="${i.id}">${esc(i.invoice_number)} · ${esc(i.company_name)}${i.bill_to ? ' · ' + esc(i.bill_to) : ''} · ${md(i.period_start)}–${md(i.period_end)} · ${money(i.subtotal)}</option>`;
  const same = D.candidates.filter(i => !hintIds.has(i.id) && i.company_name && i.company_name.toLowerCase().replace(/[^a-z0-9]/g, '') === x.company_name.toLowerCase().replace(/[^a-z0-9]/g, ''));
  const rest = D.candidates.filter(i => !hintIds.has(i.id) && !same.includes(i));
  return `<option value="">选发票 link…</option>${x.hints.length ? `<optgroup label="可能是这张（同公司、账期在这周）">${x.hints.map(opt).join('')}</optgroup>` : ''}${same.length ? `<optgroup label="同公司其他发票">${same.map(opt).join('')}</optgroup>` : ''}${rest.length ? `<optgroup label="其他公司（前后一周）">${rest.map(opt).join('')}</optgroup>` : ''}`;
}
function paneBills() {
  const order = { missing: 0, confirm: 1, na: 2, done: 3 };
  const items = [...D.items].sort((a, b) => order[a.state] - order[b.state] || a.company_name.localeCompare(b.company_name) || String(a.label).localeCompare(String(b.label)));
  let h = `<div class="card scroll"><h3>这周应出的账单</h3><div class="muted" style="margin-bottom:.4rem">每一项都要把这周出的发票 <b>link</b> 上才算出了；系统只会提示「可能是这张」。这周没有的点「本周没有」。</div>`;
  if (!items.length) h += `<div class="muted">清单是空的，先到「⚙️ 应出账单清单」添加。</div>`;
  else h += `<table><thead><tr><th>公司 / 仓库</th><th>类型</th><th>状态</th><th>已 link 的账单</th><th>操作</th></tr></thead><tbody>` + items.map(x => {
    const s = x.state === 'na' ? `<span class="tag t-gray">➖ 本周没有</span>${x.mark.note ? `<div class="muted">${esc(x.mark.note)}</div>` : ''}<div class="muted">${esc(x.mark.marked_by)}</div>` : STATE[x.state];
    const linked = x.invoices.map(i => invLine(i) + `<button class="btn btn-outline btn-sm" style="padding:.05rem .4rem" title="取消 link" onclick="unlink(${i.id})">✕</button>`).join('');
    const hint = x.hints.map(i => `<div class="inv" style="color:var(--amber)">可能是 ${invA(i)}${i.bill_to ? ' · ' + esc(i.bill_to) : ''} · ${money(i.subtotal)} <button class="btn btn-blue btn-sm" style="padding:.05rem .45rem" onclick="link(${x.id},${i.id})">link</button></div>`).join('');
    const act = `<div class="row" style="flex-wrap:nowrap"><select id="sel${x.id}" style="max-width:220px">${candOptions(x)}</select><button class="btn btn-blue btn-sm" onclick="linkSel(${x.id})">link</button></div>`
      + (x.state === 'na' ? `<button class="btn btn-outline btn-sm" style="margin-top:.3rem" onclick="unmark(${x.id})">撤销「本周没有」</button>`
        : x.state !== 'done' ? `<button class="btn btn-outline btn-sm" style="margin-top:.3rem" onclick="markNa(${x.id})">本周没有</button>` : '');
    return `<tr class="${x.state === 'missing' ? 'missing' : ''}"><td>${itemName(x)}<div class="muted">${FREQ[x.freq] || ''}${x.note ? ' · ' + esc(x.note) : ''}</div></td>
      <td style="white-space:nowrap">${KIND[x.kind]}</td><td>${s}</td><td>${linked || hint || '<span class="muted">—</span>'}</td><td>${act}</td></tr>`;
  }).join('') + `</tbody></table>`;
  h += `</div>`;
  if (D.extra.length) h += `<div class="card scroll"><h3>这周还没 link 的发票（${D.extra.length}）</h3><div class="muted" style="margin-bottom:.4rem">账期在这周、还没 link 到清单任何一项的。选一项 link 上；以后每周都会有的，先到「⚙️ 应出账单清单」加一项。</div>
    <table><thead><tr><th>公司</th><th>类型</th><th>账单</th><th>link 到</th></tr></thead><tbody>` + D.extra.map(i => `<tr><td>${esc(i.company_name)}${i.bill_to ? `<div class="muted">Bill To: ${esc(i.bill_to)}</div>` : ''}</td><td style="white-space:nowrap">${KIND[i.kind]}</td><td>${invLine(i)}</td>
      <td><div class="row" style="flex-wrap:nowrap"><select id="xsel${i.id}" style="max-width:220px"><option value="">选清单项…</option>${D.items.map(x => `<option value="${x.id}">${esc(x.company_name)}${x.label ? '（' + esc(x.label) + '）' : ''} · ${KIND[x.kind]}</option>`).join('')}</select>
        <button class="btn btn-blue btn-sm" onclick="linkExtra(${i.id})">link</button></div></td></tr>`).join('') + `</tbody></table></div>`;
  return h;
}
async function link(expectId, invoiceId) {
  const x = D.items.find(e => e.id === expectId), i = findInv(invoiceId);
  const inv = i ? `<b>${esc(i.invoice_number)}</b> · ${esc(i.company_name || '')}${i.bill_to ? ' · ' + esc(i.bill_to) : ''} · ${md(i.period_start)}–${md(i.period_end)} · <b>${money(i.subtotal)}</b>` : '这张发票';
  const item = x ? `${itemName(x)} · ${KIND[x.kind] || ''}` : '这一项';
  if (!(await confirmBox(`把发票<div style="margin:.3rem 0 .5rem;padding:.4rem .6rem;background:#f8fafc;border-radius:8px">${inv}</div>link 到 ${item}（${md(WEEK)} 这周）？`, '确定 link'))) return;
  save('/api/acct/checklist/link', { week: WEEK, expect_id: expectId, invoice_id: invoiceId });
}
function linkSel(expectId) { const v = document.getElementById('sel' + expectId).value; if (!v) { toast('先选一张发票', true); return; } link(expectId, +v); }
function linkExtra(invoiceId) { const v = document.getElementById('xsel' + invoiceId).value; if (!v) { toast('先选清单项', true); return; } link(+v, invoiceId); }
async function unlink(invoiceId) {
  const i = findInv(invoiceId);
  if (!(await confirmBox(`取消 <b>${esc(i ? i.invoice_number : '这张发票')}</b> 的 link？`, '取消 link'))) return;
  save('/api/acct/checklist/link', { invoice_id: invoiceId, unlink: true });
}
async function markNa(id) {
  const x = D.items.find(e => e.id === id);
  const weekly = x.freq === 'weekly';
  const note = await showPrompt(weekly ? '这张每周都该出，这周为什么没有？（例如：这周没干活 / 并到另一张账单里了）' : '确认这周没有这张账单。备注（可不填）：', '');
  if (note == null) return;
  if (weekly && !note.trim()) { toast('请写一下原因', true); return; }
  save('/api/acct/checklist/mark', { week: WEEK, expect_id: id, status: 'na', note });
}
function unmark(id) { save('/api/acct/checklist/mark', { week: WEEK, expect_id: id, status: '' }); }
async function weekDone(done) {
  if (done) {
    const open = D.items.filter(x => x.state === 'missing' || x.state === 'confirm').length;
    if (open && !await showConfirm(`还有 ${open} 项没 link / 没确认，确定标记这周核对完成？`)) return;
    if (D.unpaid.length && !await showConfirm(`还有 ${D.unpaid.length} 张账单没收到款，确定标记这周核对完成？`)) return;
  }
  save('/api/acct/checklist/week-done', { week: WEEK, done });
}

// ② 都付款了吗
function panePay() {
  const list = PAY_SCOPE === 'week' ? D.week_invoices : D.unpaid;
  const groups = {};
  list.forEach(i => { (groups[i.company_name || '（无公司名）'] = groups[i.company_name || '（无公司名）'] || []).push(i); });
  const today = ymd(new Date());
  const age = d => d ? Math.round((new Date(today) - new Date(String(d).slice(0, 10))) / 864e5) : null;
  let h = `<div class="card"><div class="row" style="justify-content:space-between">
    <div class="row"><button class="tab ${PAY_SCOPE === 'all' ? 'on' : ''}" onclick="PAY_SCOPE='all';render()">所有没收齐的账单（到本周为止）</button>
      <button class="tab ${PAY_SCOPE === 'week' ? 'on' : ''}" onclick="PAY_SCOPE='week';render()">只看这周的账单</button></div>
    <span class="muted">收款状态 = 会计对账页的核查口径：关联了银行交易、且银行标注审核通过才算收到。记收款请到 <a href="/accounting" target="_blank">会计对账</a>。</span></div></div>`;
  const names = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  if (!names.length) return h + `<div class="card"><div class="banner b-ok">${PAY_SCOPE === 'week' ? '这周没有账单' : '所有账单都收到款了 👍'}</div></div>`;
  h += `<div class="card scroll"><table><thead><tr><th>账单</th><th>类型</th><th>账期</th><th>金额</th><th>已收</th><th>状态</th><th>开票</th><th>跟进备注</th></tr></thead><tbody>`;
  for (const n of names) {
    const g = groups[n], owe = g.reduce((s, i) => s + (i.pay_status === 'paid' ? 0 : Math.max(0, i.subtotal - (i.pay_got || 0))), 0);
    h += `<tr class="co-head"><td colspan="8">${esc(n)} <span class="muted">· ${g.length} 张${owe > 0 ? ` · 还欠 <b style="color:var(--red)">${money(owe)}</b>` : ''}</span></td></tr>`;
    h += g.map(i => {
      const a = age(i.invoice_date);
      return `<tr><td>${invA(i)}</td><td>${KIND[i.kind]}</td><td>${md(i.period_start)}–${md(i.period_end)}</td><td>${money(i.subtotal)}</td>
        <td>${i.pay_got != null ? money(i.pay_got) : '—'}</td><td>${payTag(i)}${i.pay_reasons.length ? `<div class="muted">${esc(i.pay_reasons.join('；'))}</div>` : ''}</td>
        <td>${md(i.invoice_date)}${a != null && i.pay_status !== 'paid' ? `<div class="muted" style="${a > 30 ? 'color:var(--red);font-weight:700' : ''}">${a} 天</div>` : ''}</td>
        <td style="min-width:180px">${i.follow ? `<div style="font-size:.8rem">${esc(i.follow.note)}</div><div class="muted">${esc(i.follow.updated_by)} · ${esc(String(i.follow.updated_at).slice(5, 16))}</div>` : ''}
          <button class="btn btn-outline btn-sm" style="margin-top:.2rem" onclick="follow(${i.id})">${i.follow ? '改' : '＋ 备注'}</button></td></tr>`;
    }).join('');
  }
  return h + `</tbody></table></div>`;
}
async function follow(id) {
  const all = [...D.unpaid, ...D.week_invoices], i = all.find(x => x.id === id);
  const note = await showPrompt('跟进备注（例如：10/24 已发邮件催款 / 客户说下周付）。清空 = 删除备注', (i && i.follow && i.follow.note) || '');
  if (note == null) return;
  save('/api/acct/checklist/pay-follow', { invoice_id: id, note });
}

// ⚙️ 应出账单清单
function paneSetup() {
  let h = `<div class="card"><h3>添加应出账单</h3><div class="muted" style="margin-bottom:.5rem">每个仓库 / 公司要出的账单一条一条加。同一个仓库既有卸柜又有劳务的，加两条；同一类型每周有两张的（例如 Elogistek 的 EL 和 Office_East_Coast），用「标签」区分各加一条。</div>
    <div class="row"><input id="nCo" list="coList" placeholder="公司 / 仓库名" style="flex:1;min-width:220px">
      <datalist id="coList">${D.companies.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <select id="nKind"><option value="labor">👷 劳务（按工时）</option><option value="container">🚛 卸柜（按柜）</option><option value="any">📄 不限类型</option></select>
      <select id="nFreq"><option value="weekly">每周必出</option><option value="confirm">有时有有时没有 · 每周确认</option><option value="occasional">偶尔有 · 每周确认</option></select>
      <input id="nLabel" placeholder="标签（可选，如 EL）" style="width:150px">
      <input id="nNote" placeholder="备注（可选）" style="width:180px">
      <button class="btn btn-blue" onclick="addExpect()">＋ 添加</button></div></div>`;
  h += `<div class="card scroll"><h3>当前清单（${D.expects.length}）</h3>`;
  if (!D.expects.length) h += `<div class="muted">还没有</div>`;
  else h += `<table><thead><tr><th>公司 / 仓库</th><th>类型</th><th>频率</th><th>备注</th><th>状态</th><th></th></tr></thead><tbody>` + D.expects.map(x => `<tr style="${x.active ? '' : 'opacity:.55'}">
      <td>${itemName(x)}</td><td style="white-space:nowrap">${KIND[x.kind]}</td>
      <td><select onchange="save('/api/acct/checklist/expect/${x.id}', {freq: this.value}, 'PUT')">${Object.entries(FREQ).map(([k, l]) => `<option value="${k}" ${x.freq === k ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
      <td>${esc(x.note)}</td>
      <td>${x.active ? '<span class="tag t-ok">核对中</span>' : '<span class="tag t-gray">已停用</span>'}</td>
      <td style="white-space:nowrap"><button class="btn btn-outline btn-sm" onclick="editExpect(${x.id})">标签 / 备注</button>
        <button class="btn btn-outline btn-sm" onclick="save('/api/acct/checklist/expect/${x.id}', {active: ${x.active ? 0 : 1}}, 'PUT')">${x.active ? '停用' : '启用'}</button>
        <button class="btn btn-outline btn-sm" style="color:var(--red)" onclick="delExpect(${x.id})">删除</button></td></tr>`).join('') + `</tbody></table>`;
  return h + `</div>`;
}
function addExpect() {
  const v = id => document.getElementById(id).value;
  if (!v('nCo').trim()) { toast('请填写公司 / 仓库名', true); return; }
  save('/api/acct/checklist/expect', { company_name: v('nCo'), kind: v('nKind'), freq: v('nFreq'), label: v('nLabel'), note: v('nNote') });
}
async function editExpect(id) {
  const x = D.expects.find(e => e.id === id);
  const label = await showPrompt('标签（同公司同类型有两张时区分用，可留空）', x.label || '');
  if (label == null) return;
  const note = await showPrompt('备注', x.note || '');
  if (note == null) return;
  save('/api/acct/checklist/expect/' + id, { label, note }, 'PUT');
}
async function delExpect(id) { if (await showConfirm('从清单删除这一条？（已 link 的记录也会一起删掉；不想核对了可以先「停用」）')) save('/api/acct/checklist/expect/' + id, null, 'DELETE'); }

if (TOKEN) load().catch(() => {}); else document.getElementById('gate').style.display = 'flex';
</script>
<script src="/account-badge.js" defer></script>
</body>
