<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每周核对清单 · Prime Anchor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<style>
:root{--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--blue:#29AAE1;--red:#dc2626;--green:#16a34a;--amber:#d97706;--navy:#0f4c6b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#eef3f8;color:#1f2937}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:.25rem;border:none;border-radius:8px;padding:.45rem .85rem;font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;text-decoration:none}
.btn-sm{padding:.25rem .6rem;font-size:.76rem}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-outline{background:#fff;color:var(--g600);border:1px solid var(--g300)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{padding:.4rem .5rem;border:1px solid var(--g300);border-radius:6px;font-size:.85rem;font-family:inherit;background:#fff}
.muted{color:var(--g500);font-size:.78rem}
.tag{display:inline-block;border-radius:999px;padding:.08rem .55rem;font-size:.72rem;font-weight:700;white-space:nowrap}
.t-ok{background:#dcfce7;color:#166534}.t-bad{background:#fee2e2;color:#991b1b}.t-warn{background:#fef3c7;color:#92400e}.t-gray{background:var(--g100);color:var(--g600)}.t-blue{background:#e0f2fe;color:#075985}
.tabs{display:flex;gap:.4rem;margin:12px 0;flex-wrap:wrap}
.tab{border:1px solid var(--g200);background:#fff;border-radius:999px;padding:.35rem .95rem;font-size:.84rem;cursor:pointer;font-family:inherit;color:var(--g600)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:10px 14px}
.stat .n{font-size:1.5rem;font-weight:800}.stat .l{font-size:.78rem;color:var(--g500)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-size:.74rem;color:var(--g500);font-weight:700;padding:.4rem .5rem;border-bottom:1px solid var(--g200);white-space:nowrap}
td{padding:.5rem;border-bottom:1px solid var(--g100);vertical-align:top}
tr.missing td{background:#fff7f7}
.scroll{overflow-x:auto}
.banner{border-radius:10px;padding:.6rem .9rem;font-size:.85rem;margin-top:10px}
.b-warn{background:#fef3c7;color:#78350f}.b-ok{background:#dcfce7;color:#14532d}
h3{margin:0 0 .5rem;font-size:.98rem;color:var(--navy)}
.inv{font-size:.8rem;margin:.1rem 0}
.co-head td{background:#f8fafc;font-weight:800;color:var(--navy)}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;background:#eef3f8;display:none;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="max-width:360px;width:100%;text-align:center">
    <div style="font-weight:800;margin-bottom:.6rem">📋 每周核对清单</div>
    <input id="lu" placeholder="用户名" style="width:100%;margin-bottom:.5rem">
    <input id="lp" type="password" placeholder="密码" style="width:100%" onkeydown="if(event.key==='Enter')login()">
    <div id="le" style="color:var(--red);font-size:.8rem;min-height:1.1em;margin-top:.4rem"></div>
    <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="login()">登录</button>
  </div>
</div>
<div class="wrap" id="main" style="display:none">
  <div class="row" style="justify-content:space-between">
    <div><div style="font-size:1.2rem;font-weight:800;color:var(--navy)">📋 会计每周核对清单</div>
      <div class="muted">每周五核对：① 该出的账单都出了没有（同一个仓库有卸柜也有劳务的，两张都要出）② 出了的账单客户都付款了没有</div></div>
    <div class="row">
      <a class="btn btn-outline" href="/accounting" target="_blank">🧾 会计对账 ↗</a>
      <button class="btn btn-outline" onclick="load()">↻ 刷新</button>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button class="btn btn-outline btn-sm" onclick="shiftWeek(-7)">◀ 上一周</button>
        <input type="date" id="wk" onchange="WEEK=monday(this.value);load()">
        <button class="btn btn-outline btn-sm" onclick="shiftWeek(7)">下一周 ▶</button>
        <b id="wkLabel"></b>
      </div>
      <div id="doneBox" class="row"></div>
    </div>
    <div id="banner"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div id="pane"></div>
</div>
<script>
let TOKEN = localStorage.getItem('acct_token') || localStorage.getItem('adminToken') || '';
let D = null, TAB = 'bills', WEEK = '', PAY_SCOPE = 'all';
const KIND = { container: '🚛 卸柜', labor: '👷 劳务' };
const PAY = { paid: ['✅ 已收款', 't-ok'], partial: ['🟡 部分收款', 't-warn'], review: ['⏳ 待审核', 't-blue'], unpaid: ['❌ 未收款', 't-bad'] };
function esc(s) { if (s == null) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML.replace(/"/g, '&quot;'); }
function money(n) { return '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function toast(msg, bad) {
  const t = document.createElement('div'); t.textContent = msg;
  t.style.cssText = `position:fixed;left:50%;top:18px;transform:translateX(-50%);background:${bad ? '#dc2626' : '#16a34a'};color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;z-index:3000`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || 'GET', headers: { ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}), ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { document.getElementById('gate').style.display = 'flex'; document.getElementById('main').style.display = 'none'; throw new Error('请先登录'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  if (r.status === 202 && j.message) toast(j.message);
  return j;
}
async function save(path, body, method = 'POST') {
  const j = await api(path, { method, body });
  if (j.error) { toast(j.error, true); return false; }
  await load(); return true;
}
async function login() {
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('lu').value.trim(), password: document.getElementById('lp').value }) }).then(x => x.json()).catch(() => ({}));
  if (r.mfa_required) { location.href = '/mfa?token=' + encodeURIComponent(r.mfa_token) + '&next=/acct-checklist' + (r.phone_hint ? '&hint=' + encodeURIComponent(r.phone_hint) : ''); return; }
  if (!r.success) { document.getElementById('le').textContent = r.error || '登录失败'; return; }
  TOKEN = r.token; localStorage.setItem('acct_token', TOKEN); localStorage.setItem('adminToken', TOKEN);
  document.getElementById('gate').style.display = 'none'; load();
}
// 日期工具 (都按本地日期字符串 YYYY-MM-DD)
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function monday(s) { const d = s ? new Date(s + 'T00:00:00') : new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); }
const md = s => s ? String(s).slice(5, 10).replace('-', '/') : '';
function shiftWeek(n) { WEEK = addDays(WEEK, n); load(); }
// 默认核对上一周 (周五核对的是上周干的活出没出账单)
WEEK = monday(addDays(monday(), -7));

async function load() {
  const j = await api('/api/acct/checklist?week=' + WEEK);
  if (j.error) { toast(j.error, true); return; }
  D = j; WEEK = j.week_start;
  document.getElementById('main').style.display = '';
  render();
}
function render() {
  document.getElementById('wk').value = D.week_start;
  document.getElementById('wkLabel').textContent = `${md(D.week_start)}（周一）– ${md(D.week_end)}（周日）`;
  const miss = D.items.filter(x => x.state === 'missing'), done = D.items.filter(x => x.state === 'done'), na = D.items.filter(x => x.state === 'na');
  const wkInv = D.week_invoices, wkPaid = wkInv.filter(i => i.pay_status === 'paid');
  const unpaidAmt = D.unpaid.reduce((s, i) => s + Math.max(0, i.subtotal - (i.pay_got || 0)), 0);
  document.getElementById('stats').innerHTML = [
    [D.items.length, '应出账单（清单）', 'var(--navy)'],
    [done.length, '✅ 已出', 'var(--green)'],
    [miss.length, '❌ 还没出', miss.length ? 'var(--red)' : 'var(--g400)'],
    [`${wkPaid.length}/${wkInv.length}`, '本周账单已收款', wkPaid.length < wkInv.length ? 'var(--amber)' : 'var(--green)'],
    [money(unpaidAmt), `所有未收款（${D.unpaid.length} 张）`, D.unpaid.length ? 'var(--red)' : 'var(--g400)'],
  ].map(([n, l, c]) => `<div class="stat"><div class="n" style="color:${c}">${n}</div><div class="l">${l}</div></div>`).join('');
  const dn = D.done;
  document.getElementById('doneBox').innerHTML = dn
    ? `<span class="tag t-ok">✅ ${esc(dn.done_by)} 已于 ${esc(String(dn.done_at).slice(0, 16))} 核对完成</span><button class="btn btn-outline btn-sm" onclick="weekDone(false)">撤销</button>`
    : `<button class="btn btn-green" onclick="weekDone(true)">✅ 这周核对完成</button>`;
  const fri = new Date().getDay() === 5;
  let ban = '';
  if (!D.items.length) ban = `<div class="banner b-warn">还没设「应出账单清单」：先到「⚙️ 应出账单清单」把每个仓库要出的账单加进去（一个仓库有卸柜也有劳务就加两条）。</div>`;
  else if (miss.length) ban = `<div class="banner b-warn">${fri ? '今天周五，' : ''}这周还有 <b>${miss.length}</b> 张账单没出：${miss.map(x => esc(x.company_name) + ' ' + KIND[x.kind]).join('、')}</div>`;
  else ban = `<div class="banner b-ok">这周清单里的账单都出了 👍${D.extra.length ? `（另有 ${D.extra.length} 张清单外的账单）` : ''}</div>`;
  document.getElementById('banner').innerHTML = ban;
  const tabs = [['bills', `① 账单都出了吗${miss.length ? ` (${miss.length})` : ''}`], ['pay', `② 都付款了吗${D.unpaid.length ? ` (${D.unpaid.length})` : ''}`], ['setup', '⚙️ 应出账单清单']];
  document.getElementById('tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${TAB === k ? 'on' : ''}" onclick="TAB='${k}';render()">${l}</button>`).join('');
  document.getElementById('pane').innerHTML = TAB === 'bills' ? paneBills() : TAB === 'pay' ? panePay() : paneSetup();
}
function payTag(i) { const p = PAY[i.pay_status] || PAY.unpaid; return `<span class="tag ${p[1]}" title="${esc((i.pay_reasons || []).join('；'))}">${p[0]}</span>`; }
function invLine(i) {
  const per = i.period_start || i.period_end ? `${md(i.period_start)}–${md(i.period_end)}` : md(i.invoice_date);
  return `<div class="inv"><b>${esc(i.invoice_number)}</b> · ${per} · ${money(i.subtotal)} ${payTag(i)}</div>`;
}

// ① 账单都出了吗
function paneBills() {
  const order = { missing: 0, na: 1, done: 2 };
  const items = [...D.items].sort((a, b) => order[a.state] - order[b.state] || a.company_name.localeCompare(b.company_name));
  let h = `<div class="card scroll"><h3>这周应出的账单</h3>`;
  if (!items.length) h += `<div class="muted">清单是空的，先到「⚙️ 应出账单清单」添加。</div>`;
  else h += `<table><thead><tr><th>公司 / 仓库</th><th>类型</th><th>状态</th><th>出了的账单</th><th></th></tr></thead><tbody>` + items.map(x => {
    const st = x.state === 'done' ? '<span class="tag t-ok">✅ 已出</span>' : x.state === 'na'
      ? `<span class="tag t-gray">➖ 本周不需要</span><div class="muted">${esc(x.mark.note)} · ${esc(x.mark.marked_by)}</div>`
      : '<span class="tag t-bad">❌ 还没出</span>';
    const act = x.state === 'missing' ? `<button class="btn btn-outline btn-sm" onclick="markNa(${x.id})">本周不需要</button>`
      : x.state === 'na' ? `<button class="btn btn-outline btn-sm" onclick="unmark(${x.id})">撤销</button>` : '';
    return `<tr class="${x.state === 'missing' ? 'missing' : ''}"><td><b>${esc(x.company_name)}</b>${x.note ? `<div class="muted">${esc(x.note)}</div>` : ''}</td>
      <td>${KIND[x.kind]}</td><td>${st}</td><td>${x.invoices.map(invLine).join('') || '<span class="muted">—</span>'}</td><td>${act}</td></tr>`;
  }).join('') + `</tbody></table>`;
  h += `</div>`;
  if (D.extra.length) h += `<div class="card scroll"><h3>清单外的账单</h3><div class="muted" style="margin-bottom:.4rem">这周出了、但不在应出清单里的。以后每周都要出的话点「加入清单」。</div>
    <table><thead><tr><th>公司</th><th>类型</th><th>账单</th><th></th></tr></thead><tbody>` + D.extra.map(i => `<tr><td>${esc(i.company_name)}</td><td>${KIND[i.kind]}</td><td>${invLine(i)}</td>
      <td><button class="btn btn-outline btn-sm" onclick='addExpect(${JSON.stringify(i.company_name)}, "${i.kind}")'>＋ 加入清单</button></td></tr>`).join('') + `</tbody></table></div>`;
  return h;
}
async function markNa(id) {
  const note = prompt('这周为什么不用出这张账单？（例如：这周没干活 / 并到另一张账单里了）');
  if (note == null) return;
  if (!note.trim()) { toast('请写一下原因', true); return; }
  save('/api/acct/checklist/mark', { week: WEEK, expect_id: id, status: 'na', note });
}
function unmark(id) { save('/api/acct/checklist/mark', { week: WEEK, expect_id: id, status: '' }); }
async function weekDone(done) {
  if (done) {
    const miss = D.items.filter(x => x.state === 'missing').length;
    if (miss && !confirm(`还有 ${miss} 张账单没出，确定标记这周核对完成？`)) return;
    if (D.unpaid.length && !confirm(`还有 ${D.unpaid.length} 张账单没收到款，确定标记这周核对完成？`)) return;
  }
  save('/api/acct/checklist/week-done', { week: WEEK, done });
}

// ② 都付款了吗
function panePay() {
  const list = PAY_SCOPE === 'week' ? D.week_invoices : D.unpaid;
  const groups = {};
  list.forEach(i => { (groups[i.company_name || '（无公司名）'] = groups[i.company_name || '（无公司名）'] || []).push(i); });
  const today = ymd(new Date());
  const age = d => d ? Math.round((new Date(today) - new Date(String(d).slice(0, 10))) / 864e5) : null;
  let h = `<div class="card"><div class="row" style="justify-content:space-between">
    <div class="row"><button class="tab ${PAY_SCOPE === 'all' ? 'on' : ''}" onclick="PAY_SCOPE='all';render()">所有没收齐的账单（到本周为止）</button>
      <button class="tab ${PAY_SCOPE === 'week' ? 'on' : ''}" onclick="PAY_SCOPE='week';render()">只看这周的账单</button></div>
    <span class="muted">收款状态 = 会计对账页的核查口径：关联了银行交易、且银行标注审核通过才算收到。记收款请到 <a href="/accounting" target="_blank">会计对账</a>。</span></div></div>`;
  const names = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  if (!names.length) return h + `<div class="card"><div class="banner b-ok">${PAY_SCOPE === 'week' ? '这周没有账单' : '所有账单都收到款了 👍'}</div></div>`;
  h += `<div class="card scroll"><table><thead><tr><th>账单</th><th>类型</th><th>账期</th><th>金额</th><th>已收</th><th>状态</th><th>开票</th><th>跟进备注</th></tr></thead><tbody>`;
  for (const n of names) {
    const g = groups[n], owe = g.reduce((s, i) => s + (i.pay_status === 'paid' ? 0 : Math.max(0, i.subtotal - (i.pay_got || 0))), 0);
    h += `<tr class="co-head"><td colspan="8">${esc(n)} <span class="muted">· ${g.length} 张${owe > 0 ? ` · 还欠 <b style="color:var(--red)">${money(owe)}</b>` : ''}</span></td></tr>`;
    h += g.map(i => {
      const a = age(i.invoice_date);
      return `<tr><td><b>${esc(i.invoice_number)}</b></td><td>${KIND[i.kind]}</td><td>${md(i.period_start)}–${md(i.period_end)}</td><td>${money(i.subtotal)}</td>
        <td>${i.pay_got != null ? money(i.pay_got) : '—'}</td><td>${payTag(i)}${i.pay_reasons.length ? `<div class="muted">${esc(i.pay_reasons.join('；'))}</div>` : ''}</td>
        <td>${md(i.invoice_date)}${a != null && i.pay_status !== 'paid' ? `<div class="muted" style="${a > 30 ? 'color:var(--red);font-weight:700' : ''}">${a} 天</div>` : ''}</td>
        <td style="min-width:180px">${i.follow ? `<div style="font-size:.8rem">${esc(i.follow.note)}</div><div class="muted">${esc(i.follow.updated_by)} · ${esc(String(i.follow.updated_at).slice(5, 16))}</div>` : ''}
          <button class="btn btn-outline btn-sm" style="margin-top:.2rem" onclick="follow(${i.id})">${i.follow ? '改' : '＋ 备注'}</button></td></tr>`;
    }).join('');
  }
  return h + `</tbody></table></div>`;
}
function follow(id) {
  const all = [...D.unpaid, ...D.week_invoices], i = all.find(x => x.id === id);
  const note = prompt('跟进备注（例如：10/24 已发邮件催款 / 客户说下周付）。清空 = 删除备注', (i && i.follow && i.follow.note) || '');
  if (note == null) return;
  save('/api/acct/checklist/pay-follow', { invoice_id: id, note });
}

// ⚙️ 应出账单清单
function paneSetup() {
  let h = `<div class="card"><h3>添加应出账单</h3><div class="muted" style="margin-bottom:.5rem">每个仓库 / 公司每周要出的账单一条一条加。同一个仓库既有卸柜又有劳务的，加两条。系统按「公司名 + 类型」和这周账期对上就算已出（公司名忽略大小写和标点）。</div>
    <div class="row"><input id="nCo" list="coList" placeholder="公司 / 仓库名（和发票上的公司名一致）" style="flex:1;min-width:240px">
      <datalist id="coList">${D.companies.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <select id="nKind"><option value="labor">👷 劳务（按工时）</option><option value="container">🚛 卸柜（按柜）</option></select>
      <input id="nNote" placeholder="备注（可选）" style="width:200px">
      <button class="btn btn-blue" onclick="addExpect(document.getElementById('nCo').value, document.getElementById('nKind').value, document.getElementById('nNote').value)">＋ 添加</button></div></div>`;
  if (D.suggestions.length) h += `<div class="card scroll"><h3>💡 建议加入</h3><div class="muted" style="margin-bottom:.4rem">最近 8 周出过、但还不在清单里的</div><table><tbody>` +
    D.suggestions.map(s => `<tr><td><b>${esc(s.company_name)}</b></td><td>${KIND[s.kind]}</td><td class="muted">最近 8 周 ${s.count} 张 · 最后账期到 ${md(s.last)}</td>
      <td><button class="btn btn-outline btn-sm" onclick='addExpect(${JSON.stringify(s.company_name)}, "${s.kind}")'>＋ 加入清单</button></td></tr>`).join('') + `</tbody></table></div>`;
  h += `<div class="card scroll"><h3>当前清单（${D.expects.length}）</h3>`;
  if (!D.expects.length) h += `<div class="muted">还没有</div>`;
  else h += `<table><thead><tr><th>公司 / 仓库</th><th>类型</th><th>备注</th><th>状态</th><th></th></tr></thead><tbody>` + D.expects.map(x => `<tr style="${x.active ? '' : 'opacity:.55'}">
      <td><b>${esc(x.company_name)}</b></td><td>${KIND[x.kind]}</td><td>${esc(x.note)}</td>
      <td>${x.active ? '<span class="tag t-ok">每周核对</span>' : '<span class="tag t-gray">已停用</span>'}</td>
      <td style="white-space:nowrap"><button class="btn btn-outline btn-sm" onclick="editNote(${x.id})">备注</button>
        <button class="btn btn-outline btn-sm" onclick="save('/api/acct/checklist/expect/${x.id}', {active: ${x.active ? 0 : 1}}, 'PUT')">${x.active ? '停用' : '启用'}</button>
        <button class="btn btn-outline btn-sm" style="color:var(--red)" onclick="delExpect(${x.id})">删除</button></td></tr>`).join('') + `</tbody></table>`;
  return h + `</div>`;
}
function addExpect(company_name, kind, note) {
  if (!String(company_name || '').trim()) { toast('请填写公司 / 仓库名', true); return; }
  save('/api/acct/checklist/expect', { company_name, kind, note: note || '' });
}
function editNote(id) {
  const x = D.expects.find(e => e.id === id);
  const note = prompt('备注', x.note || '');
  if (note != null) save('/api/acct/checklist/expect/' + id, { note }, 'PUT');
}
function delExpect(id) { if (confirm('从清单删除这一条？（不想核对了也可以先「停用」）')) save('/api/acct/checklist/expect/' + id, null, 'DELETE'); }

if (TOKEN) load().catch(() => {}); else document.getElementById('gate').style.display = 'flex';
</script>
</body>
</html>
