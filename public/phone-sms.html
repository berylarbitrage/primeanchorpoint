<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机短信 — Prime Anchor</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  老板【个人手机】里的短信。公司号码的短信在 /sms-inbox.html（走 Twilio）；这一页
  的数据是桌面版「SMS 译信」用 adb 从手机读出来、翻译并筛查完之后推上来的
  （POST /api/device-sms/push，设备令牌鉴权）。手机短信只有连着它的那台电脑读得到。

  发短信同理：网页只入队，那台电脑取走后用手机发出去再回报结果。

  样式刻意跟 sms-inbox.html 对齐（同一套变量、同样的卡片和气泡）——同一个人在两个
  页面之间来回切，长得不一样只会让人觉得这页是半成品。
-->
<style>
:root{--blue:#92400e;--sky:#b45309;--sky-light:#fef3c7;--accent:#f59e0b;--white:#fff;--off-white:#fffbeb;
  --gray-100:#f3f4f6;--gray-200:#e2e5ea;--gray-400:#9BA3B0;--gray-600:#5F6B7A;--gray-800:#2D3748;
  --red:#E63946;--green:#2D9D78;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',"Microsoft YaHei",sans-serif;background:var(--off-white);color:var(--gray-800);
  height:100vh;overflow:hidden}
button,input,select,textarea{font-family:inherit}

/* ── 登录 ── */
.gate{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate-card{background:var(--white);border:1px solid #fde68a;border-radius:16px;padding:28px 24px;
  width:min(360px,100%);box-shadow:0 4px 20px rgba(146,64,14,.08);display:grid;gap:12px;text-align:center}
.gate-card img{width:64px;margin:0 auto 4px}
.gate-card h1{font-size:1.1rem;color:var(--sky)}
.gate-card p{font-size:.8rem;color:var(--gray-600);line-height:1.5}
.gate-card input{padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius);font-size:16px;outline:none}
.gate-card input:focus{border-color:var(--sky)}
.err{color:var(--red);font-size:.8rem;min-height:18px}

/* ── 框架 ── */
.app{display:flex;height:100vh}
.sidebar{width:340px;flex-shrink:0;background:var(--white);border-right:1.5px solid #fde68a;
  display:flex;flex-direction:column;min-width:0}
.detail{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--off-white)}
.header{background:var(--white);border-bottom:1.5px solid #fde68a;padding:10px 14px;display:flex;
  align-items:center;gap:8px;flex-shrink:0;min-height:52px}
.header .title{font-size:1rem;font-weight:700;color:var(--sky);display:flex;align-items:center;gap:6px}
.header .sub{display:block;font-size:.7rem;color:var(--gray-400);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--gray-200);background:var(--white);
  color:var(--gray-600);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{border-color:var(--sky);color:var(--sky)}

/* ── 筛选 ── */
.filters{padding:10px 12px;display:grid;gap:8px;border-bottom:1px solid var(--gray-200)}
.filters input[type=search]{width:100%;padding:9px 14px;border:1px solid var(--gray-200);border-radius:20px;
  font-size:.85rem;outline:none}
.filters input[type=search]:focus{border-color:var(--sky)}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:20px;border:1px solid var(--gray-200);background:var(--white);
  color:var(--gray-600);font-size:.75rem;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--sky);color:var(--sky)}
.chip.on{background:var(--sky);border-color:var(--sky);color:#fff}
.chip.primary{background:var(--sky);border-color:var(--sky);color:#fff}
.chip.primary:hover{background:var(--blue);color:#fff}

/* ── 会话列表 ── */
.threads{flex:1;overflow-y:auto;padding:8px}
.thread-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;margin-bottom:8px;
  background:var(--white);border:1px solid #f3e8cd;border-radius:14px;box-shadow:0 1px 3px rgba(146,64,14,.06);
  cursor:pointer;transition:box-shadow .15s,border-color .15s;width:100%;text-align:left}
.thread-item:hover{border-color:#f5d78e;box-shadow:0 3px 12px rgba(146,64,14,.12)}
.thread-item.on{background:#fffcf2;border-color:#fde68a;border-left:4px solid var(--accent)}
.ti-avatar{width:40px;height:40px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.ti-avatar.risky{background:#fee2e2;color:#b91c1c}
.ti-body{flex:1;min-width:0}
.ti-top{display:flex;align-items:center;gap:6px}
.ti-name{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.ti-phone{font-size:.75rem;color:var(--gray-400);white-space:nowrap}
.ti-time{font-size:.72rem;color:var(--gray-400);margin-left:auto;white-space:nowrap;flex-shrink:0}
.ti-preview{font-size:.82rem;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ti-note{font-size:.75rem;color:var(--blue);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:10px;white-space:nowrap;
  background:var(--gray-100);color:var(--gray-600)}
.badge.warn{background:#fef3c7;color:#92400e}
.badge.danger{background:#fee2e2;color:#b91c1c}
.badge.queued{background:#e0f2fe;color:#0369a1}

/* ── 会话内容 ── */
.contact-bar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:9px 14px;
  display:flex;align-items:center;gap:10px;flex-shrink:0}
.contact-name{font-size:.9rem;font-weight:600}
.contact-phone{font-size:.78rem;color:var(--gray-400)}
.action-bar{background:var(--white);padding:6px 12px;border-bottom:1px solid var(--gray-200);
  display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.action-btn{padding:5px 14px;border-radius:var(--radius);font-size:.78rem;font-weight:600;cursor:pointer;
  border:1px solid var(--gray-200);background:var(--white);color:var(--gray-600)}
.action-btn:hover{border-color:var(--sky);color:var(--sky)}
.action-btn.primary{background:var(--sky);color:#fff;border-color:var(--sky)}
.action-btn.primary:hover{background:var(--blue)}
.action-btn.danger{color:var(--red);border-color:#fecaca}
.lang-bar{background:#f0fdf4;border-bottom:1px solid #bbf7d0;padding:6px 12px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--gray-600)}
.lang-bar select{border:1px solid var(--gray-200);border-radius:var(--radius);padding:3px 8px;font-size:.78rem;
  background:var(--white);color:var(--gray-800)}
.lang-bar .spacer{flex:1}
.lang-bar label{display:flex;align-items:center;gap:4px;cursor:pointer}
.tag-bar{background:var(--white);padding:4px 12px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--gray-200)}
.tag{background:#eef2ff;color:#3730a3;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:10px;
  display:inline-flex;align-items:center;gap:5px}
.tag button{border:0;background:transparent;color:#6366f1;cursor:pointer;font-size:.8rem;line-height:1;padding:0}
.tag-add{border:1px dashed var(--gray-200);background:transparent;color:var(--gray-400);font-size:.72rem;
  padding:2px 9px;border-radius:10px;cursor:pointer}
.tag-add:hover{border-color:var(--sky);color:var(--sky)}
.star-btn{border:0;background:transparent;cursor:pointer;font-size:.9rem;line-height:1;padding:0 2px}
.msg-star{color:var(--accent)}
.load-more{padding:10px;text-align:center}
.note-strip{background:#fef9c3;border-bottom:1px solid #fde68a;color:#92400e;font-size:.8rem;
  padding:7px 14px;white-space:pre-wrap}

.messages{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:4px}
.msg-row{display:flex;flex-direction:column}
.msg-row.in{align-items:flex-start}
.msg-row.out{align-items:flex-end}
.msg-bubble{max-width:82%;padding:10px 14px;border-radius:16px;font-size:.88rem;line-height:1.45;word-wrap:break-word}
.msg-row.in .msg-bubble{background:var(--gray-100);color:var(--gray-800);border-bottom-left-radius:4px}
.msg-row.out .msg-bubble{background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.msg-row.queued .msg-bubble{background:var(--white);color:var(--gray-600);border:1px dashed var(--accent)}
.msg-bubble.risky{box-shadow:0 0 0 2px #fca5a5}
.msg-translation{font-size:.78rem;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.3)}
.msg-row.in .msg-translation{border-top-color:var(--gray-200);color:#111}
.msg-meta{font-size:.68rem;color:var(--gray-400);margin-top:3px;padding:0 4px;display:flex;align-items:center;
  gap:6px;flex-wrap:wrap}
.msg-row.out .msg-meta{justify-content:flex-end}
.msg-fail{color:var(--red)}
.date-divider{text-align:center;padding:12px 0 6px;font-size:.72rem;color:var(--gray-400);font-weight:600}

/* ── 写短信 ── */
.reply-bar{background:var(--white);border-top:1.5px solid var(--gray-200);padding:8px 10px;
  display:flex;align-items:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap}
.reply-bar textarea{flex:1;min-width:180px;resize:none;border:1px solid var(--gray-200);border-radius:20px;
  padding:10px 16px;font-size:16px;outline:none;max-height:120px;min-height:42px;line-height:1.4}
.reply-bar textarea:focus{border-color:var(--sky)}
.reply-bar select{border:1px solid var(--gray-200);border-radius:20px;padding:9px 12px;font-size:.8rem;
  color:var(--gray-600);background:var(--white);outline:none}
.reply-bar .send-btn{width:42px;height:42px;border-radius:50%;background:var(--sky);color:#fff;border:none;
  font-size:1.05rem;cursor:pointer;flex-shrink:0}
.reply-bar .send-btn:hover{background:var(--blue)}
.reply-bar .send-btn:disabled{opacity:.4;cursor:not-allowed}
.reply-hint{flex-basis:100%;font-size:.72rem;color:var(--gray-400);padding:0 6px}
.preview-box{flex-basis:100%;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:9px 13px;
  font-size:.88rem;line-height:1.5;color:#1e3a5f;display:grid;gap:8px}
.preview-box .label{font-size:.7rem;font-weight:700;color:#2563eb}
.preview-box .row{display:flex;gap:8px;flex-wrap:wrap}
.reply-hint.err{color:var(--red)}
.to-row{flex-basis:100%;display:flex;align-items:center;gap:8px}
.to-row input{flex:1;border:1px solid var(--gray-200);border-radius:20px;padding:9px 16px;font-size:.9rem;outline:none}

/* ── 空状态 ── */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:var(--gray-400);text-align:center;padding:30px}
.empty img{width:56px;opacity:.75;margin-bottom:6px}
.empty .big{font-size:.95rem;font-weight:600;color:var(--gray-600)}
.empty .small{font-size:.8rem;line-height:1.6}

/* ── 弹窗（浏览器自带的 prompt 太丑，全部自己画）── */
.modal-back{position:fixed;inset:0;background:rgba(45,55,72,.45);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:50}
.modal{background:var(--white);border-radius:16px;padding:20px;width:min(420px,100%);display:grid;gap:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h2{font-size:.95rem;color:var(--sky)}
.modal label{font-size:.75rem;color:var(--gray-600);font-weight:600}
.modal input,.modal textarea{border:1px solid var(--gray-200);border-radius:var(--radius);padding:9px 12px;
  font-size:.9rem;outline:none;width:100%;font-family:inherit}
.modal textarea{min-height:80px;resize:vertical}
.modal input:focus,.modal textarea:focus{border-color:var(--sky)}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal .hint{font-size:.75rem;color:var(--gray-600);line-height:1.6}
.modal code{background:var(--off-white);border:1px solid #fde68a;border-radius:6px;padding:2px 8px;
  font-size:.8rem;user-select:all;word-break:break-all;display:inline-block;margin-top:3px}

/* ── 手机 ── */
.back-btn{display:none}
@media(max-width:760px){
  .sidebar{width:100%;border-right:0}
  .app.show-thread .sidebar{display:none}
  .app:not(.show-thread) .detail{display:none}
  .ti-name{max-width:none}
  .back-btn{display:flex}
}
</style>
</head>
<body>

<div class="gate" id="gate" style="display:none">
  <div class="gate-card">
    <img src="logo.svg" alt="">
    <h1>手机短信</h1>
    <p>仅限管理员账号。这里是从你手机同步上来的私人短信。</p>
    <input type="text" id="user" placeholder="用户名" autocomplete="username">
    <input type="password" id="pw" placeholder="密码" autocomplete="current-password">
    <button class="chip primary" style="padding:10px" onclick="login()">登录</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="sidebar">
    <div class="header">
      <span class="title"><img src="logo.svg" alt="" style="height:22px">手机短信</span>
      <div style="flex:1;min-width:0"><span class="sub" id="deviceInfo"></span></div>
      <button class="icon-btn" onclick="startNew()" title="给新号码发短信">✎</button>
      <button class="icon-btn" onclick="load()" title="刷新">↻</button>
      <button class="icon-btn" onclick="openSetup()" title="连接电脑 / 清空数据">⚙</button>
    </div>
    <div class="filters">
      <input type="search" id="q" placeholder="搜原文 / 译文 / 号码…" oninput="debounced()">
      <div class="filter-row">
        <button class="chip" id="unreadChip" onclick="toggleFilter('unread')" title="只看有新消息的会话">未读</button>
        <button class="chip" id="riskChip" onclick="toggleFilter('risk')" title="只看 AI 判为可疑或诈骗的短信">🚨 可疑</button>
        <button class="chip" id="starChip" onclick="toggleFilter('star')" title="只看标了星的消息">★ 星标</button>
        <button class="chip" id="queuedChip" onclick="toggleFilter('queued')" title="只看还没发出去的">✎ 待发送</button>
        <button class="chip" id="closedChip" onclick="toggleFilter('closed')" title="看已关闭的会话">✓ 已关闭</button>
      </div>
      <div class="filter-row" id="tagRow"></div>
    </div>
    <div class="threads" id="threads"></div>
  </div>

  <div class="detail" id="detail"></div>
</div>

<div id="modalHost"></div>

<script>
let TOKEN = localStorage.getItem('pa_phone_sms_token') || '';
let MESSAGES = [], OUTBOX = [], NOTES = {}, DEVICES = [];
let PEER = null, RISK = false, QUEUED_ONLY = false, COMPOSING = false;
let STARRED_ONLY = false, UNREAD_ONLY = false, SHOW_CLOSED = false, TAG_FILTER = '';
let LIMIT = 400, TOTAL = 0;
// 默认译成英文；每个会话可以在「对方」下拉里改，改了就记住
const DEFAULT_SEND_LANG = 'English';
let PREVIEW = null;
let searchTimer = null;

const RISK_LABELS = { personal:'私人', verification:'验证码', bank:'银行', delivery:'物流',
  service:'服务通知', marketing:'营销', spam:'垃圾', fraud:'诈骗', other:'其他' };
const LANGUAGES = ['English','Español','简体中文','繁體中文','Tiếng Việt','한국어','日本語'];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* SQLite 的 datetime('now') 是 UTC 又不带时区标记，直接给 new Date() 会被当本地时间。 */
function sqlTime(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';
  return /[TZ]/.test(raw) ? raw : raw.replace(' ', 'T') + 'Z';
}
function fmtPhone(e164) {
  if (!e164) return '';
  const d = String(e164).replace(/\D/g, '');
  if (d.length === 11 && d[0] === '1') return '(' + d.substr(1,3) + ') ' + d.substr(4,3) + '-' + d.substr(7);
  if (d.length === 10) return '(' + d.substr(0,3) + ') ' + d.substr(3,3) + '-' + d.substr(6);
  return String(e164);
}
function timeAgo(value) {
  const d = new Date(sqlTime(value));
  if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 172800) return '昨天';
  return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
}
function fmtClock(value) {
  const d = new Date(sqlTime(value));
  return isNaN(d) ? '' : d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}
function dayLabel(value) {
  const d = new Date(sqlTime(value));
  return isNaN(d) ? '' : d.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Authorization': 'Bearer ' + TOKEN, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opts.body
  });
  if (res.status === 401 || res.status === 403) { showGate('登录已过期，或这个账号不是管理员。'); throw new Error('unauthorized'); }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (_) { throw new Error('服务器暂时不可用，等半分钟再试'); }
}

function showGate(msg) {
  document.getElementById('gate').style.display = '';
  document.getElementById('app').style.display = 'none';
  if (msg) document.getElementById('gateErr').textContent = msg;
}

async function login() {
  const username = document.getElementById('user').value.trim();
  const password = document.getElementById('pw').value;
  const err = document.getElementById('gateErr');
  err.textContent = '';
  const r = await fetch('/api/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  }).then(x => x.json()).catch(() => ({}));
  if (!r.success) { err.textContent = r.error || '登录失败'; return; }
  if (r.role !== 'admin') { err.textContent = '这一页只有管理员能看（私人短信）。'; return; }
  TOKEN = r.token;
  localStorage.setItem('pa_phone_sms_token', TOKEN);
  start();
}

function start() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = '';
  load();
  setInterval(() => load(true), 20000);
}

function debounced() { clearTimeout(searchTimer); searchTimer = setTimeout(() => load(), 400); }
// 一个开关一个筛选。risk / star / closed 要重新问服务器（分页和条件在那边），
// unread / queued 只是把已经拿到的会话过一遍。
function toggleFilter(which) {
  if (which === 'risk') RISK = !RISK;
  if (which === 'star') STARRED_ONLY = !STARRED_ONLY;
  if (which === 'closed') SHOW_CLOSED = !SHOW_CLOSED;
  if (which === 'unread') UNREAD_ONLY = !UNREAD_ONLY;
  if (which === 'queued') QUEUED_ONLY = !QUEUED_ONLY;
  syncChips();
  if (which === 'risk' || which === 'star' || which === 'closed') load();
  else render();
}

function pickTag(tag) {
  TAG_FILTER = TAG_FILTER === tag ? '' : tag;
  syncChips();
  load();
}

function syncChips() {
  document.getElementById('riskChip').classList.toggle('on', RISK);
  document.getElementById('starChip').classList.toggle('on', STARRED_ONLY);
  document.getElementById('closedChip').classList.toggle('on', SHOW_CLOSED);
  document.getElementById('unreadChip').classList.toggle('on', UNREAD_ONLY);
  document.getElementById('queuedChip').classList.toggle('on', QUEUED_ONLY);
}

async function load(silent) {
  try {
    const q = document.getElementById('q').value.trim();
    let url = '/device-sms/messages?limit=' + LIMIT;
    if (RISK) url += '&risk=2';
    if (STARRED_ONLY) url += '&starred=1';
    if (TAG_FILTER) url += '&tag=' + encodeURIComponent(TAG_FILTER);
    // 默认只看进行中的；点了「已关闭」就只看关闭的
    url += '&status=' + (SHOW_CLOSED ? 'closed' : 'open');
    if (q) url += '&q=' + encodeURIComponent(q);
    const r = await api(url);
    TOTAL = r.total || 0;
    MESSAGES = r.messages || [];
    OUTBOX = r.outbox || [];
    DEVICES = r.devices || [];
    NOTES = {};
    for (const n of r.notes || []) {
      let tags = [];
      try { tags = JSON.parse(n.tags || '[]'); } catch (_) { tags = []; }
      NOTES[n.peer] = {
        alias: n.alias || '', note: n.note || '', tags: Array.isArray(tags) ? tags : [],
        status: n.status || 'open', contact_lang: n.contact_lang || '', agent_lang: n.agent_lang || '',
        auto_translate: n.auto_translate === undefined ? 1 : n.auto_translate,
        read_at: n.read_at || null
      };
    }
    renderTagRow();
    document.getElementById('deviceInfo').textContent = DEVICES.length
      ? DEVICES.map(d => (d.name || '电脑') + (d.last_push_at ? ' · ' + timeAgo(d.last_push_at) + '同步' : ' · 还没推过')).join('　')
      : '还没连电脑 — 点 ⚙';
    render();
  } catch (e) { if (!silent) console.error(e); }
}

/** 所有会话用过的标签，做成一排可点的筛选。 */
function renderTagRow() {
  const seen = new Set();
  for (const state of Object.values(NOTES)) for (const t of state.tags || []) seen.add(t);
  const row = document.getElementById('tagRow');
  const tags = [...seen].sort();
  row.innerHTML = tags.map(t =>
    '<button class="chip' + (TAG_FILTER === t ? ' on' : '') + '" onclick="pickTag(\'' + esc(t) + '\')">🏷 '
    + esc(t) + '</button>').join('');
  row.style.display = tags.length ? '' : 'none';
}

/** 有没有比「读到这儿」更新的收到消息。 */
function unreadCount(list, readAt) {
  const mark = readAt ? new Date(sqlTime(readAt)).getTime() : 0;
  let n = 0;
  for (const m of list) {
    if (m.queued || m.direction !== 'in') continue;
    if (new Date(sqlTime(m.sent_at)).getTime() > mark) n++;
  }
  return n;
}

/* 已收到的 + 排队待发的合成一条时间线。 */
function allItems() {
  const queued = OUTBOX.map(o => ({
    id: 'q' + o.id, outbox_id: o.id, queued: true, status: o.status, note: o.note,
    peer: o.peer || o.to_address, address: o.to_address, direction: 'out', kind: 'sms',
    body: o.body, translated_body: '', sent_at: sqlTime(o.created_at)
  }));
  return MESSAGES.concat(queued);
}

function conversations() {
  const groups = new Map();
  for (const m of allItems()) {
    const list = groups.get(m.peer) || [];
    list.push(m);
    groups.set(m.peer, list);
  }
  const out = [];
  for (const [peer, list] of groups) {
    list.sort((a, b) => (sqlTime(a.sent_at) < sqlTime(b.sent_at) ? -1 : 1));
    const last = list[list.length - 1];
    let maxRisk = 0, name = '', queued = 0;
    for (const m of list) {
      if (Number(m.risk_score) > maxRisk) maxRisk = Number(m.risk_score);
      if (m.contact) name = m.contact;
      if (m.queued) queued++;
    }
    const noted = NOTES[peer] || {};
    // 号码用最近一条真实短信上的，排队中的那些没有权威号码
    const real = list.filter(m => !m.queued);
    const address = (real.length ? real[real.length - 1].address : last.address) || peer;
    out.push({
      peer, list, last, maxRisk, queued, address,
      note: noted.note || '', tags: noted.tags || [], status: noted.status || 'open',
      contactLang: noted.contact_lang || '', agentLang: noted.agent_lang || '',
      autoTranslate: noted.auto_translate === undefined ? 1 : noted.auto_translate,
      unread: unreadCount(list, noted.read_at),
      title: noted.alias || name || fmtPhone(address) || peer
    });
  }
  out.sort((a, b) => (sqlTime(a.last.sent_at) < sqlTime(b.last.sent_at) ? 1 : -1));
  let filtered = out;
  if (QUEUED_ONLY) filtered = filtered.filter(c => c.queued > 0);
  if (UNREAD_ONLY) filtered = filtered.filter(c => c.unread > 0);
  return filtered;
}

function riskBadge(score, category) {
  const n = Number(score);
  if (!Number.isFinite(n) || n < 2) return '';
  const cat = RISK_LABELS[category] || '';
  return '<span class="badge ' + (n >= 4 ? 'danger' : 'warn') + '" title="AI 诈骗筛查 ' + n + '/5">🚨 '
    + (n >= 4 ? '高风险' : '可疑') + (cat ? ' · ' + cat : '') + '</span>';
}

function render() {
  const convos = conversations();
  renderThreads(convos);
  renderDetail(convos);
}

function renderThreads(convos) {
  const el = document.getElementById('threads');
  if (!convos.length) {
    el.innerHTML = '<div class="empty" style="padding:40px 16px"><div class="big">没有会话</div>'
      + '<div class="small">' + (MESSAGES.length
          ? '换个搜索词，或者关掉上面的筛选。'
          : '在那台连着手机的电脑上打开桌面版「SMS 译信」，设置里填上推送网址和令牌（点右上角 ⚙）。')
      + '</div></div>';
    return;
  }
  el.innerHTML = convos.map(c => {
    const initials = (c.title || '?').replace(/[^0-9A-Za-z一-龥]/g, '').slice(0, 2).toUpperCase() || '#';
    const preview = (c.last.direction === 'out' ? '我: ' : '')
      + (c.last.translated_body || c.last.body || (c.last.has_media ? '［图片］' : ''));
    return '<button class="thread-item' + (c.peer === PEER && !COMPOSING ? ' on' : '') + '" onclick="pick(\'' + esc(c.peer) + '\')">'
      + '<div class="ti-avatar' + (c.maxRisk >= 4 ? ' risky' : '') + '">' + esc(initials) + '</div>'
      + '<div class="ti-body">'
      + '<div class="ti-top"><span class="ti-name">' + esc(c.title) + '</span>'
      + '<span class="ti-phone">' + esc(fmtPhone(c.address)) + '</span>'
      + '<span class="ti-time">' + timeAgo(c.last.sent_at) + '</span></div>'
      + '<div class="ti-preview">' + esc(preview.slice(0, 90)) + '</div>'
      + (c.note ? '<div class="ti-note">📝 ' + esc(c.note) + '</div>' : '')
      + '<div class="ti-meta">'
      + (c.unread ? '<span class="badge" style="background:#2563eb;color:#fff">' + c.unread + ' 条新</span>' : '')
      + riskBadge(c.maxRisk, (c.list.find(m => Number(m.risk_score) === c.maxRisk) || {}).risk_category)
      + (c.queued ? '<span class="badge queued">待发送 ' + c.queued + '</span>' : '')
      + (c.status === 'closed' ? '<span class="badge">已关闭</span>' : '')
      + (c.contactLang ? '<span class="badge">→ ' + esc(c.contactLang) + '</span>' : '')
      + (c.tags || []).map(t => '<span class="tag">🏷 ' + esc(t) + '</span>').join('')
      + '</div></div></button>';
  }).join('')
  + (MESSAGES.length < TOTAL
      ? '<div class="load-more"><button class="action-btn" onclick="loadMore()">加载更多（共 ' + TOTAL + ' 条）</button></div>'
      : '');
}

function loadMore() {
  LIMIT += 400;
  load();
}

function renderDetail(convos) {
  const el = document.getElementById('detail');

  if (COMPOSING) {
    el.innerHTML = contactBar('新短信', '填一个号码', true)
      + '<div class="empty"><img src="logo.svg" alt=""><div class="big">写给一个新号码</div>'
      + '<div class="small">上面填号码，下面写内容。<br>发出去的是你手机号本人发的。</div></div>'
      + replyBar(true);
    wireReply();
    document.getElementById('toInput').focus();
    return;
  }

  const convo = convos.find(c => c.peer === PEER);
  if (!convo) {
    el.innerHTML = '<div class="empty"><img src="logo.svg" alt=""><div class="big">从左边选一个会话</div>'
      + '<div class="small">这里是你手机里的短信，由那台连着手机的电脑同步上来。<br>'
      + '写短信也可以 — 电脑会替你用手机发出去。</div></div>';
    return;
  }

  const noted = NOTES[convo.peer] || {};
  let lastDay = '';
  const body = convo.list.map(m => {
    const day = dayLabel(m.sent_at);
    const divider = day && day !== lastDay ? '<div class="date-divider">' + esc(day) + '</div>' : '';
    lastDay = day;

    if (m.queued) {
      return divider + '<div class="msg-row out queued">'
        + '<div class="msg-bubble">' + esc(m.body) + '</div>'
        + '<div class="msg-meta">'
        + (m.status === 'failed'
            ? '<span class="msg-fail">发送失败：' + esc(m.note || '未知原因') + '</span>'
            : '<span>待发送 · 等电脑发出去</span>')
        + '<button class="action-btn" style="padding:1px 8px;font-size:.7rem" onclick="cancelQueued(' + m.outbox_id + ')">撤掉</button>'
        + '</div></div>';
    }

    const translated = (m.translated_body || '').trim();
    const showBoth = translated && translated !== (m.body || '').trim();
    return divider + '<div class="msg-row ' + (m.direction === 'out' ? 'out' : 'in') + '">'
      + '<div class="msg-bubble' + (Number(m.risk_score) >= 4 ? ' risky' : '') + '">'
      + esc(m.body || (m.has_media ? '［图片短信］' : ''))
      + (showBoth ? '<div class="msg-translation">' + esc(translated) + '</div>' : '')
      + '</div>'
      + '<div class="msg-meta">'
      + '<button class="star-btn' + (Number(m.starred) ? ' msg-star' : '') + '"'
      + ' title="' + (Number(m.starred) ? '取消星标' : '标记这条，可以在「★ 星标」里回看') + '"'
      + ' onclick="toggleStar(' + m.id + ',' + (Number(m.starred) ? 0 : 1) + ')">'
      + (Number(m.starred) ? '★' : '☆') + '</button>'
      + '<span>' + fmtClock(m.sent_at) + '</span>'
      + (m.star_note ? '<span style="color:var(--blue)">📌 ' + esc(m.star_note) + '</span>' : '')
      + (m.kind === 'mms' ? '<span>图片短信</span>' : '')
      + (m.source_lang ? '<span>' + esc(m.source_lang) + '</span>' : '')
      + riskBadge(m.risk_score, m.risk_category)
      + (m.risk_summary && Number(m.risk_score) >= 2 ? '<span>' + esc(m.risk_summary) + '</span>' : '')
      + '</div></div>';
  }).join('');

  const langOptions = (selected) => ['', ...LANGUAGES]
    .map(l => '<option value="' + esc(l) + '"' + (l === selected ? ' selected' : '') + '>'
      + (l ? esc(l) : '（默认）') + '</option>').join('');

  el.innerHTML = contactBar(convo.title, fmtPhone(convo.address), false)
    + '<div class="action-bar">'
    + '<button class="action-btn" onclick="editNote()">📝 备注</button>'
    + '<button class="action-btn" onclick="editTags()">🏷 标签</button>'
    + '<button class="action-btn" onclick="markUnread()">标为未读</button>'
    + '<button class="action-btn" onclick="toggleStatus()">'
    + (convo.status === 'closed' ? '重新打开' : '✓ 关闭会话') + '</button>'
    + '<button class="action-btn" onclick="startNew()">✎ 新短信</button>'
    + '<div style="flex:1"></div>'
    + (convo.unread ? '<span class="badge" style="background:#2563eb;color:#fff">' + convo.unread + ' 条新</span>' : '')
    + '</div>'
    // 语言对：和 SMS Inbox 那边一样的两个下拉 —— 对方写什么语言、我读什么语言
    + '<div class="lang-bar">'
    + '<span>对方：</span><select id="contactLang" onchange="saveLang()">' + langOptions(convo.contactLang) + '</select>'
    + '<span>我的：</span><select id="agentLang" onchange="saveLang()">' + langOptions(convo.agentLang) + '</select>'
    + '<div class="spacer"></div>'
    + '<label title="关掉之后这个会话收到的消息就不再自动翻译">'
    + '<input type="checkbox" id="autoTr" ' + (convo.autoTranslate ? 'checked' : '') + ' onchange="saveLang()">'
    + '收到的消息自动翻译</label>'
    + '<button class="action-btn" onclick="retranslate()" title="让电脑把这个会话重新翻译一遍">🔁 重新翻译</button>'
    + '</div>'
    + ((convo.tags || []).length
        ? '<div class="tag-bar">' + convo.tags.map(t => '<span class="tag">🏷 ' + esc(t)
            + '<button title="去掉这个标签" onclick="removeTag(\'' + esc(t) + '\')">×</button></span>').join('')
          + '<button class="tag-add" onclick="editTags()">+ 标签</button></div>'
        : '')
    + (noted.note ? '<div class="note-strip">📝 ' + esc(noted.note) + '</div>' : '')
    + '<div class="messages" id="messages">' + body + '</div>'
    + replyBar(false);

  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
  wireReply();
}

function contactBar(title, sub, composing) {
  return '<div class="contact-bar">'
    + '<button class="icon-btn back-btn" onclick="backToList()" title="返回">‹</button>'
    + '<div style="flex:1;min-width:0"><div class="contact-name">' + esc(title) + '</div>'
    + '<div class="contact-phone">' + esc(sub) + '</div></div>'
    + (composing ? '<button class="action-btn" onclick="backToList()">取消</button>' : '')
    + '</div>';
}

function replyBar(composing) {
  // 默认译成英文 —— 这台手机基本都是发给英语的人
  const convo = COMPOSING ? null : conversations().find(c => c.peer === PEER);
  const chosen = (convo && convo.contactLang) || DEFAULT_SEND_LANG;
  return '<div class="reply-bar">'
    + (composing
        ? '<div class="to-row"><span style="font-size:.8rem;color:var(--gray-600)">发给</span>'
          + '<input type="text" id="toInput" placeholder="号码，例如 +13128437890"></div>'
        : '')
    + '<div class="preview-box" id="previewBox" style="display:none"></div>'
    + '<select id="langSel" onchange="pickSendLang(this.value)" title="发送前先翻译成这个语言">'
    + LANGUAGES.map(l => '<option value="' + l + '"' + (l === chosen ? ' selected' : '') + '>译成 ' + l + '</option>').join('')
    + '<option value=""' + (chosen ? '' : ' selected') + '>不翻译，直接发原文</option>'
    + '</select>'
    + '<textarea id="draft" rows="1" placeholder="写短信…（写中文即可）" oninput="clearPreview()"></textarea>'
    + '<button class="send-btn" id="sendBtn" onclick="queueSend()" title="翻译并发送（Ctrl+Enter）">&#9654;</button>'
    + '<div class="reply-hint" id="sendNote">选了语言就会先翻好给你看，确认后再发。</div>'
    + '</div>';
}

function wireReply() {
  const box = document.getElementById('draft');
  if (!box) return;
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); void queueSend(); }
  });
}

function pick(peer) {
  COMPOSING = false;
  PEER = peer;
  document.getElementById('app').classList.add('show-thread');
  render();
  // 打开就算读过了（跟手机上的已读无关，手机那边我们写不了）
  const state = NOTES[peer] || (NOTES[peer] = {});
  state.read_at = new Date().toISOString();
  void api('/device-sms/peer', { method: 'POST', body: JSON.stringify({ peer, read: true }) })
    .then(() => renderThreads(conversations()))
    .catch(() => {});
}

function startNew() {
  COMPOSING = true;
  PEER = null;
  document.getElementById('app').classList.add('show-thread');
  render();
}

function backToList() {
  COMPOSING = false;
  document.getElementById('app').classList.remove('show-thread');
  render();
}

/** 改了发送语言就记在这个会话上，下次还用它。 */
function pickSendLang(lang) {
  clearPreview();
  if (!COMPOSING && PEER) void savePeer({ contact_lang: lang });
}

function clearPreview() {
  PREVIEW = null;
  const box = document.getElementById('previewBox');
  if (box) box.style.display = 'none';
}

/** 把译文摆出来，等人点确认。发出去的就是这一段。 */
function showPreview(text, lang) {
  PREVIEW = { text, lang };
  const box = document.getElementById('previewBox');
  box.style.display = '';
  box.innerHTML = '<span class="label">译文（' + esc(lang) + '）— 点「确认发送」发出去的就是这段</span>'
    + '<div>' + esc(text) + '</div>'
    + '<div class="row">'
    + '<button class="action-btn primary" onclick="confirmSend()">确认发送</button>'
    + '<button class="action-btn" onclick="clearPreview()">改一改</button>'
    + '<button class="action-btn" onclick="sendRaw()">直接发原文</button>'
    + '</div>';
}

function currentTarget() {
  if (COMPOSING) return null;
  const convo = conversations().find(c => c.peer === PEER);
  if (!convo) return null;
  return { peer: convo.peer, to: convo.address };
}

/** 确认后把译文排进队列。 */
function confirmSend() {
  if (!PREVIEW) return;
  void enqueue(PREVIEW.text, '');
}

/** 不翻译，把写的原样发出去。 */
function sendRaw() {
  const body = document.getElementById('draft').value.trim();
  if (body) void enqueue(body, '');
}

/**
 * 点发送：选了语言就先翻译并摆出来等确认；没选语言就直接排队。
 *
 * 翻译在网站这边做（服务器有自己的 API key），所以是立刻出结果，不用等那台
 * 电脑轮询。确认之后排进队列的是【译文】，电脑拿到什么就发什么。
 */
async function queueSend() {
  const note = document.getElementById('sendNote');
  const body = document.getElementById('draft').value.trim();
  const translateTo = document.getElementById('langSel').value;
  note.className = 'reply-hint';
  if (!body) { note.textContent = '还没写内容。'; note.className = 'reply-hint err'; return; }
  if (PREVIEW) { confirmSend(); return; }
  if (!translateTo) { void enqueue(body, ''); return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  note.textContent = '翻译中…';
  try {
    const r = await api('/device-sms/translate', {
      method: 'POST', body: JSON.stringify({ text: body, to: translateTo })
    });
    if (!r.success || !r.text) {
      note.textContent = (r.error || '翻译失败') + '（可以点「直接发原文」）';
      note.className = 'reply-hint err';
      showPreview(body, '原文');
      return;
    }
    note.textContent = '确认一下，没问题再发。';
    showPreview(r.text, translateTo);
  } catch (e) {
    note.textContent = e.message;
    note.className = 'reply-hint err';
  } finally {
    btn.disabled = false;
  }
}

/** 真正排进待发队列。 */
async function enqueue(body, translateTo) {
  const note = document.getElementById('sendNote');
  const target = currentTarget();
  let to = '';
  if (COMPOSING) {
    to = document.getElementById('toInput').value.trim();
    if (!to) { note.textContent = '先填收件号码。'; note.className = 'reply-hint err'; return; }
  } else {
    if (!target) return;
    to = target.to;
  }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try {
    const peer = target ? target.peer : to.replace(/[^0-9]/g, '').slice(-10);
    const r = await api('/device-sms/send', {
      method: 'POST', body: JSON.stringify({ to, peer, body, translate_to: translateTo })
    });
    if (!r.success) { note.textContent = r.error || '排队失败'; note.className = 'reply-hint err'; return; }
    if (COMPOSING) { COMPOSING = false; PEER = peer; }
    clearPreview();
    await load(true);
    // load() 重画了整个面板, 提示写到新的那个节点上
    const hint = document.getElementById('sendNote');
    if (hint) hint.textContent = '已排队，电脑马上发出去。';
  } catch (e) {
    note.textContent = e.message;
    note.className = 'reply-hint err';
  } finally {
    btn.disabled = false;
  }
}

async function cancelQueued(id) {
  if (!(await confirmBox('撤掉这条还没发出去的短信？'))) return;
  await api('/device-sms/outbox/' + id, { method: 'DELETE' });
  load(true);
}

/* ── 会话上的动作 ── */
async function savePeer(patch) {
  const peer = PEER;
  if (!peer) return;
  await api('/device-sms/peer', { method: 'POST', body: JSON.stringify({ peer, ...patch }) });
  await load(true);
}

function saveLang() {
  void savePeer({
    contact_lang: document.getElementById('contactLang').value,
    agent_lang: document.getElementById('agentLang').value,
    auto_translate: document.getElementById('autoTr').checked
  });
}

function markUnread() { void savePeer({ read: false }); }

function toggleStatus() {
  const convo = conversations().find(c => c.peer === PEER);
  if (!convo) return;
  void savePeer({ status: convo.status === 'closed' ? 'open' : 'closed' });
}

function removeTag(tag) {
  const convo = conversations().find(c => c.peer === PEER);
  if (!convo) return;
  void savePeer({ tags: (convo.tags || []).filter(t => t !== tag) });
}

function editTags() {
  const convo = conversations().find(c => c.peer === PEER);
  if (!convo) return;
  openModal('<h2>标签 · ' + esc(convo.title) + '</h2>'
    + '<label for="tagInput">用逗号分开</label>'
    + '<input id="tagInput" placeholder="例如：工地, 房东, 重要" value="' + esc((convo.tags || []).join(', ')) + '">'
    + '<div class="hint">标签会出现在左边的筛选栏里，点一下就只看带这个标签的会话。</div>'
    + '<div class="row"><button class="action-btn" onclick="closeModal()">取消</button>'
    + '<button class="action-btn primary" id="tagSave">保存</button></div>');
  document.getElementById('tagInput').focus();
  document.getElementById('tagSave').onclick = async () => {
    const tags = document.getElementById('tagInput').value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
    closeModal();
    await savePeer({ tags });
  };
}

async function toggleStar(id, on) {
  await api('/device-sms/messages/' + id + '/star', {
    method: 'POST', body: JSON.stringify({ starred: !!on })
  });
  await load(true);
}

async function retranslate() {
  const convo = conversations().find(c => c.peer === PEER);
  if (!convo) return;
  if (!(await confirmBox('让电脑把这个会话重新翻译一遍？电脑要开着、并且填了 API key。'))) return;
  const r = await api('/device-sms/retranslate', { method: 'POST', body: JSON.stringify({ peer: convo.peer }) });
  openModal('<h2>已排队</h2><div class="hint">标记了 ' + (r.marked || 0)
    + ' 条。电脑几秒后会取走重翻，翻好会自动推回来。</div>'
    + '<div class="row"><button class="action-btn primary" onclick="closeModal()">好</button></div>');
}

/* ── 弹窗 ── */
function closeModal() { document.getElementById('modalHost').innerHTML = ''; }

function openModal(html) {
  document.getElementById('modalHost').innerHTML =
    '<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">' + html + '</div></div>';
}

function confirmBox(text) {
  return new Promise((resolve) => {
    openModal('<h2>确认</h2><div class="hint">' + esc(text) + '</div>'
      + '<div class="row"><button class="action-btn" id="mCancel">取消</button>'
      + '<button class="action-btn primary" id="mOk">确定</button></div>');
    document.getElementById('mCancel').onclick = () => { closeModal(); resolve(false); };
    document.getElementById('mOk').onclick = () => { closeModal(); resolve(true); };
  });
}

function editNote() {
  const convo = conversations().find(c => c.peer === PEER);
  if (!convo) return;
  const current = NOTES[convo.peer] || {};
  openModal('<h2>备注 · ' + esc(fmtPhone(convo.address)) + '</h2>'
    + '<label for="nAlias">备注名</label>'
    + '<input id="nAlias" placeholder="留空就显示号码" value="' + esc(current.alias || '') + '">'
    + '<label for="nNote">备注</label>'
    + '<textarea id="nNote" placeholder="这个号码是谁、聊到哪儿了、要记住的事…">' + esc(current.note || '') + '</textarea>'
    + '<div class="hint">桌面版「SMS 译信」里是同一份备注，两边都能改。</div>'
    + '<div class="row"><button class="action-btn" onclick="closeModal()">取消</button>'
    + '<button class="action-btn primary" id="nSave">保存</button></div>');
  document.getElementById('nAlias').focus();
  document.getElementById('nSave').onclick = async () => {
    const alias = document.getElementById('nAlias').value;
    const note = document.getElementById('nNote').value;
    closeModal();
    await api('/device-sms/notes', { method: 'POST', body: JSON.stringify({ peer: convo.peer, alias, note }) });
    await load(true);
  };
}

async function openSetup() {
  const r = await api('/device-sms/devices');
  const rows = (r.devices || []).map(d =>
    '<div class="hint">' + esc(d.name || '电脑') + (d.active ? '' : '（已停用）')
    + ' · ' + (d.message_count || 0) + ' 条'
    + (d.active ? ' <button class="action-btn" style="padding:1px 8px" onclick="revoke(' + d.id + ')">停用</button>' : '')
    + '</div>').join('') || '<div class="hint">还没连过电脑。</div>';

  openModal('<h2>连接手机或电脑</h2>'
    + '<div class="hint"><b>推荐：手机上装「短信同步」App</b>（到 GitHub Releases 下载 '
    + 'SMS.Phone-*.apk 旁路安装）——手机自己推送，不需要电脑、没有掉线问题。'
    + 'App 里填下面的网址和令牌即可。用了 App 就把电脑版的「同步到公司网站」关掉，免得短信重复。</div>'
    + '<div class="hint">或者用电脑：桌面版「SMS 译信」的 设置 → 同步到公司网站 里填这两样：</div>'
    + '<div class="hint">网址（App 填这个）<br><code>' + location.origin + '</code></div>'
    + '<div class="hint">推送网址（电脑版填这个）<br><code>' + location.origin + '/api/device-sms/push</code></div>'
    + '<div id="tokenBox"></div>'
    + '<div class="row" style="justify-content:flex-start">'
    + '<button class="action-btn primary" id="newTok">生成新令牌</button></div>'
    + '<div class="hint">令牌只显示这一次，关掉就看不到了；丢了再生成一个。</div>'
    + '<div style="border-top:1px solid var(--gray-200);padding-top:8px">' + rows + '</div>'
    + '<div class="row" style="justify-content:space-between">'
    + '<button class="action-btn danger" id="wipeBtn">清空所有手机短信</button>'
    + '<button class="action-btn" onclick="closeModal()">关闭</button></div>');

  document.getElementById('newTok').onclick = async () => {
    const res = await api('/device-sms/devices', { method: 'POST', body: JSON.stringify({ name: '我的电脑' }) });
    document.getElementById('tokenBox').innerHTML = res.token
      ? '<div class="hint">设备令牌（只显示这一次）<br><code>' + esc(res.token) + '</code></div>'
      : '<div class="hint" style="color:var(--red)">' + esc(res.error || '生成失败') + '</div>';
  };
  document.getElementById('wipeBtn').onclick = async () => {
    closeModal();
    if (!(await confirmBox('把服务器上所有手机短信删掉？不可撤销。手机和电脑上的不受影响。'))) return;
    const res = await api('/device-sms/messages', { method: 'DELETE' });
    await load(true);
    openModal('<h2>已清空</h2><div class="hint">删除了 ' + (res.deleted || 0) + ' 条。</div>'
      + '<div class="row"><button class="action-btn primary" onclick="closeModal()">好</button></div>');
  };
}

async function revoke(id) {
  closeModal();
  if (!(await confirmBox('停用这台电脑的令牌？已经推上来的短信还留着。'))) return;
  await api('/device-sms/devices/' + id, { method: 'DELETE' });
  openSetup();
}

if (TOKEN) {
  api('/admin/me').then(r => {
    if (r && r.username && r.role === 'admin') start();
    else showGate(r && r.username ? '这一页只有管理员能看。' : '');
  }).catch(() => {});
} else {
  showGate();
}
</script>
