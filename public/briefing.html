<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作要求 — Prime Anchor SMS</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#92400e;--sky:#b45309;--sky-light:#fef3c7;--accent:#f59e0b;--off-white:#fffbeb;--gray-100:#f3f4f6;--gray-200:#e2e5ea;--gray-400:#9BA3B0;--gray-500:#6b7280;--gray-600:#5F6B7A;--gray-800:#2D3748;--red:#E63946;--green:#2D9D78;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;background:var(--off-white);color:var(--gray-800);min-height:100vh}
.header{background:#fff;border-bottom:1.5px solid #fde68a;padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.header a.back{color:var(--sky);font-weight:700;text-decoration:none;font-size:1rem;padding:4px 8px;border-radius:8px}
.header a.back:hover{background:var(--sky-light)}
.header h1{font-size:1.1rem;color:var(--blue)}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 40px}
.section{background:#fff;border:1px solid #f3e8cd;border-radius:var(--radius);box-shadow:0 1px 3px rgba(146,64,14,.06);padding:16px;margin-bottom:18px}
.section h2{font-size:.95rem;color:var(--blue);margin-bottom:10px;display:flex;align-items:center;gap:8px}
textarea{width:100%;padding:12px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:.92rem;outline:none;resize:vertical;font-family:inherit;line-height:1.7;min-height:170px}
textarea:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;background:var(--sky);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.92rem;margin-top:10px;font-family:inherit}
.btn:hover{background:var(--blue)}
.today-card{background:#fffbeb;border:1.5px solid #fcd34d;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.co-badge{display:inline-block;background:#fde68a;color:#92400e;border-radius:999px;padding:1px 10px;font-size:.72rem;font-weight:700;margin-right:6px}
.co-badge.general{background:#dbeafe;color:#1d4ed8}
.shift-line{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:700;margin-bottom:8px;display:inline-block}
.chip{cursor:pointer;border:1.5px solid var(--gray-200);background:#fff;border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600;color:var(--gray-600);font-family:inherit}
.chip.active{border-color:var(--accent);background:var(--sky-light);color:var(--blue)}
.today-meta{font-size:.74rem;color:#92400e;font-weight:700;margin-bottom:8px}
.today-text{font-size:.95rem;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.hist-item{border:1px solid var(--gray-200);border-radius:10px;padding:10px 13px;margin-bottom:8px;background:#fff}
.hist-date{font-size:.72rem;color:var(--gray-400);font-weight:700;margin-bottom:4px}
.hist-text{font-size:.84rem;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--gray-600)}
.hint{color:var(--gray-400);font-size:.85rem;padding:16px;text-align:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gray-800);color:#fff;padding:10px 22px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <a class="back" href="/sms-inbox">&larr; 收件箱</a>
  <h1>&#128203; 每日工作要求</h1>
  <span id="dateNow" style="margin-left:auto;font-size:.78rem;color:var(--gray-400)"></span>
</div>
<div class="wrap">
  <div class="section" id="editSec" style="display:none">
    <h2>&#9999;&#65039; 今天的要求（保存后客服端亮红点提醒）</h2>
    <select id="briefCompany" onchange="onCompanyChange()" style="width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:.9rem;font-family:inherit;background:#fff;margin-bottom:8px;outline:none;cursor:pointer;font-weight:600;color:var(--gray-800)">
      <option value="">📢 通用（所有公司）</option>
    </select>
    <div style="display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center">
      <select id="shiftName" style="padding:9px 10px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:.86rem;font-family:inherit;background:#fff;outline:none;cursor:pointer;font-weight:600">
        <option value="早班">⏰ 早班</option>
        <option value="中班">⏰ 中班</option>
        <option value="晚班">⏰ 晚班</option>
        <option value="夜班">⏰ 夜班</option>
        <option value="白班">⏰ 白班</option>
        <option value="周末班">⏰ 周末班</option>
        <option value="加班">⏰ 加班</option>
        <option value="今日休息">🛌 今日休息</option>
      </select>
      <input type="time" id="shiftStart" style="padding:8px 9px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:.86rem;font-family:inherit;outline:none">
      <span style="color:var(--gray-400)">–</span>
      <input type="time" id="shiftEnd" style="padding:8px 9px;border:1.5px solid var(--gray-200);border-radius:10px;font-size:.86rem;font-family:inherit;outline:none">
      <button type="button" onclick="addShift()" style="padding:9px 16px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:.86rem;cursor:pointer;font-family:inherit">+ 加班次</button>
    </div>
    <div id="shiftChips" style="display:none;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
    <textarea id="briefInput" placeholder="写下今天要客服重点做的事，比如：&#10;· 优先跟进面试没到的人，问原因约改期&#10;· 所有新申请人当天必须回复&#10;· 发工资的问题统一回复：周五到账&#10;&#10;（内容清空、班次都删掉后保存 = 删除该条）"></textarea>
    <button class="btn" onclick="saveBriefing()">保存发布</button>
    <div id="todayChips" style="display:none;margin-top:10px">
      <div style="font-size:.72rem;font-weight:700;color:var(--gray-400);margin-bottom:5px">今天已发布（点击切换编辑）</div>
      <div id="todayChipList" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>
  </div>

  <div class="section" id="todaySec" style="display:none">
    <h2>&#128204; 今天</h2>
    <div id="todayCards"></div>
  </div>
  <div class="section" id="emptySec" style="display:none"><div class="hint">今天还没有发布工作要求</div></div>

  <div class="section" id="histSec" style="display:none">
    <h2>&#128337; 往日记录</h2>
    <div id="histList"></div>
  </div>

  <div class="hint" id="loading">加载中…</div>
</div>
<div class="toast" id="toast"></div>
<script>
function getToken() {
  const m = (document.cookie || '').match(/pa_token=([^;]+)/);
  if (m) return m[1];
  return localStorage.getItem('adminToken') || '';
}
async function api(path, opts = {}) {
  const headers = { 'Authorization': 'Bearer ' + getToken(), ...(opts.headers || {}) };
  if (opts.body && typeof opts.body === 'string') headers['Content-Type'] = 'application/json';
  const res = await fetch('/api' + path, { ...opts, headers });
  if (res.status === 401) { location.href = '/sms-inbox'; throw new Error('Unauthorized'); }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (_) { throw new Error('服务器暂时不可用（可能正在部署更新），等半分钟再试一次'); }
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
function todayChicago() { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' }); }

let USER = null, _briefings = [], _partners = [], _shifts = [];
// 班次串格式: "早班 07:00–15:30 · 晚班 18:00–02:00" (与显示格式一致, 可反解析)
function renderShiftChips() {
  const wrap = document.getElementById('shiftChips');
  wrap.style.display = _shifts.length ? 'flex' : 'none';
  wrap.innerHTML = _shifts.map((sf, i) =>
    '<span class="chip active" style="cursor:default">⏰ ' + esc(sf)
    + ' <span onclick="removeShift(' + i + ')" style="cursor:pointer;font-weight:900;margin-left:4px;color:var(--red)">&times;</span></span>'
  ).join('');
}
function addShift() {
  const name = document.getElementById('shiftName').value;
  const st = document.getElementById('shiftStart').value;
  const en = document.getElementById('shiftEnd').value;
  let sf = name;
  if (st && en) sf += ' ' + st + '\u2013' + en;
  else if (st) sf += ' ' + st + ' \u5f00\u59cb';
  if (_shifts.includes(sf)) { toast('这个班次已经加过了'); return; }
  _shifts.push(sf);
  document.getElementById('shiftStart').value = '';
  document.getElementById('shiftEnd').value = '';
  renderShiftChips();
}
function removeShift(i) { _shifts.splice(i, 1); renderShiftChips(); }
async function load() {
  try {
    USER = await api('/admin/me');
    if (USER && USER.role === 'admin') {
      try {
        const pr = await api('/sms/partners');
        _partners = ((pr && pr.partners) || []).map(p => p.name).filter(Boolean);
        const sel = document.getElementById('briefCompany');
        sel.innerHTML = '<option value="">📢 通用（所有公司）</option>'
          + _partners.map(n => '<option value="' + esc(n) + '">🏢 ' + esc(n) + '</option>').join('');
      } catch (_) {}
    }
    await reload();
  } catch (e) { document.getElementById('loading').textContent = e.message || '加载失败'; return; }
  document.getElementById('loading').style.display = 'none';
}
async function reload() {
  const r = await api('/sms/briefings');
  _briefings = (r && r.briefings) || [];
  // 打开本页即视为已读, 收件箱红点熄灭 (以全部条目的最新更新时间为准)
  const maxUpd = _briefings.reduce((m, b) => b.updated_at > m ? b.updated_at : m, '');
  if (maxUpd) localStorage.setItem('brief_seen', maxUpd);
  render();
}
function _coBadge(name) {
  return name ? '<span class="co-badge">🏢 ' + esc(name) + '</span>' : '<span class="co-badge general">📢 通用</span>';
}
function render() {
  const isAdmin = USER && USER.role === 'admin';
  const today = todayChicago();
  document.getElementById('dateNow').textContent = '📅 ' + today;
  const todays = _briefings.filter(b => b.brief_date === today);
  document.getElementById('editSec').style.display = isAdmin ? '' : 'none';
  if (isAdmin) {
    const sel = document.getElementById('briefCompany').value;
    const cur = todays.find(b => (b.partner_name || '') === sel);
    document.getElementById('briefInput').value = cur ? cur.content : '';
    _shifts = cur && cur.shift ? cur.shift.split(' · ').filter(Boolean) : [];
    renderShiftChips();
    // 今天已发布的条目做成胶囊, 点击切换到该公司继续编辑
    document.getElementById('todayChips').style.display = todays.length ? '' : 'none';
    document.getElementById('todayChipList').innerHTML = todays.map(b =>
      '<button type="button" class="chip' + ((b.partner_name || '') === sel ? ' active' : '') + '" onclick="pickCompany(\'' + esc(b.partner_name || '').replace(/'/g, "\\'") + '\')">'
      + (b.partner_name ? '🏢 ' + esc(b.partner_name) : '📢 通用') + '</button>'
    ).join('');
  }
  // 客服视角: 今天的全部条目按卡片显示 (通用在最前)
  document.getElementById('todaySec').style.display = (!isAdmin && todays.length) ? '' : 'none';
  document.getElementById('emptySec').style.display = (!isAdmin && !todays.length) ? '' : 'none';
  document.getElementById('todayCards').innerHTML = todays.map(b =>
    '<div class="today-card"><div class="today-meta">' + _coBadge(b.partner_name)
    + '📅 ' + esc(b.brief_date) + (b.author ? ' · ' + esc(b.author) : '') + ' · 更新于 ' + esc(String(b.updated_at || '').slice(11, 16)) + '</div>'
    + (b.shift ? '<div class="shift-line">⏰ 工作时间：' + esc(b.shift) + '</div>' : '')
    + (b.content ? '<div class="today-text">' + esc(b.content) + '</div>' : '') + '</div>'
  ).join('');
  // 往日记录: 同一天的多条并列, 各带公司标
  const past = _briefings.filter(b => b.brief_date !== today);
  document.getElementById('histSec').style.display = past.length ? '' : 'none';
  document.getElementById('histList').innerHTML = past.map(b =>
    '<div class="hist-item"><div class="hist-date">' + _coBadge(b.partner_name) + esc(b.brief_date) + (b.author ? ' · ' + esc(b.author) : '') + '</div>'
    + (b.shift ? '<div class="shift-line" style="font-size:.76rem;padding:3px 8px">⏰ ' + esc(b.shift) + '</div>' : '')
    + (b.content ? '<div class="hist-text">' + esc(b.content) + '</div>' : '') + '</div>'
  ).join('');
}
function onCompanyChange() { render(); }
function pickCompany(name) {
  document.getElementById('briefCompany').value = name;
  render();
}
async function saveBriefing() {
  try {
    const content = document.getElementById('briefInput').value.trim();
    const partner = document.getElementById('briefCompany').value;
    const shift = _shifts.join(' · ');
    const r = await api('/sms/briefings', { method: 'POST', body: JSON.stringify({ content, partner_name: partner, shift }) });
    if (r && r.error) throw new Error(r.error);
    toast(r.deleted ? '🗑 已删除该条' : '📋 已发布 — 客服端会亮红点');
    await reload();
  } catch (e) { toast(e.message || '保存失败'); }
}
load();
</script>
</body>
</html>
