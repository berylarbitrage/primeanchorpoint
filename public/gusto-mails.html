<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gusto 邮件 · Prime Anchor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A7%3C/text%3E%3C/svg%3E">
<!--
  全部 Gusto 邮件: 邮箱同步脚本读到的每一封 Gusto 邮件, 按类型分好,
  每封看得到「有没有对上人 (关联)」和「转发给过谁」。处理 (关联 / 通过) 还是到新员工入职页做。
-->
<style>
:root{--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--blue:#29AAE1;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#eef3f8;color:#1f2937}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px 16px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:12px;padding:16px 18px;
  background:linear-gradient(135deg,#0f4c6b 0%,#1679a6 100%);border:none;color:#e0f2fe}
.hero h1{color:#fff;font-size:1.25rem;margin:0}
.hero .sub{color:#bae6fd;font-size:.8rem;margin-top:.25rem}
.btn{display:inline-flex;align-items:center;gap:.25rem;border:none;border-radius:8px;padding:.45rem .85rem;font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn-blue{background:var(--blue);color:#fff}
input,select{padding:.38rem .55rem;border:1px solid var(--g300);border-radius:8px;font-size:.84rem;background:#fff;font-family:inherit}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1.5px solid var(--g200);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font-family:inherit}
.stat:hover{border-color:#7dd3fc}
.stat.on{border-color:#0f4c6b;background:#f0f9ff}
.stat .n{font-size:1.3rem;font-weight:800;color:#0f172a}
.stat .t{font-size:.78rem;font-weight:700;color:var(--g600)}
.stat .s{font-size:.7rem;color:var(--g500)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--g300);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;border-left:1px solid var(--g200);background:none;padding:.4rem .7rem;font-size:.78rem;font-weight:700;color:var(--g600);cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:#0f4c6b;color:#fff}
.seg .c{font-weight:400;opacity:.8;margin-left:.2rem}
.lbl{font-size:.72rem;font-weight:800;color:var(--g500)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--g200)}
th{background:#f8fafc;text-align:left;font-size:.72rem;color:var(--g500);font-weight:800;padding:.5rem .6rem;border-bottom:1px solid var(--g200);white-space:nowrap}
td{padding:.5rem .6rem;border-bottom:1px solid var(--g100);font-size:.8rem;vertical-align:top}
tr:hover td{background:#fafcff}
.tag{display:inline-flex;align-items:center;gap:.2rem;padding:.1rem .5rem;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.k-accepted{background:#e0f2fe;color:#075985}.k-ready{background:#dcfce7;color:#166534}
.k-bank_bad{background:#fee2e2;color:#991b1b}.k-bank_updated{background:#fef3c7;color:#92400e}.k-other{background:var(--g100);color:var(--g600)}
.s-linked{background:#dcfce7;color:#166534}.s-confirm{background:#fef3c7;color:#92400e}.cf-btns{display:flex;gap:.3rem;margin-top:.3rem}.cf-btns button{font-size:.75rem;padding:.2rem .55rem;border-radius:6px;cursor:pointer;font-weight:600}.s-proposed{background:#e0f2fe;color:#075985}.s-unmatched{background:#fef2f2;color:#991b1b}
.s-ignored{background:var(--g100);color:var(--g500)}
.subj{color:var(--g500);font-size:.74rem;margin-top:.15rem;word-break:break-word}
.muted{color:var(--g500);font-size:.74rem}
.empty{padding:40px;text-align:center;color:var(--g500)}
@media(max-width:820px){ .hide-sm{display:none} }
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;background:#eef3f8;display:none;align-items:center;justify-content:center;z-index:10;padding:16px">
  <div class="card" style="max-width:340px;width:100%;text-align:center;padding:24px 20px">
    <img src="/logo.svg" style="height:48px" alt="">
    <div style="font-weight:800;margin:.5rem 0">📧 全部 Gusto 邮件</div>
    <input id="u" placeholder="用户名或邮箱" style="width:100%;margin-bottom:.5rem" autocomplete="username">
    <input id="p" type="password" placeholder="密码" style="width:100%" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <div id="gerr" style="color:var(--red);font-size:.8rem;min-height:1.1em;margin-top:.4rem"></div>
    <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="login()">登录</button>
  </div>
</div>

<div class="wrap" id="main" style="display:none">
  <div class="card hero">
    <div><h1>📧 全部 Gusto 邮件</h1>
      <div class="sub">邮箱同步读到的每一封 Gusto 邮件：什么类型、有没有对上人、转发给过谁。要关联 / 通过请到新员工入职页。</div>
      <div class="sub" id="syncInfo"></div></div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap"><a class="btn btn-ghost" href="/onboarding">← 新员工入职</a><button class="btn btn-ghost" onclick="load()">↻ 刷新</button>
      <button class="btn" id="fwdBtn" style="display:none;background:#fff;color:#0f4c6b" onclick="forwardUnsent()" title="把还没转发过的入职邮件发给转发名单（只发上面筛选出来的；暂时忽略的不发）">📨 一键转发没转发的</button></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card" style="margin-bottom:10px">
    <div class="bar"><span class="lbl">关联</span><div class="seg" id="segLink"></div>
      <span class="lbl" style="margin-left:.4rem">转发</span><div class="seg" id="segSent"></div></div>
    <div class="bar" style="margin:0"><input type="search" id="q" placeholder="搜名字 / 标题 / 工人…" style="flex:1;min-width:200px" oninput="render()">
      <span class="lbl">日期</span><input type="date" id="d1" onchange="render()"><span class="muted">到</span><input type="date" id="d2" onchange="render()">
      <button class="btn" style="background:#fff;border:1px solid var(--g300);color:var(--g600)" onclick="clearFilters()">清除筛选</button></div>
  </div>

  <div class="muted" id="count" style="margin:0 2px 6px"></div>
  <div id="list"></div>
</div>

<script>
let TOKEN = localStorage.getItem('acct_token') || localStorage.getItem('adminToken') || '';
let ROWS = [], KIND = 'all', LINK = 'all', SENT = 'all', IS_ADMIN = false;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KINDS = [['all', '全部', '所有 Gusto 邮件'], ['accepted', '接受邀请', 'accepted your offer'], ['ready', '可以付款', 'can now be paid'],
  ['bank_bad', '银行有误', 'bank details incorrect'], ['bank_updated', '银行已更新', 'bank details updated'], ['other', '其他 Gusto 邮件', '工资单、通知等']];
const LINKS = [['all', '全部'], ['linked', '✓ 已关联'], ['confirm', '👤 别人关联，等你确认'], ['proposed', '🔎 系统对上，等确认'], ['unmatched', '✗ 对不上人'], ['ignored', '暂时忽略']];
const SENTS = [['all', '全部'], ['yes', '📨 已转发'], ['no', '没转发']];
const STATUS = { linked: ['✓ 已关联', 's-linked'], confirm: ['👤 别人关联，等你确认', 's-confirm'], proposed: ['🔎 系统对上，等确认', 's-proposed'], unmatched: ['✗ 对不上人', 's-unmatched'], ignored: ['暂时忽略', 's-ignored'] };
function fmtTime(t) { if (!t) return ''; const d = new Date(/[TZ]/.test(t) ? t : String(t).replace(' ', 'T') + 'Z'); return isNaN(d) ? String(t) : d.toLocaleString(); }

async function api(path) {
  const r = await fetch(path, { headers: TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {} });
  if (r.status === 401) { showGate(); throw new Error('请先登录'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}
function showGate() { document.getElementById('gate').style.display = 'flex'; document.getElementById('main').style.display = 'none'; }
async function login() {
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value }) }).then(x => x.json()).catch(() => ({}));
  if (r.mfa_required) { location.href = '/mfa?token=' + encodeURIComponent(r.mfa_token) + '&next=' + encodeURIComponent(location.pathname) + (r.phone_hint ? '&hint=' + encodeURIComponent(r.phone_hint) : ''); return; }
  if (!r.success) { document.getElementById('gerr').textContent = r.error || '登录失败'; return; }
  TOKEN = r.token; localStorage.setItem('acct_token', TOKEN);
  document.getElementById('gate').style.display = 'none';
  load();
}

async function load() {
  let j;
  try { j = await api('/api/acct/onboarding-mails'); } catch (e) { return; }
  if (j.error) { document.getElementById('list').innerHTML = `<div class="card empty" style="color:var(--red)">${esc(j.error)}</div>`; document.getElementById('main').style.display = ''; return; }
  IS_ADMIN = !!j.is_admin;
  ROWS = (j.rows || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));   // 新的在前 (入职邮件和其他邮件混在一起排)
  const m = j.mail_sync || {};
  document.getElementById('syncInfo').textContent = m.last_at ? `邮箱同步上次报到 ${fmtTime(m.last_at)}${m.last_auto_at ? ' · 上次自动运行 ' + fmtTime(m.last_auto_at) : ''}${m.backfill_done_at ? ' · 以前的邮件已全部读完' : ''}${(j.forward_to || []).length ? ' · 转发给 ' + j.forward_to.join('、') : ''}` : '邮箱同步还没跑过';
  document.getElementById('main').style.display = '';
  render();
}
function isSent(r) { return (r.sent || []).length > 0; }
function pass(r, skip) {
  if (skip !== 'kind' && KIND !== 'all' && r.kind !== KIND) return false;
  if (skip !== 'link' && LINK !== 'all' && r.status !== LINK) return false;
  if (skip !== 'sent' && SENT !== 'all' && (SENT === 'yes') !== isSent(r)) return false;
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q && !`${r.name} ${r.subject} ${r.worker} ${(r.candidates || []).join(' ')}`.toLowerCase().includes(q)) return false;
  const d1 = document.getElementById('d1').value, d2 = document.getElementById('d2').value;
  if (d1 && r.date < d1) return false;
  if (d2 && r.date > d2) return false;
  return true;
}
function render() {
  // 上面的类型卡片: 每种多少封 (按当前的关联 / 转发 / 搜索筛选数)
  document.getElementById('stats').innerHTML = KINDS.map(([k, t, s]) => {
    const list = ROWS.filter(r => (k === 'all' || r.kind === k) && pass(r, 'kind'));
    const extra = k === 'other' || !list.length ? s : `已关联 ${list.filter(r => r.status === 'linked').length}${list.some(r => r.status === 'confirm') ? ` · 等确认 ${list.filter(r => r.status === 'confirm').length}` : ''} · 已转发 ${list.filter(isSent).length}`;
    return `<button class="stat ${KIND === k ? 'on' : ''}" onclick="KIND='${k}';render()"><div class="n">${list.length}</div><div class="t">${esc(t)}</div><div class="s">${esc(extra)}</div></button>`;
  }).join('');
  const seg = (id, opts, cur, set, field) => document.getElementById(id).innerHTML = opts.map(([k, t]) => {
    const n = ROWS.filter(r => pass(r, field) && (k === 'all' || (field === 'link' ? r.status === k : (k === 'yes') === isSent(r)))).length;
    return `<button class="${cur === k ? 'on' : ''}" onclick="${set}='${k}';render()">${esc(t)}<span class="c">${n}</span></button>`;
  }).join('');
  seg('segLink', LINKS, LINK, 'LINK', 'link');
  seg('segSent', SENTS, SENT, 'SENT', 'sent');
  const rows = ROWS.filter(r => pass(r));
  // 一键转发: 当前筛选出来的、入职相关、没转发过、没忽略的
  const unsent = rows.filter(r => r.kind !== 'other' && r.status !== 'ignored' && !isSent(r));
  const fb = document.getElementById('fwdBtn');
  fb.style.display = IS_ADMIN ? '' : 'none';
  fb.disabled = !unsent.length;
  fb.textContent = unsent.length ? `📨 一键转发没转发的（${unsent.length}）` : '📨 都转发过了';
  document.getElementById('count').textContent = `${rows.length} 封${rows.length !== ROWS.length ? `（共 ${ROWS.length} 封）` : ''} · 新的在前`;
  if (!rows.length) { document.getElementById('list').innerHTML = '<div class="card empty">没有符合条件的邮件</div>'; return; }
  document.getElementById('list').innerHTML = `<table><thead><tr><th>日期</th><th>类型</th><th>邮件里的名字 / 标题</th><th>关联到</th><th>转发</th></tr></thead><tbody>${rows.slice(0, 1500).map(r => {
    const st = STATUS[r.status];
    const link = r.kind === 'other' ? '<span class="muted">不是入职邮件</span>'
      : `${st ? `<span class="tag ${st[1]}">${st[0]}</span>` : ''}${r.worker ? `<div style="margin-top:.2rem"><b>${esc(r.worker)}</b>${r.status === 'linked' && r.admin_ok ? `<span class="muted"> · ${esc(r.admin_ok)} 审核${r.admin_ok_at ? ' ' + esc(fmtTime(r.admin_ok_at)) : ''}</span>` : r.by ? `<span class="muted"> · ${esc(r.by)} 关联的</span>` : ''}</div>` : ''}`
        + (r.status === 'confirm' && IS_ADMIN ? `<div class="cf-btns"><button style="background:#16a34a;color:#fff;border:0" onclick="confirmLink(${r.id},true)">✓ 对，确认</button><button style="background:#fff;color:#dc2626;border:1px solid #fca5a5" onclick="confirmLink(${r.id},false)">✗ 不是这个人</button></div>` : '')
        + (r.status === 'unmatched' && r.candidates.length ? `<div class="muted">可能是：${r.candidates.map(esc).join('、')}</div>` : '')
        + (r.status === 'ignored' && r.ignored_by ? `<div class="muted">${esc(r.ignored_by)} 忽略的</div>` : '')
        + (/^bank_/.test(r.kind) ? `<div class="muted">${r.ack_at ? '✓ ' + esc(r.ack_by) + ' 已处理' : '⚠ 还没处理'}</div>` : '');
    const sent = !isSent(r) ? (r.kind === 'other' ? '' : '<span class="muted">没转发</span>')
      : r.sent.length === 1 && r.sent[0].guess ? '<span class="tag" style="background:#f0fdf4;color:#166534" title="收到时自动转发给了当时的转发名单（具体是谁那时还没记）">📨 已自动转发</span>'
      : r.sent.map(x => `<div><span class="tag" style="background:#f0fdf4;color:#166534">📨 ${esc(x.to)}</span> <span class="muted">${esc(fmtTime(x.at))}${/resend/.test(x.how || '') ? ' · 补发' : ''}</span></div>`).join('');
    return `<tr><td style="white-space:nowrap">${esc(r.date)}</td><td><span class="tag k-${esc(r.kind)}">${esc(r.label)}</span></td>
      <td>${r.name ? `<b>${esc(r.name)}</b>` : ''}<div class="subj">${esc(r.subject)}</div></td><td>${link}</td><td>${sent}</td></tr>`;
  }).join('')}</tbody></table>${rows.length > 1500 ? '<div class="muted" style="margin-top:6px">只显示前 1500 封，用上面的筛选缩小范围</div>' : ''}`;
}
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}
function toast(msg, bad) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;left:50%;top:18px;transform:translateX(-50%);background:${bad ? '#dc2626' : '#16a34a'};color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
// 页面风格的确认框
function ask(html, okText, title) {
  return new Promise(done => {
    const m = document.createElement('div');
    m.style.cssText = 'position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px';
    m.innerHTML = `<div class="card" style="max-width:460px;width:100%"><div style="font-weight:800;margin-bottom:.45rem">${esc(title || '📨 一键转发没转发的邮件')}</div><div style="font-size:.86rem;line-height:1.6">${html}</div>
      <div style="display:flex;gap:.4rem;justify-content:flex-end;margin-top:.8rem"><button class="btn" style="background:#fff;border:1px solid var(--g300);color:var(--g600)" data-v="0">取消</button><button class="btn btn-blue" data-v="1">${esc(okText)}</button></div></div>`;
    m.onclick = e => { const b = e.target.closest('[data-v]'); if (e.target === m || b) { m.remove(); done(!!b && b.dataset.v === '1'); } };
    document.body.appendChild(m);
  });
}
async function confirmLink(id, ok) {
  const r = ROWS.find(x => x.id === id); if (!r) return;
  if (!ok && !(await ask(`这封「${esc(r.label)} · ${esc(r.name)}」不是 <b>${esc(r.worker)}</b> 的？<div class="muted" style="margin-top:.3rem">会取消关联（${esc(r.by || '别人')} 关联的），以后系统也不会再把它对到这个人。</div>`, '不是，取消关联', '✗ 否掉这个关联'))) return;
  const j = await post(`/api/acct/onboarding-mails/${id}/confirm`, { ok });
  if (j.error) return toast(j.error, true);
  toast(ok ? `已确认：${r.name} → ${r.worker}` : '已取消关联');
  load();
}
async function forwardUnsent() {
  const ids = ROWS.filter(r => pass(r) && r.kind !== 'other' && r.status !== 'ignored' && !isSent(r)).map(r => r.id);
  if (!ids.length) return;
  const c = await post('/api/acct/onboarding-mails/forward', { ids, count_only: true });
  if (c.error) return toast(c.error, true);
  if (!c.count) return toast('都已经转发过了');
  if (!(await ask(`把 <b>${c.count}</b> 封还没转发过的入职邮件，<b>一封一封</b>发给：<br><b>${c.to.map(esc).join('、')}</b>
      <div class="muted" style="margin-top:.4rem">只发上面筛选出来的；已经发给过某个人的不会再发给他；暂时忽略的不发。系统只存了邮件标题，发出去的是标题和链接，没有原邮件正文。${c.count > 300 ? '<br>一次最多发 300 封，剩下的再点一次。' : ''}</div>`, `发 ${Math.min(c.count, 300)} 封`))) return;
  const b = document.getElementById('fwdBtn'); b.disabled = true; b.textContent = '发送中…';
  const j = await post('/api/acct/onboarding-mails/forward', { ids });
  if (j.error) { toast(j.error, true); render(); return; }
  toast(`已转发 ${j.count} 封（共发出 ${j.sent} 封邮件）${j.more ? `，还剩 ${j.more} 封，再点一次` : ''}${j.error_note ? '；有的没发出去：' + j.error_note : ''}`, !!j.error_note);
  load();
}
function clearFilters() { KIND = 'all'; LINK = 'all'; SENT = 'all'; ['q', 'd1', 'd2'].forEach(id => document.getElementById(id).value = ''); render(); }

if (TOKEN) load(); else showGate();
</script>
<script src="/account-badge.js" defer></script>
</body>
</html>
