<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>打卡记录 · Check-in Records</title>
<style>
:root{--blue:#0F2B5B;--sky:#4A90D9;--green:#2D9D78;--red:#E63946;--amber:#F5A623;
--off:#F4F6FA;--gray-200:#E5E9F0;--gray-400:#9AA5B5;--gray-500:#7B8794;--gray-600:#5A6572;--gray-800:#2D3642}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--off);color:var(--gray-800);padding:1rem}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:1.25rem;color:var(--blue)}
.card{background:#fff;border-radius:12px;padding:1.25rem;box-shadow:0 1px 4px rgba(15,43,91,.08);margin-bottom:1rem}
.field{margin-bottom:.9rem}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--gray-600);margin-bottom:.3rem}
.field input{width:100%;padding:.65rem .8rem;border:2px solid var(--gray-200);border-radius:8px;font-size:1rem}
.field input:focus{outline:none;border-color:var(--sky)}
.btn{display:inline-block;padding:.55rem 1.1rem;border:none;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;background:var(--off);color:var(--gray-800)}
.btn-primary{background:var(--blue);color:#fff;width:100%;padding:.75rem}
.btn-sm{padding:.45rem .8rem;font-size:.84rem}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;padding:.6rem .8rem;border-radius:8px;font-size:.85rem;margin-bottom:.8rem}
.msg.show{display:block}
.msg-err{background:#FDECEA;color:var(--red)}
.toolbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.toolbar input[type=date],.toolbar select{padding:.5rem .6rem;border:2px solid var(--gray-200);border-radius:8px;font-size:.9rem;background:#fff}
table{width:100%;border-collapse:collapse;background:#fff;font-size:.86rem}
th,td{padding:.55rem .6rem;text-align:left;border-bottom:1px solid var(--gray-200);vertical-align:top}
th{background:var(--off);color:var(--gray-600);font-size:.78rem;white-space:nowrap}
tr:hover td{background:#FAFBFD}
.tag{display:inline-block;padding:.12rem .5rem;border-radius:99px;font-size:.72rem;font-weight:700}
.tag-open{background:#E7F6EF;color:var(--green)}
.tag-break{background:#FEF5E7;color:var(--amber)}
.tag-closed{background:var(--off);color:var(--gray-500)}
.tag-gps{background:#EAF2FB;color:var(--sky)}
.tag-warn{background:#FDECEA;color:var(--red)}
.summary{font-size:.85rem;color:var(--gray-600);margin-bottom:.6rem}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--gray-400)}
.table-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--gray-200)}
.table-scroll table{min-width:860px}
#printHeader{display:none}
/* 手机上表格压扁没法看，改用卡片列表；电脑和打印仍用表格 */
.cards{display:none}
.rec-card{background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:.7rem .85rem;margin-bottom:.6rem}
.rec-card .rc-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.rec-card .rc-sub{font-size:.76rem;color:var(--gray-500);margin-top:.15rem}
.rec-card .rc-times{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.5rem;font-size:.86rem;color:var(--gray-600)}
.rec-card .rc-times b{color:var(--gray-800)}
@media(max-width:768px){
  .table-scroll{display:none}
  .cards{display:block}
  .toolbar h1{width:100%}
  .toolbar input[type=date],.toolbar select{flex:1;min-width:110px}
}
@media print{
  body{background:#fff;padding:0}
  .no-print{display:none !important}
  .card{box-shadow:none;padding:0}
  #printHeader{display:block;text-align:center;margin-bottom:1rem}
  #printHeader h2{font-size:1.1rem;color:#000}
  #printHeader p{font-size:.8rem;color:#444;margin-top:.2rem}
  .cards{display:none !important}
  .table-scroll{display:block !important;overflow:visible;border:none}
  .table-scroll table{min-width:0}
  table{font-size:.78rem}
  th{background:#eee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tag{border:1px solid #999;background:none !important;color:#000 !important}
}
@media(max-width:640px){body{padding:.5rem}.card{padding:.85rem}}
</style>
</head>
<body>
<div class="wrap">

  <!-- Login view -->
  <div class="card" id="loginView" style="max-width:400px;margin:8vh auto 0">
    <div style="text-align:center;margin-bottom:1rem">
      <img src="logo.svg" alt="Logo" style="height:44px">
      <h1 style="margin-top:.5rem">打卡记录查询</h1>
      <p style="font-size:.82rem;color:var(--gray-500)">Check-in Records · 需要账号登录 / Login required</p>
    </div>
    <div id="loginMsg" class="msg"></div>
    <div class="field">
      <label>账号 / Username</label>
      <input type="text" id="loginUser" autocomplete="username">
    </div>
    <div class="field">
      <label>密码 / Password</label>
      <input type="password" id="loginPass" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="btnLogin" onclick="doLogin()">登录 / Login</button>
  </div>

  <!-- Records view -->
  <div id="recordsView" style="display:none">
    <div class="card">
      <div class="toolbar no-print">
        <h1 style="margin-right:auto">📋 打卡记录 <span style="font-size:.8rem;color:var(--gray-400);font-weight:400">Check-in Records</span></h1>
        <input type="date" id="datePick" onchange="loadRecords()">
        <select id="siteFilter" onchange="renderTable()"><option value="">全部仓库 / All Sites</option></select>
        <button class="btn btn-sm" onclick="loadRecords()">🔄 刷新</button>
        <button class="btn btn-sm" onclick="window.print()">🖨️ 打印 / Print</button>
        <button class="btn btn-sm" onclick="doLogout()" style="color:var(--red)">退出</button>
      </div>
      <div id="printHeader">
        <h2>Prime Anchor Workforce — 打卡记录 / Check-in Records</h2>
        <p id="printSub"></p>
      </div>
      <div class="summary" id="summary"></div>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>#</th><th>姓名<br>Name</th><th>工号<br>ID</th><th>仓库<br>Site</th>
            <th>上班<br>In</th><th>休息<br>Breaks</th><th>下班<br>Out</th>
            <th>工时<br>Hrs</th><th>加班<br>OT</th><th>状态<br>Status</th><th>GPS</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="cards" id="cardsBox"></div>
      <div class="empty" id="emptyBox" style="display:none">当天暂无打卡记录 / No records for this date</div>
    </div>
  </div>
</div>

<script>
let _token = sessionStorage.getItem('ci_rec_token') || '';
let _entries = [];
let _loadError = false;

// 默认日期与服务端一致（美国中部时区），避免半夜浏览器本地日期和记录日期错位
function todayStr() {
  try { return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' }); }
  catch (e) { return new Date().toLocaleDateString('en-CA'); }
}

// clock_in 有两种存储格式：'YYYY-MM-DD HH:MM:SS'（UTC）和 ISO '…T…Z'，统一解析
function parseUtc(v) {
  let s = String(v || '').trim();
  if (!s) return null;
  if (!s.includes('T')) s = s.replace(' ', 'T');
  if (!/(Z|[+-]\d{2}:?\d{2})$/.test(s)) s += 'Z';
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMsg');
  msg.className = 'msg';
  if (!u || !p) { msg.className = 'msg show msg-err'; msg.textContent = '请输入账号和密码 / Enter username and password'; return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const d = await r.json();
    if (d.mfa_required) { location.href = '/mfa?token=' + encodeURIComponent(d.mfa_token) + '&next=' + encodeURIComponent(location.pathname + location.search) + (d.phone_hint ? '&hint=' + encodeURIComponent(d.phone_hint) : ''); return; }
    if (!r.ok || !d.token) {
      if (d.needs_activation) throw new Error('账号需先在管理后台激活 / Account needs activation in admin portal');
      throw new Error(d.error || '登录失败 / Login failed');
    }
    _token = d.token;
    sessionStorage.setItem('ci_rec_token', _token);
    showRecords();
  } catch (e) {
    msg.className = 'msg show msg-err';
    msg.textContent = e.message;
  } finally { btn.disabled = false; }
}

function doLogout() {
  fetch('/api/admin/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + _token } }).catch(() => {});
  _token = '';
  sessionStorage.removeItem('ci_rec_token');
  document.getElementById('recordsView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

function showRecords() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('recordsView').style.display = 'block';
  if (!document.getElementById('datePick').value) document.getElementById('datePick').value = todayStr();
  loadRecords();
}

async function loadRecords() {
  const date = document.getElementById('datePick').value || todayStr();
  try {
    const r = await fetch('/api/admin/checkin-daily?date=' + date, { headers: { Authorization: 'Bearer ' + _token } });
    if (r.status === 401) { doLogout(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    _loadError = false;
    _entries = d.entries || [];
    // Rebuild site filter, keeping current selection when possible
    const sel = document.getElementById('siteFilter');
    const prev = sel.value;
    const sites = [...new Map(_entries.filter(e => e.site_name).map(e => [String(e.site_id), e.site_name + (e.site_code ? ' (' + e.site_code + ')' : '')])).entries()];
    sel.innerHTML = '<option value="">全部仓库 / All Sites</option>' + sites.map(([id, name]) => `<option value="${id}">${esc(name)}</option>`).join('');
    if (sites.some(([id]) => id === prev)) sel.value = prev;
    renderTable();
  } catch (e) {
    _loadError = true;
    _entries = [];
    renderTable();
  }
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function fmtTime(utc, tz) {
  const d = parseUtc(utc);
  if (!d) return utc ? String(utc).slice(11, 16) : '—';
  try {
    return d.toLocaleTimeString('zh-CN', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false });
  } catch (e) { return String(utc).slice(11, 16); }
}

function renderTable() {
  const date = document.getElementById('datePick').value || todayStr();
  const siteId = document.getElementById('siteFilter').value;
  const rows = siteId ? _entries.filter(e => String(e.site_id) === siteId) : _entries;
  const tbody = document.getElementById('tbody');
  document.getElementById('printSub').textContent = '日期 Date: ' + date + ' · 打印时间 Printed: ' + new Date().toLocaleString('zh-CN', { hour12: false });
  const open = rows.filter(e => e.status === 'open').length;
  const totalHrs = rows.reduce((s, e) => s + (e.total_hours || 0), 0);
  document.getElementById('summary').textContent = _loadError
    ? '⚠️ 加载失败，请点击「刷新」重试 / Failed to load, please retry'
    : `日期 ${date} · 共 ${rows.length} 条记录 · 在班 ${open} 人 · 合计工时 ${Math.round(totalHrs * 100) / 100} 小时`;
  document.getElementById('emptyBox').style.display = rows.length ? 'none' : 'block';
  document.getElementById('emptyBox').textContent = _loadError
    ? '加载失败 / Load failed'
    : '当天暂无打卡记录 / No records for this date';
  tbody.innerHTML = rows.map((e, i) => {
    const breaks = (e.breaks || []).map(b => fmtTime(b.start, e.timezone) + '–' + (b.end ? fmtTime(b.end, e.timezone) : '…')).join('<br>') || '—';
    const status = e.status === 'open'
      ? (e.on_break ? '<span class="tag tag-break">休息中</span>' : '<span class="tag tag-open">在班</span>')
      : '<span class="tag tag-closed">已下班</span>';
    const warn = e.suspect_proxy ? ` <span class="tag tag-warn" title="${esc(e.suspect_note || '')}">⚠ 同设备多人</span>` : '';
    return `<tr>
      <td>${i + 1}</td>
      <td style="font-weight:600">${esc(e.name)}${warn}</td>
      <td>${esc(e.emp_code)}</td>
      <td>${esc(e.site_name)}${e.site_code ? ' <span style="color:var(--gray-400)">(' + esc(e.site_code) + ')</span>' : ''}</td>
      <td>${fmtTime(e.clock_in, e.timezone)}</td>
      <td>${breaks}</td>
      <td>${fmtTime(e.clock_out, e.timezone)}</td>
      <td>${e.total_hours ? e.total_hours.toFixed(2) : '—'}</td>
      <td>${e.overtime_hours ? e.overtime_hours.toFixed(2) : '—'}</td>
      <td>${status}</td>
      <td>${e.geo_verified ? '<span class="tag tag-gps">✓</span>' : '—'}</td>
    </tr>`;
  }).join('');
  // 手机端卡片视图（与表格同数据）
  document.getElementById('cardsBox').innerHTML = rows.map(e => {
    const status = e.status === 'open'
      ? (e.on_break ? '<span class="tag tag-break">休息中</span>' : '<span class="tag tag-open">在班</span>')
      : '<span class="tag tag-closed">已下班</span>';
    const breaks = (e.breaks || []).map(b => fmtTime(b.start, e.timezone) + '–' + (b.end ? fmtTime(b.end, e.timezone) : '…')).join('、');
    return `<div class="rec-card"${e.suspect_proxy ? ' style="border-color:var(--red)"' : ''}>
      <div class="rc-top"><strong>${esc(e.name)}</strong><span>${e.suspect_proxy ? '<span class="tag tag-warn">⚠ 同设备多人</span> ' : ''}${e.geo_verified ? '<span class="tag tag-gps">GPS ✓</span> ' : ''}${status}</span></div>
      <div class="rc-sub">${esc(e.site_name)}${e.site_code ? ' (' + esc(e.site_code) + ')' : ''}${e.emp_code ? ' · ' + esc(e.emp_code) : ''}</div>
      ${e.suspect_proxy && e.suspect_note ? `<div class="rc-sub" style="color:var(--red)">${esc(e.suspect_note)}</div>` : ''}
      <div class="rc-times">
        <span>上班 <b>${fmtTime(e.clock_in, e.timezone)}</b></span>
        <span>下班 <b>${fmtTime(e.clock_out, e.timezone)}</b></span>
        <span>工时 <b>${e.total_hours ? e.total_hours.toFixed(2) : '—'}</b></span>
        ${e.overtime_hours ? `<span>加班 <b>${e.overtime_hours.toFixed(2)}</b></span>` : ''}
      </div>
      ${breaks ? `<div class="rc-sub" style="margin-top:.35rem">休息：${breaks}</div>` : ''}
    </div>`;
  }).join('');
}

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// Auto-resume session if a token is stored
(async function () {
  if (!_token) return;
  try {
    const r = await fetch('/api/admin/me', { headers: { Authorization: 'Bearer ' + _token } });
    if (r.ok) showRecords();
    else { _token = ''; sessionStorage.removeItem('ci_rec_token'); }
  } catch (e) {}
})();
</script>
</body>
</html>
