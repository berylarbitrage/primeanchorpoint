<!doctype html><html><head><meta charset="utf-8">
<title>Refill Checklist - Prime Anchor Workforce Inc</title>
<style>
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #0f172a; }
  .page {
    width: 8.5in; height: 10.98in; padding: 0.5in 0.55in;
    display: flex; flex-direction: column; justify-content: center;
  }
  .head { text-align: center; border-bottom: 3px solid #0f172a; padding-bottom: 8px; margin-bottom: 6px; }
  .head h1 { font-size: 20pt; margin: 0; letter-spacing: 2px; }
  .head .t2 { font-size: 11pt; font-weight: 700; color: #334155; margin-top: 2px; }
  .meta { display: flex; justify-content: space-between; font-size: 10pt; color: #334155; margin: 8px 2px 2px; font-weight: 600; }
  .meta .line { border-bottom: 1px solid #94a3b8; display: inline-block; min-width: 1.6in; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border: 1px solid #cbd5e1; padding: 5px 8px; font-size: 9.5pt; vertical-align: middle; }
  th { background: #f1f5f9; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .4px; color: #475569; }
  th.formcol { text-align: left; }
  td.lang, th.lang { text-align: center; width: 0.85in; }
  td.qty, th.qty { text-align: center; width: 1in; }
  .grp td { border: none; padding: 9px 0 3px; font-size: 11.5pt; font-weight: 800; background: #fff; }
  .grp .tag { display: inline-block; border-left: 6px solid; padding-left: 8px; }
  .g-ach .tag { border-color: #0369a1; color: #0c4a6e; }
  .g-check .tag { border-color: #44403c; color: #292524; }
  .g-zelle .tag { border-color: #a21caf; color: #86198f; }
  .g-paypal .tag { border-color: #047857; color: #065f46; }
  .g-cash .tag { border-color: #be123c; color: #9f1239; }
  .fname { font-weight: 700; font-size: 9.5pt; }
  .fzh { font-size: 8pt; color: #64748b; margin-top: 1px; }
  .box { display: inline-block; width: 13px; height: 13px; border: 1.6px solid #334155; border-radius: 3px; vertical-align: middle; }
  .qline { display: inline-block; border-bottom: 1px solid #94a3b8; width: 0.7in; height: 12px; }
  .foot { font-size: 8pt; color: #94a3b8; text-align: center; margin-top: 10px; }
  .hint { display: none; }
  @media screen {
    body { background: #64748b; padding: 20px; }
    .page { background: #fff; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
    .hint { display: block; color: #fff; font-size: 13px; text-align: center; margin-bottom: 12px; }
    .hint button { font-size: 13px; padding: 4px 12px; margin-left: 8px; cursor: pointer; }
  }
</style></head><body>
<p class="hint">Refill Checklist · 付款表格补充清单<button onclick="window.print()">🖨 打印</button></p>
<div class="page">
  <div class="head">
    <h1>REFILL CHECKLIST</h1>
    <div class="t2">付款方式表格补充清单 · Prime Anchor Workforce Inc</div>
  </div>
  <div class="meta">
    <span>Date 日期: <span class="line"></span></span>
    <span>Checked by 检查人: <span class="line"></span></span>
  </div>
  <table>
    <tr>
      <th class="formcol">Form 表格</th>
      <th class="lang">ZH+EN<br>中英</th>
      <th class="lang">EN<br>英文</th>
      <th class="lang">EN+ES<br>英西</th>
      <th class="qty">Qty 补充数量</th>
    </tr>
    <tbody id="rows"></tbody>
  </table>
  <div class="foot">每格打勾表示该语言版本已补齐 · Check each box when that language version is restocked</div>
</div>
<script>
  var GROUPS = [
    { cls: 'g-ach', title: '🏦 ACH / Direct Deposit', rows: [
      ['ACH / Direct Deposit Authorization', '直接存款授权表（本人收款）'],
      ['ACH — Authorize Another to Receive · Option B', '授权他人代收'],
      ['ACH — Third-Party Payee Form', '第三方签字'],
    ]},
    { cls: 'g-check', title: '✉️ Check 支票', rows: [
      ['Check Payment In-Person Receipt Authorization', '支票付款当面签收授权表'],
      ['Check — Authorize Another to Receive · Option B', '授权他人代收'],
      ['Check — Third-Party Payee Form', '第三方签字'],
    ]},
    { cls: 'g-zelle', title: '💸 Zelle', rows: [
      ['Zelle Payment Authorization and Account Confirmation', 'Zelle 付款授权与账户确认'],
      ['Zelle — Authorize Another to Receive · Option B', '授权他人代收'],
      ['Zelle — Third-Party Payee Form', '第三方签字'],
    ]},
    { cls: 'g-paypal', title: '💳 PayPal / Venmo / CashApp', rows: [
      ['PayPal / Venmo / CashApp Payment Authorization', '在线支付平台收款授权'],
      ['PayPal/Venmo/CashApp — Authorize Another to Receive · Option B', '授权他人代收'],
      ['PayPal/Venmo/CashApp — Third-Party Payee Form', '第三方签字'],
    ]},
    { cls: 'g-cash', title: '💵 Cash 现金', rows: [
      ['Cash Payment Receipt', '现金付款签收表'],
      ['Cash — Authorize Another to Receive · Option B', '授权他人代收'],
      ['Cash — Third-Party Payee Form', '第三方签字'],
    ]},
  ];
  document.getElementById('rows').innerHTML = GROUPS.map(function(g){
    return '<tr class="grp ' + g.cls + '"><td colspan="5"><span class="tag">' + g.title + '</span></td></tr>' +
      g.rows.map(function(r){
        return '<tr><td><div class="fname">' + r[0] + '</div><div class="fzh">' + r[1] + '</div></td>' +
          '<td class="lang"><span class="box"></span></td><td class="lang"><span class="box"></span></td>' +
          '<td class="lang"><span class="box"></span></td><td class="qty"><span class="qline"></span></td></tr>';
      }).join('');
  }).join('');
</script>
</body></html>
