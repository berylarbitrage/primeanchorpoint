<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>面试登记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--amber:#b45309;--amber-bg:#fffbeb;--sky:#0ea5e9;--blue:#2563eb;--red:#c5221f;
    --green:#059669;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-400:#9ca3af;--gray-500:#6b7280;
    --gray-600:#4b5563;--white:#fff}
  *{box-sizing:border-box;margin:0}
  body{font-family:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;background:var(--amber-bg);color:#1f2937;min-height:100vh}
  .top{background:var(--white);border-bottom:1.5px solid var(--gray-200);padding:10px 16px;display:flex;
    align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .top h1{font-size:1.05rem;color:var(--amber)}
  .top .sub{font-size:.75rem;color:var(--gray-500)}
  .btn{border:1px solid var(--gray-200);background:var(--white);border-radius:20px;padding:6px 14px;
    font-size:.8rem;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--gray-100)}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#fff}
  .btn.primary:hover{background:#92400e}
  .btn.ok{background:var(--green);border-color:var(--green);color:#fff}
  .btn.bad{background:var(--red);border-color:var(--red);color:#fff}
  .btn.sm{padding:3px 10px;font-size:.72rem}
  .wrap{max-width:900px;margin:0 auto;padding:14px 14px 60px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{padding:4px 12px;border-radius:20px;border:1px solid var(--gray-200);background:var(--white);
    font-size:.78rem;cursor:pointer;font-family:inherit}
  .chip.on{background:var(--sky);border-color:var(--sky);color:#fff}
  #q{width:100%;border:1px solid var(--gray-200);border-radius:20px;padding:8px 16px;font-size:.85rem;
    font-family:inherit;margin-bottom:10px;outline:none}
  #q:focus{border-color:var(--sky)}
  .card{background:var(--white);border:1px solid var(--gray-200);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .card .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .name{font-weight:800;font-size:.95rem}
  .card .phone{font-size:.8rem;color:var(--gray-500)}
  .badge{font-size:.7rem;font-weight:700;padding:2px 10px;border-radius:10px;white-space:nowrap}
  .b-701{background:#e0f2fe;color:#075985}
  .b-arrange{background:#fef3c7;color:#92400e}
  .b-wh{background:#ede9fe;color:#5b21b6}
  .b-pass{background:#d1fae5;color:#065f46}
  .b-fail{background:#fee2e2;color:#991b1b}
  .stage{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;margin-top:8px;
    padding:7px 10px;background:#f9fafb;border-radius:10px}
  .stage .tag{font-weight:700;color:var(--gray-600);flex:none}
  .stage .res-pass{color:var(--green);font-weight:700}
  .stage .res-fail{color:var(--red);font-weight:700}
  .notes{font-size:.76rem;color:var(--gray-600);margin-top:6px;white-space:pre-wrap}
  .empty{text-align:center;color:var(--gray-400);padding:50px 0}
  /* 日历 */
  .cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .cal-nav .label{font-weight:800;font-size:.95rem;color:var(--amber)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-head{font-size:.72rem;font-weight:700;color:var(--gray-500);text-align:center;padding:4px 0}
  .cal-cell{background:var(--white);border:1px solid var(--gray-200);border-radius:10px;
    min-height:86px;padding:4px;font-size:.7rem;overflow:hidden}
  .cal-cell.dim{opacity:.45}
  .cal-cell.today{border-color:var(--amber);border-width:2px}
  .cal-cell .d{font-weight:800;color:var(--gray-500);margin-bottom:2px}
  .cal-cell.today .d{color:var(--amber)}
  .cal-week .cal-cell{min-height:190px;font-size:.76rem}
  .cal-entry{border-radius:6px;padding:2px 5px;margin-bottom:3px;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-entry.k701{background:#e0f2fe;color:#075985}
  .cal-entry.kwh{background:#ede9fe;color:#5b21b6}
  .cal-entry.done{opacity:.55;text-decoration:line-through}
  .cal-entry:hover{filter:brightness(.95)}
  /* 登录 + 弹窗 */
  #gate{max-width:340px;margin:80px auto;background:var(--white);border:1px solid var(--gray-200);
    border-radius:16px;padding:24px}
  #gate input{width:100%;border:1px solid var(--gray-200);border-radius:10px;padding:9px 12px;
    font-size:.9rem;margin-top:8px;font-family:inherit}
  .err{color:var(--red);font-size:.8rem;margin-top:8px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:16px}
  .modal{background:var(--white);border-radius:16px;padding:20px;max-width:460px;width:100%;
    max-height:90vh;overflow-y:auto}
  .modal h2{font-size:1rem;color:var(--amber);margin-bottom:10px}
  .modal label{display:block;font-size:.78rem;font-weight:700;color:var(--gray-600);margin:10px 0 4px}
  .modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--gray-200);border-radius:10px;
    padding:8px 12px;font-size:.85rem;font-family:inherit;background:var(--white)}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .hint{font-size:.72rem;color:var(--gray-400);margin-top:4px}
</style>
</head>
<body>

<div id="gate" style="display:none">
  <h1 style="color:var(--amber);font-size:1.1rem">📋 面试登记</h1>
  <input id="user" placeholder="用户名">
  <input id="pw" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
  <div class="err" id="gateErr"></div>
  <button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">登录</button>
  <div class="hint" style="margin-top:12px;line-height:1.7">用内部系统的账号（和 SMS Inbox / 手机短信同一套）。<br>
  忘了客服账号的密码？管理员登录 <b>SMS Inbox → ⚙ 管理面板 → 客服账号</b>，那里能<b>直接看到每个客服账号的密码</b>，也能重置。</div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <h1>📋 面试登记</h1>
    <span class="sub">先到 701 初试，通过再安排仓库复试</span>
    <div style="flex:1"></div>
    <button class="btn" id="s701Btn" onclick="edit701()">⚙ 701 地址</button>
    <button class="btn primary" onclick="newInterview()">➕ 登记面试</button>
  </div>
  <div class="wrap">
    <input id="q" placeholder="搜姓名 / 电话 / 工种 / 仓库…" oninput="render()">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
  </div>
</div>

<div id="modalHost"></div>

<script>
// 和 SMS Inbox 共用登录态：那边登过（含短信验证码 MFA），这边直接就是登录的
let TOKEN = localStorage.getItem('adminToken') || localStorage.getItem('pa_interviews_token') || '';
let ROWS = [], PARTNERS = [], S701 = '', ROLE = '';
let FILTER = 'todo';
let VIEW = 'list';                       // list | week | month
let ANCHOR = new Date();                 // 日历定位
let OPEN_CARD_ID = null;                 // 日历里点开的那张卡

const FILTERS = [
  ['todo', '待处理'], ['s701', '待701初试'], ['arrange', '待安排仓库'],
  ['wh', '待仓库复试'], ['pass', '✓ 已通过'], ['fail', '✗ 未通过/没来'], ['all', '全部'],
];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtPhone(v){ const d = String(v||'').replace(/\D/g,''); if(d.length===11&&d[0]==='1')return '('+d.substr(1,3)+') '+d.substr(4,3)+'-'+d.substr(7); if(d.length===10)return '('+d.substr(0,3)+') '+d.substr(3,3)+'-'+d.substr(6); return String(v||''); }
function fmtWhen(v){ if(!v) return ''; const d = new Date(v); if(isNaN(d)) return String(v);
  return d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'}) + ' ' + d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Authorization': 'Bearer ' + TOKEN, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opts.body
  });
  if (res.status === 401 || res.status === 403) {
    const j = await res.json().catch(() => ({}));
    if (res.status === 401) { showGate('登录已过期。'); throw new Error('unauthorized'); }
    throw new Error(j.error || '没有权限');
  }
  return res.json();
}

function showGate(msg){ document.getElementById('gate').style.display=''; document.getElementById('app').style.display='none';
  if(msg) document.getElementById('gateErr').textContent = msg; }

const ERR_ZH = { 'Invalid username or password': '用户名或密码不对' };
let PENDING_ACTIVATION = null;   // 第一次登录要自己设新密码 {username, password}

async function login() {
  const username = document.getElementById('user').value.trim();
  const password = document.getElementById('pw').value;
  const err = document.getElementById('gateErr');
  err.textContent = '';
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username, password })
  }).then(x=>x.json()).catch(()=>({}));
  if (r.mfa_required) { gotoMfa(r); return; }
  if (r.needs_activation) { PENDING_ACTIVATION = { username, password }; showActivate(); return; }
  if (!r.success) { err.textContent = ERR_ZH[r.error] || r.error || '登录失败（网不通？再试一次）'; return; }
  finishLogin(r);
}

/* 开了短信验证码（MFA）的账号：去 /mfa 输验证码，完成后带着登录态跳回本页 */
function gotoMfa(r) {
  location.href = '/mfa?token=' + encodeURIComponent(r.mfa_token || '')
    + '&next=' + encodeURIComponent('/interviews')
    + (r.phone_hint ? '&hint=' + encodeURIComponent(r.phone_hint) : '');
}

function finishLogin(r) {
  TOKEN = r.token; ROLE = r.role || '';
  localStorage.setItem('adminToken', TOKEN);           // 和 SMS Inbox 共用
  localStorage.setItem('pa_interviews_token', TOKEN);
  start();
}

/* 新账号第一次登录：临时密码对了，但要本人设一个新密码才算激活 */
function showActivate() {
  document.getElementById('gate').innerHTML =
    '<h1 style="color:var(--amber);font-size:1.1rem">🔑 第一次登录，设置新密码</h1>'
    + '<div class="hint" style="margin-top:8px">账号 ' + esc(PENDING_ACTIVATION.username)
    + ' 密码正确。为了安全，请设置一个只有你自己知道的新密码，以后就用它登录。</div>'
    + '<input id="npw1" type="password" placeholder="新密码">'
    + '<input id="npw2" type="password" placeholder="再输一遍" onkeydown="if(event.key===\'Enter\')activate()">'
    + '<div class="err" id="gateErr"></div>'
    + '<button class="btn primary" style="width:100%;margin-top:12px" onclick="activate()">设置并登录</button>';
}

async function activate() {
  const p1 = document.getElementById('npw1').value, p2 = document.getElementById('npw2').value;
  const err = document.getElementById('gateErr');
  if (!p1) { err.textContent = '新密码不能为空'; return; }
  if (p1 !== p2) { err.textContent = '两次输入的不一样'; return; }
  const r = await fetch('/api/auth/activate', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username: PENDING_ACTIVATION.username,
      current_password: PENDING_ACTIVATION.password, new_password: p1 })
  }).then(x=>x.json()).catch(()=>({}));
  if (r.mfa_required) { gotoMfa(r); return; }
  if (!r.success) { err.textContent = r.error || '设置失败'; return; }
  finishLogin(r);
}

function start(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='';
  load(); setInterval(load, 30000); handleDeepLink(); }

/* 从手机短信页跳过来：#new=号码&name=xx → 自动打开登记弹窗填好号码和名字 */
function handleDeepLink() {
  const m = location.hash.match(/new=(\d{7,})(?:&name=([^&]*))?/);
  if (!m) return;
  newInterview();
  document.getElementById('fPhone').value = m[1].slice(-10);
  document.getElementById('fSource').value = '手机短信';
  const name = decodeURIComponent(m[2] || '');
  if (name && !/^[()\d\s+-]*$/.test(name)) document.getElementById('fName').value = name;
  history.replaceState(null, '', location.pathname);
}

async function load() {
  try {
    const r = await api('/interview-registry');
    ROWS = r.rows || []; PARTNERS = r.partners || []; S701 = r.s701_address || '';
    render();
    refreshOpenCard();
  } catch (_) {}
}

/* 一个人走到哪一步了 */
function stageOf(r) {
  if (r.wh_result === 'pass') return 'pass';
  if (r.s701_result === 'fail' || r.wh_result === 'fail'
      || r.s701_result === 'noshow' || r.wh_result === 'noshow') return 'fail';
  if (r.wh_at) return 'wh';
  if (r.s701_result === 'pass') return 'arrange';
  return 's701';
}
const STAGE_BADGE = { s701:['b-701','待701初试'], arrange:['b-arrange','701✓ 待安排仓库'],
  wh:['b-wh','待仓库复试'], pass:['b-pass','✓ 已通过'], fail:['b-fail','✗ 未通过/没来'] };

function render() {
  const views = [['list','📋 列表'],['week','📅 本周'],['month','🗓 本月']];
  let bar = views.map(([v, label]) =>
    '<button class="chip'+(VIEW===v?' on':'')+'" onclick="VIEW=\''+v+'\';render()">'+label+'</button>').join('');
  if (VIEW !== 'list') {
    bar += '<span style="flex-basis:100%"></span>'
      + '<button class="chip" onclick="calMove(-1)">‹ 上一'+(VIEW==='week'?'周':'月')+'</button>'
      + '<button class="chip" onclick="ANCHOR=new Date();render()">今天</button>'
      + '<button class="chip" onclick="calMove(1)">下一'+(VIEW==='week'?'周':'月')+' ›</button>'
      + '<span class="cal-nav label" style="font-weight:800;color:var(--amber);align-self:center">' + calLabel() + '</span>';
  }
  document.getElementById('chips').innerHTML = bar
    + '<span style="flex-basis:100%"></span>' + (VIEW==='list' ? filterChips() : '');
  if (VIEW !== 'list') { renderCal(); return; }
  renderList();
}

function filterChips() {
  return FILTERS.map(([k, label]) => {
    const n = k==='all' ? ROWS.length : ROWS.filter(r => k==='todo'
      ? ['s701','arrange','wh'].includes(stageOf(r)) : stageOf(r)===k).length;
    return '<button class="chip'+(FILTER===k?' on':'')+'" onclick="FILTER=\''+k+'\';render()">'+label+' '+n+'</button>';
  }).join('');
}

function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let list = ROWS.filter(r => {
    const st = stageOf(r);
    if (FILTER==='todo' && !['s701','arrange','wh'].includes(st)) return false;
    if (FILTER!=='todo' && FILTER!=='all' && st!==FILTER) return false;
    if (q && !(r.name+' '+r.phone+' '+r.position+' '+r.wh_partner_name+' '+r.notes).toLowerCase().includes(q)) return false;
    return true;
  });
  // 待处理按最近的面试时间排前面，办完的按登记顺序倒排
  const timeOf = r => stageOf(r)==='wh' ? (r.wh_at||'9') : (r.s701_at||'9');
  list.sort((a,b) => {
    const ta = ['s701','arrange','wh'].includes(stageOf(a)), tb = ['s701','arrange','wh'].includes(stageOf(b));
    if (ta !== tb) return ta ? -1 : 1;
    return ta ? (timeOf(a) < timeOf(b) ? -1 : 1) : (b.id - a.id);
  });

  document.getElementById('list').innerHTML = list.length ? list.map(card).join('')
    : '<div class="empty">没有记录。点右上角「➕ 登记面试」。</div>';
}

/* ── 日历（月/周） ── */

function calMove(step) {
  const d = new Date(ANCHOR);
  if (VIEW === 'week') d.setDate(d.getDate() + step * 7);
  else d.setMonth(d.getMonth() + step);
  ANCHOR = d;
  render();
}

function weekStart(d) { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - x.getDay()); return x; }
function dayKey(d) { return d.toLocaleDateString('en-CA'); }

function calLabel() {
  if (VIEW === 'month') return ANCHOR.getFullYear() + '年' + (ANCHOR.getMonth() + 1) + '月';
  const s = weekStart(ANCHOR), e = new Date(s); e.setDate(e.getDate() + 6);
  return (s.getMonth()+1) + '月' + s.getDate() + '日 – ' + (e.getMonth()+1) + '月' + e.getDate() + '日';
}

/* 每条登记最多出两个日历条目：①701 初试、②仓库复试 */
function calEntries() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const map = {};
  for (const r of ROWS) {
    if (q && !(r.name+' '+r.phone+' '+r.position+' '+r.wh_partner_name+' '+r.notes).toLowerCase().includes(q)) continue;
    for (const [kind, at, result] of [['701', r.s701_at, r.s701_result], ['wh', r.wh_at, r.wh_result]]) {
      if (!at) continue;
      const d = new Date(at);
      if (isNaN(d)) continue;
      (map[dayKey(d)] = map[dayKey(d)] || []).push({ kind, at, result, r });
    }
  }
  for (const k in map) map[k].sort((a, b) => a.at < b.at ? -1 : 1);
  return map;
}

function calEntryHtml(e, full) {
  const t = new Date(e.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  const who = e.r.name || fmtPhone(e.r.phone) || '?';
  const tag = e.kind === '701' ? '①701' : '②' + (e.r.wh_partner_name || '仓库');
  return '<div class="cal-entry k' + (e.kind === '701' ? '701' : 'wh') + (e.result ? ' done' : '')
    + '" onclick="openCard(' + e.r.id + ')" title="' + esc(who + ' · ' + tag) + '">'
    + t + ' ' + esc(who) + (full ? '<br><span style="opacity:.75">' + esc(tag)
      + (e.r.position ? ' · ' + esc(e.r.position) : '') + '</span>' : '') + '</div>';
}

function renderCal() {
  const entries = calEntries();
  const today = dayKey(new Date());
  const heads = ['日','一','二','三','四','五','六'].map(d => '<div class="cal-head">' + d + '</div>').join('');
  let cells = '';
  if (VIEW === 'week') {
    const start = weekStart(ANCHOR);
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      const k = dayKey(d);
      cells += '<div class="cal-cell' + (k === today ? ' today' : '') + '">'
        + '<div class="d">' + (d.getMonth()+1) + '/' + d.getDate() + '</div>'
        + (entries[k] || []).map(e => calEntryHtml(e, true)).join('') + '</div>';
    }
  } else {
    const first = new Date(ANCHOR.getFullYear(), ANCHOR.getMonth(), 1);
    const start = weekStart(first);
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(d.getDate() + i);
      if (i >= 35 && d.getMonth() !== ANCHOR.getMonth()) break;
      const k = dayKey(d);
      cells += '<div class="cal-cell' + (d.getMonth() !== ANCHOR.getMonth() ? ' dim' : '')
        + (k === today ? ' today' : '') + '">'
        + '<div class="d">' + d.getDate() + '</div>'
        + (entries[k] || []).map(e => calEntryHtml(e, false)).join('') + '</div>';
    }
  }
  document.getElementById('list').innerHTML =
    '<div class="cal-grid' + (VIEW === 'week' ? ' cal-week' : '') + '">' + heads + cells + '</div>'
    + '<div class="hint" style="margin-top:8px">蓝色 = 701 初试 · 紫色 = 仓库复试 · 划掉 = 已出结果。点条目看详情、记结果。</div>';
}

/* 日历里点一条 → 弹出这个人的卡片，按钮全能用；操作完自动刷新弹窗 */
function openCard(id) {
  OPEN_CARD_ID = id;
  const r = row(id);
  if (!r) return;
  openModal('<div id="cardHost">' + card(r) + '</div>'
    + '<div class="row"><button class="btn" onclick="OPEN_CARD_ID=null;closeModal()">关闭</button></div>');
}

function refreshOpenCard() {
  if (OPEN_CARD_ID == null) return;
  const host = document.getElementById('cardHost');
  const r = row(OPEN_CARD_ID);
  if (host && r) host.innerHTML = card(r);
  else OPEN_CARD_ID = null;
}

function resBtns(id, field, current) {
  if (current) {
    const label = { pass:'✓ 通过', fail:'✗ 未通过', noshow:'✗ 没来' }[current] || current;
    return '<span class="' + (current==='pass'?'res-pass':'res-fail') + '">' + label + '</span>'
      + ' <button class="btn sm" onclick="setResult(' + id + ',\'' + field + '\',\'\')">改</button>';
  }
  return '<button class="btn sm ok" onclick="setResult(' + id + ',\'' + field + '\',\'pass\')">通过</button>'
    + '<button class="btn sm bad" onclick="setResult(' + id + ',\'' + field + '\',\'fail\')">未通过</button>'
    + '<button class="btn sm" onclick="setResult(' + id + ',\'' + field + '\',\'noshow\')">没来</button>';
}

/* 联动：一键跳到这个号码在「手机短信」/「SMS Inbox」的对话 */
function chatLinks(phone) {
  const digits = String(phone || '').replace(/\D/g, '');
  if (digits.length < 7) return '';
  const ten = digits.slice(-10);
  return '<a class="btn sm" style="text-decoration:none" target="_blank" href="/phone-sms#p=' + ten + '" title="在手机短信里打开对话">💬</a>'
    + '<a class="btn sm" style="text-decoration:none" target="_blank" href="/sms-inbox#phone=' + ten + '" title="在 SMS Inbox 里打开对话">📨</a>';
}

function card(r) {
  const [cls, label] = STAGE_BADGE[stageOf(r)];
  const st = stageOf(r);
  let s701 = '<div class="stage"><span class="tag">① 初试</span>'
    + '<span>' + (r.s701_at ? '🕐 ' + fmtWhen(r.s701_at) : '时间待定') + '</span>'
    + '<span style="color:var(--gray-400)">📍 ' + esc(r.s701_place || ('701 — ' + S701)) + '</span>'
    + '<button class="btn sm" onclick="edit701Time(' + r.id + ')">改时间</button>'
    + '<div style="flex:1"></div>' + resBtns(r.id, 's701_result', r.s701_result) + '</div>';

  let wh = '';
  if (st === 'arrange') {
    wh = '<div class="stage"><span class="tag">② 仓库复试</span>'
      + '<button class="btn sm primary" onclick="arrangeWh(' + r.id + ')">安排仓库复试（选仓库和时间）</button></div>';
  } else if (r.wh_at || r.wh_address) {
    wh = '<div class="stage"><span class="tag">② 仓库复试</span>'
      + '<span>🕐 ' + fmtWhen(r.wh_at) + '</span>'
      + '<span style="color:var(--gray-400)">📍 ' + esc(r.wh_partner_name) + (r.wh_address ? ' · ' + esc(r.wh_address) : '') + '</span>'
      + '<button class="btn sm" onclick="arrangeWh(' + r.id + ')">改</button>'
      + '<div style="flex:1"></div>' + resBtns(r.id, 'wh_result', r.wh_result) + '</div>';
  }

  return '<div class="card">'
    + '<div class="head"><span class="name">' + esc(r.name || '(未留名)') + '</span>'
    + '<span class="phone">' + esc(fmtPhone(r.phone)) + '</span>'
    + (r.position ? '<span class="badge" style="background:var(--gray-100);color:var(--gray-600)">' + esc(r.position) + '</span>' : '')
    + (r.source ? '<span class="badge" style="background:#fef3c7;color:#92400e">来源: ' + esc(r.source) + '</span>' : '')
    + '<span class="badge ' + cls + '">' + label + '</span>'
    + '<div style="flex:1"></div>'
    + chatLinks(r.phone)
    + '<button class="btn sm" onclick="editNotes(' + r.id + ')">📝</button>'
    + (ROLE === 'admin' ? '<button class="btn sm" onclick="delRow(' + r.id + ')">删</button>' : '')
    + '</div>'
    + s701 + wh
    + (r.notes ? '<div class="notes">📝 ' + esc(r.notes) + '</div>' : '')
    + '</div>';
}

/* ── 弹窗 ── */
function openModal(html){ document.getElementById('modalHost').innerHTML =
  '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">' + html + '</div></div>'; }
function closeModal(){ document.getElementById('modalHost').innerHTML=''; }
function row(r){ return ROWS.find(x => x.id === r); }

const SOURCES = ['中文网', 'Indeed', 'SMS Inbox', '手机短信', '朋友介绍', '其他'];
const POSITIONS = ['普工', '普通叉车', '高位叉车', '卸柜工', '装卸工', '拣货员', '打包员', '分拣员'];
let POS_SET = new Set();

/* ── 地点下拉（按公司分组、显示完整地址） ──
   placePick: 初试地点用，第一项是 701 默认完整地址，value='' 表示用默认；
   whPick:    复试仓库用，value = "公司序号|地址"。 */
function placePick(id, current) {
  let html = '<select id="' + id + '">'
    + '<option value=""' + (current ? '' : ' selected') + '>📍 701（默认）— ' + esc(S701) + '</option>';
  for (const p of PARTNERS) {
    if (!p.addresses.length) continue;
    html += '<optgroup label="' + esc(p.name) + '">'
      + p.addresses.map(a => {
          const v = p.name + ' — ' + a;
          return '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>🏭 ' + esc(v) + '</option>';
        }).join('')
      + '</optgroup>';
  }
  return html + '</select>';
}

function whPick(id, selName, selAddr) {
  let html = '<select id="' + id + '"><option value="">— 暂不选 —</option>';
  PARTNERS.forEach((p, i) => {
    if (!p.addresses.length) return;
    html += '<optgroup label="' + esc(p.name) + '">'
      + p.addresses.map(a => '<option value="' + i + '|' + esc(a) + '"'
          + (p.name === selName && a === selAddr ? ' selected' : '') + '>🏭 ' + esc(p.name) + ' — ' + esc(a) + '</option>').join('')
      + '</optgroup>';
  });
  return html + '</select>';
}

function whParse(id) {
  const v = document.getElementById(id).value;
  if (!v) return { id: null, name: '', addr: '' };
  const bar = v.indexOf('|');
  const p = PARTNERS[parseInt(v.slice(0, bar))];
  return p ? { id: p.id, name: p.name, addr: v.slice(bar + 1) } : { id: null, name: '', addr: '' };
}
let peopleTimer = null;

function newInterview() {
  openModal('<h2>➕ 登记面试</h2>'
    + '<label>从聊天里找人（选中自动填姓名电话）</label>'
    + '<input id="fFind" placeholder="输名字或号码，从 SMS Inbox / 手机短信里搜…" oninput="findPeople()">'
    + '<div id="fFindBox" style="border:1px solid var(--gray-200);border-radius:10px;max-height:150px;overflow-y:auto;display:none"></div>'
    + '<label>姓名</label><input id="fName">'
    + '<label>电话</label><input id="fPhone" placeholder="(312) 555-0100">'
    + '<label>来源</label><select id="fSource"><option value="">— 选来源 —</option>'
    + SOURCES.map(s => '<option>' + s + '</option>').join('') + '</select>'
    + '<label>工种（点选，可多选）</label>'
    + '<div class="chips" id="fPosChips" style="margin-bottom:4px"></div>'
    + '<input id="fPos" placeholder="别的工种手填（可留空）">'
    + '<label>① 初试时间</label><input id="fAt" type="datetime-local">'
    + '<label>① 初试地点（一般是 701，也可以直接去仓库）</label>' + placePick('fPlace', '')
    + '<label>意向仓库（可选 — 初试通过后复试的地方，先记上）</label>' + whPick('fWh', '', '')
    + '<label>备注</label><textarea id="fNotes" rows="2"></textarea>'
    + '<div class="row"><button class="btn" onclick="closeModal()">取消</button>'
    + '<button class="btn primary" onclick="saveNew()">登记</button></div>');
  POS_SET = new Set();
  renderPosChips();
  document.getElementById('fFind').focus();
}

function renderPosChips() {
  const box = document.getElementById('fPosChips');
  if (!box) return;
  box.innerHTML = POSITIONS.map((p, i) =>
    '<button type="button" class="chip' + (POS_SET.has(p) ? ' on' : '') + '" onclick="togglePos(' + i + ')">'
    + p + '</button>').join('');
}
function togglePos(i) {
  const p = POSITIONS[i];
  POS_SET.has(p) ? POS_SET.delete(p) : POS_SET.add(p);
  renderPosChips();
}

/* 姓名电话联动：从 SMS Inbox / 手机短信的联系人里搜，点一下全填好 */
function findPeople() {
  clearTimeout(peopleTimer);
  peopleTimer = setTimeout(async () => {
    const q = fVal('fFind');
    const box = document.getElementById('fFindBox');
    if (!box) return;
    if (q.length < 2) { box.style.display = 'none'; return; }
    let people = [];
    try { people = (await api('/interview-registry/people?q=' + encodeURIComponent(q))).people || []; }
    catch (_) {}
    window._people = people;
    box.style.display = '';
    box.innerHTML = people.length ? people.map((p, i) =>
      '<div style="padding:7px 12px;font-size:.8rem;cursor:pointer;border-bottom:1px solid var(--gray-100);'
      + 'display:flex;gap:8px;align-items:center" onclick="pickPerson(' + i + ')">'
      + '<b>' + esc(p.name || '(无名)') + '</b>'
      + '<span style="color:var(--gray-500)">' + esc(fmtPhone(p.phone)) + '</span>'
      + '<span class="badge" style="margin-left:auto;background:var(--gray-100);color:var(--gray-600)">' + esc(p.src) + '</span></div>'
    ).join('') : '<div style="padding:8px 12px;font-size:.78rem;color:var(--gray-400)">没找到，直接在下面手填也行</div>';
  }, 300);
}

function pickPerson(i) {
  const p = (window._people || [])[i];
  if (!p) return;
  document.getElementById('fName').value = p.name || '';
  document.getElementById('fPhone').value = p.phone || '';
  document.getElementById('fSource').value = p.src;
  document.getElementById('fFindBox').style.display = 'none';
  document.getElementById('fFind').value = '';
}

async function saveNew() {
  const wh = whParse('fWh');
  const position = [...POSITIONS.filter(p => POS_SET.has(p)), fVal('fPos')].filter(Boolean).join(' / ');
  const body = { name: fVal('fName'), phone: fVal('fPhone'), position,
    s701_at: fVal('fAt'), s701_place: document.getElementById('fPlace').value,
    notes: fVal('fNotes'), source: document.getElementById('fSource').value,
    wh_partner_id: wh.id, wh_partner_name: wh.name, wh_address: wh.addr };
  if (!body.name && !body.phone) return;
  closeModal();
  await api('/interview-registry', { method: 'POST', body: JSON.stringify(body) });
  load();
}
function fVal(id){ return document.getElementById(id).value.trim(); }

async function setResult(id, field, value) {
  await api('/interview-registry/' + id, { method: 'POST', body: JSON.stringify({ [field]: value }) });
  load();
}

function edit701Time(id) {
  const r = row(id);
  openModal('<h2>① 初试时间 / 地点 · ' + esc(r.name || fmtPhone(r.phone)) + '</h2>'
    + '<label>时间</label><input id="fAt" type="datetime-local" value="' + esc(r.s701_at || '') + '">'
    + '<label>地点</label>' + placePick('fPlace', r.s701_place || '')
    + '<div class="row"><button class="btn" onclick="closeModal()">取消</button>'
    + '<button class="btn primary" onclick="save701Time(' + id + ')">保存</button></div>');
}
async function save701Time(id) {
  const at = fVal('fAt');
  const place = document.getElementById('fPlace').value;
  closeModal();
  await api('/interview-registry/' + id, { method: 'POST', body: JSON.stringify({ s701_at: at, s701_place: place }) });
  load();
}

function arrangeWh(id) {
  const r = row(id);
  openModal('<h2>② 安排仓库复试 · ' + esc(r.name || fmtPhone(r.phone)) + '</h2>'
    + '<label>仓库（按公司分组，显示完整地址）</label>' + whPick('fWh', r.wh_partner_name, r.wh_address)
    + '<label>时间</label><input id="fAt" type="datetime-local" value="' + esc(r.wh_at || '') + '">'
    + '<div class="row"><button class="btn" onclick="closeModal()">取消</button>'
    + '<button class="btn primary" onclick="saveWh(' + id + ')">保存</button></div>');
}
async function saveWh(id) {
  const wh = whParse('fWh');
  closeModal();
  await api('/interview-registry/' + id, { method: 'POST', body: JSON.stringify({
    wh_partner_id: wh.id, wh_partner_name: wh.name,
    wh_address: wh.addr, wh_at: fVal('fAt') }) });
  load();
}

function editNotes(id) {
  const r = row(id);
  openModal('<h2>📝 备注 · ' + esc(r.name || fmtPhone(r.phone)) + '</h2>'
    + '<textarea id="fNotes" rows="4">' + esc(r.notes || '') + '</textarea>'
    + '<div class="row"><button class="btn" onclick="closeModal()">取消</button>'
    + '<button class="btn primary" onclick="saveNotes(' + id + ')">保存</button></div>');
}
async function saveNotes(id) {
  const notes = document.getElementById('fNotes').value.trim(); closeModal();
  await api('/interview-registry/' + id, { method: 'POST', body: JSON.stringify({ notes }) });
  load();
}

function edit701() {
  // 系统里所有公司的地址拉平成一个下拉，点选即填；也可以手动改
  const options = [];
  for (const p of PARTNERS) for (const a of p.addresses) options.push({ label: p.name + ' — ' + a, addr: a });
  openModal('<h2>⚙ 701 初试地址</h2>'
    + '<div class="hint">所有初试都显示这个地址（仅管理员可改）。</div>'
    + '<label>从系统里的公司地址选</label>'
    + '<select id="fAddr701Pick" onchange="if(this.value!==\'\')document.getElementById(\'fAddr701\').value=this.value">'
    + '<option value="">— 选一个地址当默认 —</option>'
    + options.map(o => '<option value="' + esc(o.addr) + '"' + (o.addr === S701 ? ' selected' : '') + '>'
        + esc(o.label) + '</option>').join('')
    + '</select>'
    + '<label>或手动填 / 微调</label>'
    + '<input id="fAddr701" value="' + esc(S701) + '">'
    + '<div class="row"><button class="btn" onclick="closeModal()">取消</button>'
    + '<button class="btn primary" onclick="save701()">保存</button></div>');
}
async function save701() {
  const addr = fVal('fAddr701'); closeModal();
  try { await api('/interview-registry/meta', { method: 'POST', body: JSON.stringify({ s701_address: addr }) }); }
  catch (e) { alert(e.message); }
  load();
}

function delRow(id) {
  const r = row(id);
  openModal('<h2>删除 · ' + esc(r.name || fmtPhone(r.phone)) + '</h2>'
    + '<div class="hint">删了就没了，一般不用删——未通过/没来留着当记录更好。</div>'
    + '<div class="row"><button class="btn" onclick="closeModal()">取消</button>'
    + '<button class="btn bad" onclick="doDel(' + id + ')">删除</button></div>');
}
async function doDel(id) {
  closeModal();
  await api('/interview-registry/' + id, { method: 'DELETE' });
  load();
}

if (TOKEN) {
  fetch('/api/admin/me', { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(r => r.json()).then(r => {
      if (r && r.username) { ROLE = r.role || ''; start(); } else showGate('');
    }).catch(() => showGate(''));
} else {
  showGate('');
}
</script>
