<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电话登记查询 · Prime Anchor Point</title>
<link rel="icon" href="/logo.svg">
<style>
:root{--blue:#1A3F7A;--sky:#29AAE1;--green:#059669;--red:#dc2626;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-800:#1e293b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#eef2f7;color:var(--gray-800);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:1.2rem 1rem 3rem}
.head{display:flex;align-items:center;gap:.8rem;padding:1rem 0 1.2rem}
.head img{height:52px}
.head h1{font-size:1.15rem;color:var(--blue)}
.head p{font-size:.8rem;color:var(--gray-500);margin-top:.15rem}
.card{background:#fff;border-radius:12px;padding:1.1rem 1.2rem;box-shadow:0 2px 10px rgba(15,23,42,.06);margin-bottom:1rem}
.searchrow{display:flex;gap:.6rem}
.searchrow input{flex:1;padding:.7rem .9rem;border:2px solid var(--sky);border-radius:10px;font-size:1.05rem;outline:none;letter-spacing:.05em}
.searchrow input:focus{border-color:var(--blue)}
.searchrow button{padding:.7rem 1.4rem;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;white-space:nowrap}
.searchrow button:disabled{opacity:.5;cursor:default}
.hint{font-size:.76rem;color:var(--gray-400);margin-top:.5rem}
.banner{border-radius:10px;padding:.8rem 1rem;font-weight:700;font-size:.95rem;margin-bottom:1rem;display:none}
.banner.ok{display:block;background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7}
.banner.none{display:block;background:var(--gray-100);color:var(--gray-600);border:1px solid var(--gray-200)}
.banner.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
.sec-title{font-size:.85rem;font-weight:700;color:var(--gray-600);margin:1rem 0 .5rem}
.rec{border:1px solid var(--gray-200);border-left:4px solid var(--sky);border-radius:10px;padding:.7rem .85rem;margin-bottom:.6rem;background:#fff}
.rec.emp{border-left-color:var(--green)}
.rec.fm{border-left-color:#d97706}
.rec .nm{font-weight:700;font-size:1rem;color:var(--blue)}
.rec .meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:.35rem;font-size:.82rem;color:var(--gray-600)}
.rec .meta b{color:var(--gray-800);font-weight:600}
.rec .meta .lbl{color:var(--gray-400)}
.chips{margin-top:.4rem;display:flex;flex-wrap:wrap;gap:.3rem}
.chip{font-size:.7rem;font-weight:600;padding:.12rem .5rem;border-radius:5px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.chip.gray{background:var(--gray-50);color:var(--gray-500);border-color:var(--gray-200)}
.login-tip{display:none;text-align:center;padding:1rem;font-size:.9rem;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;margin-bottom:1rem}
.login-tip a{color:var(--blue);font-weight:700}
/* 证件小窗打开时: 正文靠左收窄, 右边整块让给小窗, 两边真正并排不重叠 */
@media (min-width:1000px){
  body.lb-open .wrap{margin-left:16px;margin-right:0;max-width:min(720px,calc(100vw - 620px));transition:max-width .18s,margin .18s}
}
#lightbox .lbl{margin-left:4px}
#lightbox.compact .lbl{display:none}
#lightbox.compact #lbCropHint{display:none}
.af-l{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--gray-500);font-weight:700}
.af-i{padding:7px 9px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:14px;font-family:inherit;outline:none;color:var(--gray-800);background:#fff;width:100%}
.af-i:focus{border-color:var(--sky)}
@media print{.searchrow button,.hint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="/logo.svg" alt="logo">
    <div>
      <h1>📱 电话登记查询</h1>
      <p>输入电话号码，查这个人是否在系统里登记过 / 提交过招工申请表</p>
    </div>
  </div>

  <div class="card">
    <div class="searchrow">
      <input id="phoneInput" type="tel" placeholder="输入电话号码，如 708-850-2703" autocomplete="off" autofocus>
      <button id="searchBtn" onclick="doSearch()">🔍 查询</button>
    </div>
    <div class="hint">只按数字比对（自动忽略空格、括号、横线和开头的 1）。覆盖：📨 招工申请 · 👷 员工档案 · 🦺 工头。</div>
  </div>

  <div id="loginTip" class="login-tip">⚠️ 需要先登录管理后台才能查询。<a href="/admin.html" target="_blank">去登录</a>，登录后回到本页重试。</div>
  <div id="banner" class="banner"></div>
  <div id="results"></div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const DOC_LABELS={ssn_front:'SSN 正面',ssn_back:'SSN 反面',ead_front:'EAD 正面',ead_back:'EAD 反面'};
document.getElementById('phoneInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

function kv(lbl,val){ return val ? `<span><span class="lbl">${esc(lbl)}</span> <b>${esc(val)}</b></span>` : ''; }
// 证件真伪结论: 缩略图右上角小角标 + 边框颜色
function vBadge(v){
  const m={real:['#059669','真✓'],fake:['#dc2626','假✗'],pending:['#d97706','待定?']}[v||''];
  return m?'<span style="position:absolute;top:2px;right:2px;background:'+m[0]+';color:#fff;font-size:9px;font-weight:700;border-radius:5px;padding:0 5px;line-height:1.5">'+m[1]+'</span>':'';
}
function vBorder(v){ return {real:'#6ee7b7',fake:'#fca5a5',pending:'#fcd34d'}[v||'']||'#dbe3ee'; }

async function doSearch(){
  // 缩略图点开 = 灯箱看原图 (可框选裁剪)。列表缩略图仍显示裁剪版, 原件永不改动。
  window._docSets = window._docSets || {};
  const docThumbs=(subId,docs)=>{
    if(!subId||!Array.isArray(docs)||!docs.length) return '';
    const setId='s'+subId;
    window._docSets[setId]=docs.map(d=>({
      url:'/api/admin/applicant-submissions/'+subId+'/docs/'+d.id+'/download',
      label:DOC_LABELS[d.doc_type]||d.doc_type, sub_id:subId, doc_id:d.id, file_name:d.file_name||'',
      has_cropped: !!d.has_cropped, doc_type:d.doc_type||'',
      verify_status:d.verify_status||'', verify_by:d.verify_by||'', ai_text:d.ai_text||''
    }));
    return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+docs.map((d,i)=>{
      const u='/api/admin/applicant-submissions/'+subId+'/docs/'+d.id+'/download';
      const label=DOC_LABELS[d.doc_type]||d.doc_type;
      if(/\.pdf$/i.test(d.file_name||'')) return '<a href="'+u+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:#eef2ff;color:#3730a3;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none">📄 '+esc(label)+'</a>';
      return '<a href="javascript:void(0)" onclick="lbOpen(window._docSets[\''+setId+'\'],'+i+')" title="'+esc(label)+' (点击审阅: 旋转/裁剪/识别文字/AI 识读/标真假)" style="text-decoration:none"><span style="display:block;position:relative">'
        +'<img src="'+u+'" loading="lazy" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid '+vBorder(d.verify_status)+';background:#000;display:block">'
        +vBadge(d.verify_status)
        +'<span style="position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.62);color:#fff;font-size:10px;font-weight:600;text-align:center;border-radius:0 0 6px 6px;padding:1px 0">'+esc(label)+'</span>'
        +'</span></a>';
    }).join('')+'</div>';
  };
  // 员工的全部证件 (扫码申请 / 档案上传 / SSN 卡 / 工卡)，按来源分组显示
  const allDocThumbs=(docs)=>{
    if(!Array.isArray(docs)||!docs.length) return '<div style="margin-top:8px;font-size:12px;color:#94a3b8">未上传任何证件</div>';
    const bySrc={};
    docs.forEach(d=>{ (bySrc[d.source||'其他']=bySrc[d.source||'其他']||[]).push(d); });
    const setId='e'+(window._docSetSeq=(window._docSetSeq||0)+1);
    window._docSets=window._docSets||{};
    window._docSets[setId]=docs.map(d=>({url:d.url,label:d.label,extra:d.extra||'',file_name:d.file_name||'',
      sub_id:d.sub_id||0, doc_id:d.doc_id||0, doc_type:d.doc_type||'', has_cropped:!!d.has_cropped,
      verify_status:d.verify_status||'', verify_by:d.verify_by||'', ai_text:d.ai_text||''}));
    let flatIdx=-1;
    return '<div style="margin-top:8px">'+Object.keys(bySrc).map(src=>
      '<div style="margin-bottom:6px">'
      +'<div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:3px">'+esc(src)+'（'+bySrc[src].length+'）</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'+bySrc[src].map(d=>{
        const u=d.url;
        const myIdx=window._docSets[setId].findIndex(x=>x.url===d.url);
        const cap=esc(d.label||'')+(d.extra?' · '+esc(d.extra):'');
        if(/\.pdf$/i.test(d.file_name||'')) return '<a href="'+u+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:#eef2ff;color:#3730a3;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none">📄 '+cap+'</a>';
        return '<a href="javascript:void(0)" onclick="lbOpen(window._docSets[\''+setId+'\'],'+myIdx+')" title="'+cap+' (点击看原图)" style="text-decoration:none"><span style="display:block;position:relative">'
          +'<img src="'+u+'" loading="lazy" onerror="this.parentNode.parentNode.parentNode.innerHTML=\'<a href=&quot;'+u+'&quot; target=_blank style=&quot;font-size:12px;color:#3730a3&quot;>📄 '+cap+'</a>\'" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid #dbe3ee;background:#000;display:block">'
          +'<span style="position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.62);color:#fff;font-size:10px;font-weight:600;text-align:center;border-radius:0 0 6px 6px;padding:1px 2px;line-height:1.25">'+esc(d.label||'')+'</span>'
          +vBadge(d.verify_status)
          +'</span></a>'
          +(d.extra?'<div style="font-size:10px;color:#64748b;max-width:84px;line-height:1.2">'+esc(d.extra)+'</div>':'');
      }).join('')+'</div></div>').join('')+'</div>';
  };
  const inp=document.getElementById('phoneInput');
  const btn=document.getElementById('searchBtn');
  const banner=document.getElementById('banner');
  const results=document.getElementById('results');
  const loginTip=document.getElementById('loginTip');
  const phone=(inp.value||'').trim();
  banner.className='banner'; results.innerHTML=''; loginTip.style.display='none';
  window._appById = {};            // 上一次查询的卡片数据作废
  window._docThumbs = docThumbs;   // 卡片重绘时还要用
  if(phone.replace(/\D/g,'').length<7){ banner.className='banner err'; banner.textContent='请输入至少 7 位的电话号码'; return; }
  btn.disabled=true; btn.textContent='查询中…';
  try{
    const res=await fetch('/api/admin/phone-check?phone='+encodeURIComponent(phone),{credentials:'same-origin'});
    if(res.status===401){ loginTip.style.display='block'; return; }
    const data=await res.json().catch(()=>null);
    if(!res.ok||!data||!data.ok) throw new Error((data&&data.error)||('HTTP '+res.status));
    const total=(data.applications||[]).length+(data.employees||[]).length+(data.foremen||[]).length;
    if(!data.found){
      banner.className='banner none';
      banner.textContent='⚪ 未找到：'+data.phone+' 没有在系统里登记过，也没有提交过申请表。';
      return;
    }
    banner.className='banner ok';
    banner.textContent='✅ 已登记：'+data.phone+' 在系统里共找到 '+total+' 条记录。';
    let html='';
    if((data.applications||[]).length){
      html+='<div class="sec-title">📨 招工申请（'+data.applications.length+'）</div>';
      html+=data.applications.map(a=>appCardHtml(a)).join('');
    }
    if((data.employees||[]).length){
      html+='<div class="sec-title">👷 员工档案（'+data.employees.length+'）</div>';
      html+=data.employees.map(e=>`<div class="rec emp">
        <div class="nm">${esc([e.first_name,e.last_name].filter(Boolean).join(' ')||'—')}</div>
        <div class="meta">
          ${kv('员工编号',e.employee_id)} ${kv('电话',e.phone)} ${kv('邮箱',e.email)}
          ${kv('职位',e.position)} ${kv('部门',e.department)} ${kv('状态',e.status)} ${kv('入职日期',e.hire_date)}
        </div>
        ${allDocThumbs(e.all_docs)}
      </div>`).join('');
    }
    if((data.foremen||[]).length){
      html+='<div class="sec-title">🦺 工头（'+data.foremen.length+'）</div>';
      html+=data.foremen.map(f=>`<div class="rec fm">
        <div class="nm">${esc(f.name||'—')}</div>
        <div class="meta">
          ${kv('电话',f.phone)} ${kv('邮箱',f.email)} ${kv('仓库',f.warehouse)}
          <span><span class="lbl">状态</span> <b>${f.active?'启用':'停用'}</b></span>
          ${kv('创建时间',String(f.created_at||'').slice(0,16))}
        </div>
      </div>`).join('');
    }
    results.innerHTML=html;
  }catch(e){
    banner.className='banner err';
    banner.textContent='查询失败：'+(e.message||e);
  }finally{
    btn.disabled=false; btn.textContent='🔍 查询';
  }
}

// ══════ 招工申请卡片: 只读视图 ⇄ 资料编辑表单（可原地重绘, 不整页刷新）══════
const US_STATES = ['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','PR','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
const APP_FIELDS = [
  ['name','姓名 *','工人法定全名'], ['phone','电话 *','(555) 000-0000'], ['email','邮箱','name@example.com'],
  ['position','职位','Picking / Packing …'], ['address1','街道地址','123 Main St'], ['address2','单元 / 楼层','Apt 2B（可空）'],
  ['city','城市','Chicago'], ['state','州',''], ['zip','邮编','60601']
];
const APP_FIELD_CN = APP_FIELDS.reduce((m, f) => (m[f[0]] = f[1].replace(' *',''), m), {});
window._appById = window._appById || {};

function appCardHtml(a) {
  window._appById[a.id] = a;
  return '<div class="rec" id="appCard' + a.id + '">' + appCardInner(a) + '</div>';
}
function appNameMismatch(a) {
  const le = a.linked_employee;
  return !!(le && le.name && String(a.name || '').trim().toLowerCase() !== String(le.name).trim().toLowerCase());
}
function appCardInner(a) {
  const addr = [a.address1, a.address2, [a.city, a.state, a.zip].filter(Boolean).join(', ')].filter(Boolean).join(', ');
  const le = a.linked_employee;
  const editBtn = `<button onclick="editApplicantInfo(${a.id})" title="核对证件后直接更正这个人的资料（姓名 / 电话 / 邮箱 / 职位 / 地址）" style="margin-left:6px;padding:2px 8px;font-size:11px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer;vertical-align:middle">✎ 改资料</button>`;
  // 申请里的名字是工人自己填的, 可能拼错; 档案里改过名不会回写历史记录 → 这里标注清楚
  const nameLine = (le && appNameMismatch(a))
    ? `<div class="nm">${esc(le.name)} <span style="font-size:12px;font-weight:600;color:#b45309">（档案正式姓名）</span></div>
       <div style="font-size:12px;color:#64748b;margin-top:2px">工人提交时填的是：<b>${esc(a.name || '—')}</b>
         <button onclick="syncApplicantName(${a.id}, ${le.id}, this)" style="margin-left:6px;padding:2px 8px;font-size:11px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer">用档案名更正</button>${editBtn}</div>`
    : `<div class="nm">${esc(a.name || '—')}${editBtn}</div>`;
  return `${nameLine}
    <div class="meta">
      ${kv('电话', a.phone)} ${kv('邮箱', a.email)} ${kv('职位', a.position)}
      ${kv('申请公司', a.partner_name)} ${kv('申请地点', a.apply_state)}
      ${kv('状态', a.status)} ${kv('提交时间', String(a.created_at || '').slice(0, 16))}
    </div>
    ${addr ? `<div class="meta">${kv('地址', addr)}</div>` : ''}
    ${window._docThumbs ? window._docThumbs(a.id, a.docs) : ''}`;
}
function reRenderApp(id) {
  const el = document.getElementById('appCard' + id);
  if (el && window._appById[id]) el.innerHTML = appCardInner(window._appById[id]);
}
// 对着证件小窗改资料: 表单就在卡片上, 证件窗口是浮动的, 两边可以同时看
function editApplicantInfo(id) {
  const a = window._appById[id];
  const el = document.getElementById('appCard' + id);
  if (!a || !el) return;
  const inp = (k, label, ph) => k === 'state'
    ? `<label class="af-l">${esc(label)}<select id="af_${id}_${k}" class="af-i">
        <option value="">-- 州 --</option>
        ${US_STATES.map(x => `<option value="${x}"${String(a.state || '').toUpperCase() === x ? ' selected' : ''}>${x}</option>`).join('')}
       </select></label>`
    : `<label class="af-l">${esc(label)}<input id="af_${id}_${k}" class="af-i" value="${esc(a[k] || '')}" placeholder="${esc(ph || '')}" autocomplete="off"></label>`;
  el.innerHTML = `
    <div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:8px">✎ 更正申请人资料
      <span style="font-weight:400;color:var(--gray-400)">— 对着证件改；每一处改动都会记入审计日志</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px">
      ${APP_FIELDS.map(f => inp(f[0], f[1], f[2])).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap">
      <button id="afSave${id}" onclick="saveApplicantInfo(${id})" style="padding:7px 16px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">保存</button>
      <button onclick="reRenderApp(${id})" style="padding:7px 16px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:var(--gray-600);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">取消</button>
      <span style="font-size:11px;color:var(--gray-400)">👇 点证件缩略图会弹出小窗，可以拖到旁边一边看一边改</span>
    </div>
    ${window._docThumbs ? window._docThumbs(a.id, a.docs) : ''}`;
  const first = document.getElementById('af_' + id + '_name');
  if (first) { first.focus(); first.select(); }
}
async function saveApplicantInfo(id) {
  const a = window._appById[id];
  if (!a) return;
  const body = {};
  APP_FIELDS.forEach(f => {
    const el = document.getElementById('af_' + id + '_' + f[0]);
    if (el) body[f[0]] = el.value;
  });
  if (!String(body.name || '').trim()) { pcToast('姓名不能为空', 'err'); return; }
  const btn = document.getElementById('afSave' + id);
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  try {
    const r = await fetch('/api/admin/applicant-submissions/' + id, {
      method: 'PATCH', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.error || '保存失败');
    const oldPhone = a.phone || '';
    if (j.record) APP_FIELDS.forEach(f => { if (j.record[f[0]] !== undefined) a[f[0]] = j.record[f[0]]; });
    reRenderApp(id);
    const ch = (j.changed || []).map(k => APP_FIELD_CN[k] || k);
    pcToast(ch.length ? ('已保存：' + ch.join('、')) : '没有改动', 'ok');
    // 改了电话就跟着换搜索框里的号码 —— 否则再查一次这个人就查不出来了
    if ((j.changed || []).includes('phone')) {
      const el = document.getElementById('phoneInput');

// 选框先归一化成比例, 再投影到画布像素 —— 窗口改大小 / 缩放 / 换设备都不会算错
function lbSelNorm() {

  const nx = Math.max(0, Math.min(1, sel.left / cv.clientWidth));
  const ny = Math.max(0, Math.min(1, sel.top / cv.clientHeight));

async function lbOcr(whole) {

// 自动色阶(去灰/校色) + 轻锐化
function _lbAfx(cv) {
  const w = cv.width, h = cv.height, ctx = cv.getContext('2d');
  const blur = lbBlurTo(document.createElement('canvas'), cv, Math.max(1, Math.round(w / 700)));
  const idO = ctx.getImageData(0, 0, w, h), idB = blur.getContext('2d').getImageData(0, 0, w, h);
  const o = idO.data, b = idB.data;
  const hist = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
  for (let i = 0; i < w * h; i++) { hist[0][o[i * 4]]++; hist[1][o[i * 4 + 1]]++; hist[2][o[i * 4 + 2]]++; }
  const lut = [];
  for (let c = 0; c < 3; c++) {
    const clip = w * h * 0.005;
    let lo = 0, acc = 0;
    while (lo < 255 && acc + hist[c][lo] < clip) { acc += hist[c][lo]; lo++; }
    let hi = 255; acc = 0;
    while (hi > 0 && acc + hist[c][hi] < clip) { acc += hist[c][hi]; hi--; }
    if (hi - lo < 30) { lo = 0; hi = 255; }
    const L = new Uint8ClampedArray(256);
    for (let v = 0; v < 256; v++) L[v] = (v - lo) * 255 / (hi - lo);
    lut.push(L);
  }
  for (let i = 0; i < w * h; i++) for (let c = 0; c < 3; c++) {
    const v = lut[c][o[i * 4 + c]], bv = lut[c][b[i * 4 + c]];
    o[i * 4 + c] = Math.max(0, Math.min(255, v * 1.35 - bv * 0.35));
  }
  ctx.putImageData(idO, 0, 0);
}
function lbAutoFix() {
  const cv = $lb('lbCanvas'); if (!cv.width) return;
  pcToast('🪄 处理中…');
  try {
    const s = Math.min(1, 1800 / cv.width);
    const w = Math.max(1, Math.round(cv.width * s)), h = Math.max(1, Math.round(cv.height * s));
    const work = document.createElement('canvas'); work.width = w; work.height = h;
    const cx = work.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(cv, 0, 0, w, h);

    if (lbLooksBlank(work)) { pcToast('这台设备的浏览器算不了自动修复（结果是空白图），已取消', 'err'); return; }
    lbBake(work.toDataURL('image/jpeg', 0.92), '🪄 已增强颜色 / 对比 — 不满意点【↩ 还原】, 满意点【💾 保存】');
  } catch (e) { pcToast('自动修复失败: ' + (e.message || e), 'err'); }
}
// 灰度 → 大半径背景估计(除光照不均) → 笔画增益 → 轻锐化
function lbDocEnhance() {
  const cv = $lb('lbCanvas'); if (!cv.width) return;
  pcToast('📄 文档增强中…');
  try {
    const s = Math.min(1, 2000 / Math.max(cv.width, cv.height));
    const w = Math.max(1, Math.round(cv.width * s)), h = Math.max(1, Math.round(cv.height * s));
    const work = document.createElement('canvas'); work.width = w; work.height = h;
    const cx = work.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(cv, 0, 0, w, h);
    const id = cx.getImageData(0, 0, w, h), d = id.data;
    for (let i = 0; i < w * h; i++) {
      const g = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
      d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = g;
    }
    cx.putImageData(id, 0, 0);
    const bgc = lbBlurTo(document.createElement('canvas'), work, Math.max(6, Math.round(w / 60)));
    const bd = bgc.getContext('2d').getImageData(0, 0, w, h).data;
    for (let i = 0; i < w * h; i++) {
      const v = Math.max(0, Math.min(255, 255 + (d[i * 4] - bd[i * 4]) * 2.4 - 12));
      d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
    }
    cx.putImageData(id, 0, 0);
    const blc = lbBlurTo(document.createElement('canvas'), work, 1);
    const sd = blc.getContext('2d').getImageData(0, 0, w, h).data;
    const id2 = cx.getImageData(0, 0, w, h), d2 = id2.data;
    for (let i = 0; i < w * h * 4; i += 4) {
      const v = Math.max(0, Math.min(255, d2[i] * 1.5 - sd[i] * 0.5));
      d2[i] = d2[i + 1] = d2[i + 2] = v;
    }
    cx.putImageData(id2, 0, 0);
    if (lbLooksBlank(work)) { pcToast('这台设备的浏览器算不了文档增强（结果是空白图），已取消', 'err'); return; }
    lbBake(work.toDataURL('image/jpeg', 0.92), '📄 已增强（黑白文档模式）— 不满意点【↩ 还原】；糊得太狠的建议让对方重拍');
  } catch (e) { pcToast('增强失败: ' + (e.message || e), 'err'); }
}

// ── 💾 保存: 存成"显示用裁剪版", 原件永不改动 ──
async function lbSaveCrop() {

    let out = src;

    if (sp) {
      out = document.createElement('canvas');
      out.width = sp.w; out.height = sp.h;
      out.getContext('2d').drawImage(src, sp.x, sp.y, sp.w, sp.h, 0, 0, sp.w, sp.h);
    }
    // 大图按原尺寸会超上传上限 → 限制长边并用 JPEG

    if (k < 1) {
      const sm = document.createElement('canvas');
      sm.width = Math.max(1, Math.round(out.width * k)); sm.height = Math.max(1, Math.round(out.height * k));
      const c2 = sm.getContext('2d'); c2.imageSmoothingQuality = 'high';
      c2.drawImage(out, 0, 0, sm.width, sm.height);
      out = sm;
    }
    data = out.toDataURL('image/jpeg', 0.92);
    const r = await fetch('/api/admin/applicant-submissions/' + d.sub_id + '/docs/' + d.doc_id + '/cropped', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.error || '保存失败');

  } catch (e) { pcToast(e.message || '保存失败', 'err'); }

  if (!ok) {
    if (_lb.batch) pcToast('这张没保存成功 — 请重试（不会跳过）', 'err');
    return;
  }
  d.has_cropped = true;
  pcSyncDocState(d.sub_id, x => x.has_cropped = 1, [String(d.doc_id)]);
  _lb.showCropped = true;          // 此刻画面上就是刚存的裁剪版

    else {

    }
  }
}

    const r = await fetch('/api/admin/applicant-submissions/' + d.sub_id + '/docs/' + d.doc_id + '/cropped', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: '' })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.error || '清除失败');
    d.has_cropped = false; _lb.showCropped = false;
    pcSyncDocState(d.sub_id, x => x.has_cropped = 0, [String(d.doc_id)]);
    lbBustThumbs(d);
    lbRender();
    pcToast('已恢复原件', 'ok');
  } catch (e) { pcToast(e.message || '清除失败', 'err'); }
}
// 把结论 / 裁剪状态同步回卡片自己的数据 (window._appById[..].docs),
// 否则改完资料卡片一重绘, 刚标的真假角标就没了 —— 看着像没保存成功。
function pcSyncDocState(subId, apply, onlyDocIds) {
  Object.values(window._appById || {}).forEach(a => {
    if (String(a.id) !== String(subId) || !Array.isArray(a.docs)) return;
    a.docs.forEach(doc => {
      if (onlyDocIds && !onlyDocIds.includes(String(doc.id))) return;
      apply(doc);
    });
  });
}
// 保存后刷新页面上该文件的缩略图 (加时间戳绕过缓存)
function lbBustThumbs(d) {
  if (!d || !d.url) return;
  const frag = d.url.split('?')[0];
  document.querySelectorAll('#results img').forEach(im => {
    const s = im.getAttribute('src') || '';
    if (s.split('?')[0] === frag) im.src = frag + '?t=' + Date.now();
  });
}
// 标结论后刷新缩略图角标 (不重新查询, 免得丢失当前审阅进度)
function lbRefreshThumbBadges() {
  _lb.list.forEach(d => {
    if (!d.url) return;
    const frag = d.url.split('?')[0];
    document.querySelectorAll('#results img').forEach(im => {
      if ((im.getAttribute('src') || '').split('?')[0] !== frag) return;
      im.style.borderColor = vBorder(d.verify_status);
      const holder = im.parentNode;
      if (!holder) return;
      const old = holder.querySelector('[data-vbadge]');
      if (old) old.remove();
      const html = vBadge(d.verify_status);
      if (html) {
        const t = document.createElement('div');
        t.innerHTML = html;
        const el = t.firstChild;
        el.setAttribute('data-vbadge', '1');
        holder.appendChild(el);
      }
    });
  });
}

// ── ✂️ 连续处理: 逐张 转正→框选→保存→标结论→下一张 ──
function lbBatchStart() {
  const idxs = _lb.list.map((d, i) => lbEditable(d) ? i : -1).filter(i => i >= 0);
  if (!idxs.length) { pcToast('这批证件不支持保存修改', 'err'); return; }
  _lb.batch = { idxs, at: 0, awaitVerdict: false };
  _lb.idx = idxs[0];
  lbRender(); lbBatchBar();
}
function lbBatchBar() {
  const b = $lb('lbBatchBar');
  if (!_lb.batch) { b.style.display = 'none'; return; }
  b.style.display = 'flex';
  const lk = 'cursor:pointer;text-decoration:underline;white-space:nowrap;color:#fbbf24';
  b.innerHTML = '<b>✂️ 连续处理 ' + (_lb.batch.at + 1) + '/' + _lb.batch.idxs.length + ' · ' + esc(lbCur().label || '') + '</b>'
    + (_lb.batch.awaitVerdict
        ? '<span style="color:#fcd34d;font-weight:700">⬆ 在上面给这组一个结论 → 自动跳下一张</span>'
        : '<span style="color:#cbd5e1">歪的先 ↺ ↻ 转正 → 拖框圈出证件（不拖框＝整张）→ 点【保存】→ 标结论 → 下一张</span>')
    + '<a style="margin-left:auto;' + lk + '" onclick="lbBatchAdvance()">跳过这张</a>'
    + '<a style="' + lk + '" onclick="lbBatchEnd()">结束</a>';
}
function lbBatchAdvance() {
  if (!_lb.batch) return;
  _lb.batch.awaitVerdict = false;
  _lb.batch.at++;
  if (_lb.batch.at >= _lb.batch.idxs.length) {
    lbBatchEnd(true);
    pcToast('这批证件全部处理完成', 'ok');
    return;
  }
  _lb.idx = _lb.batch.idxs[_lb.batch.at];
  lbRender(); lbBatchBar();
}
function lbBatchEnd(silent) {
  _lb.batch = null;
  $lb('lbBatchBar').style.display = 'none';
  if (!silent) pcToast('连续处理已结束');
}

document.addEventListener('keydown', e => {
  const win = $lb('lightbox');
  if (!win || win.style.display !== 'flex') return;
  const t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if (t && t.isContentEditable) return;
  // 证件窗口不是模态的 —— 用户可能正在旁边的表单里操作, 那时按 r 绝不能转图
  if (t && t !== document.body && !win.contains(t)) return;
  if (e.key === 'Escape') lbClose();
  else if (e.key === 'ArrowLeft') lbNav(-1);
  else if (e.key === 'ArrowRight') lbNav(1);
  else if (e.key === 'r' || e.key === 'R') lbRotate(e.shiftKey ? -90 : 90);
  else if (e.key === '+' || e.key === '=') lbZoom(1);
  else if (e.key === '-' || e.key === '_') lbZoom(-1);
});

// ══════ 页面自有风格的提示 / 确认 / 输入（替代浏览器原生 alert / confirm / prompt）══════
function pcToast(msg, type) {
  const wrap = document.getElementById('pcToastWrap');
  // 审阅器是全屏的 → 提示挪到左下角, 免得盖住顶部工具条
  const lbOn = (document.getElementById('lightbox') || {}).style && document.getElementById('lightbox').style.display === 'flex';
  wrap.style.cssText = 'position:fixed;z-index:15000;display:flex;flex-direction:column;gap:8px;pointer-events:none;'
    + (lbOn ? 'left:16px;bottom:16px;top:auto;transform:none;align-items:flex-start'
            : 'top:16px;left:50%;transform:translateX(-50%);bottom:auto;align-items:center');
  const t = document.createElement('div');
  const c = type === 'err' ? { bg: '#fef2f2', bd: '#fecaca', fg: '#b91c1c', ico: '⚠️' }
          : type === 'ok' ? { bg: '#ecfdf5', bd: '#a7f3d0', fg: '#047857', ico: '✅' }
          : { bg: '#eff6ff', bd: '#bfdbfe', fg: '#1d4ed8', ico: 'ℹ️' };
  t.style.cssText = 'display:flex;align-items:flex-start;gap:8px;background:' + c.bg + ';border:1px solid ' + c.bd + ';color:' + c.fg
    + ';border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(15,23,42,.12);max-width:360px;'
    + 'opacity:0;transform:translateY(-8px);transition:opacity .18s,transform .18s';
  const hasIcon = /^[\u2190-\u2BFF\u{1F000}-\u{1FAFF}]/u.test(String(msg));
  t.innerHTML = (hasIcon ? '' : '<span>' + c.ico + '</span>') + '<span style="flex:1;line-height:1.45">' + esc(msg) + '</span>';
  wrap.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; });
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(-8px)'; setTimeout(() => t.remove(), 200); }, 3200);
}
function _pcModal(inner) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:14000;display:flex;align-items:center;justify-content:center;padding:16px';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(15,23,42,.28);width:100%;max-width:420px;overflow:hidden';
    box.innerHTML = inner;
    ov.appendChild(box);
    document.body.appendChild(ov);
    const done = v => { ov.remove(); document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } };
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('click', e => { if (e.target === ov) done(null); });
    const inp = box.querySelector('input');
    setTimeout(() => { if (inp) { inp.focus(); inp.select(); } }, 30);
    box.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
      done(b.dataset.act === 'ok' ? (inp ? inp.value : true) : null);
    }));
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(inp.value); });
  });
}
const _pcBtnStyle = 'padding:8px 16px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit';
function pcConfirm(msg, okLabel) {
  return _pcModal(
    '<div style="padding:20px 22px 6px;font-size:14px;color:#0f172a;line-height:1.6;white-space:pre-line">' + esc(msg) + '</div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 18px">'
    + '<button data-act="cancel" style="' + _pcBtnStyle + ';background:#fff;color:#475569;border:1px solid #cbd5e1">取消</button>'
    + '<button data-act="ok" style="' + _pcBtnStyle + ';background:#0F2B5B;color:#fff;border:none">' + esc(okLabel || '确定') + '</button>'
    + '</div>').then(v => v !== null);
}
function pcPrompt(label, value) {
  return _pcModal(
    '<div style="padding:20px 22px 4px;font-size:13px;font-weight:700;color:#334155">' + esc(label) + '</div>'
    + '<div style="padding:0 22px"><input type="text" value="' + esc(value || '') + '" style="width:100%;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:9px;font-size:15px;outline:none;font-family:inherit"></div>'
    + '<div style="display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 18px">'
    + '<button data-act="cancel" style="' + _pcBtnStyle + ';background:#fff;color:#475569;border:1px solid #cbd5e1">取消</button>'
    + '<button data-act="ok" style="' + _pcBtnStyle + ';background:#0F2B5B;color:#fff;border:none">保存</button>'
    + '</div>');
}

        <button id="lbSaveBtn" onclick="lbSaveCrop()" disabled style="padding:5px 11px;border-radius:6px;border:none;background:#0ea5e9;color:#fff;cursor:pointer;font-family:inherit;font-size:12px">💾 保存</button>
        <button onclick="lbBatchStart()" title="逐张：转正 → 框选 → 保存 → 标真假 → 自动下一张" style="padding:5px 11px;border-radius:6px;border:none;background:#7c3aed;color:#fff;cursor:pointer;font-family:inherit;font-size:12px">✂️ 连续处理</button>
        <button id="lbClearCropBtn" onclick="lbClearCrop()" title="删除服务器上保存的裁剪版，缩略图恢复显示原件" style="display:none;padding:3px 9px;border-radius:6px;border:1px solid #64748b;background:transparent;color:#e2e8f0;cursor:pointer;font-family:inherit;font-size:12px;white-space:nowrap;border-color:#b91c1c;color:#fca5a5">🗑 删除裁剪版</button>
      </span>
      <button id="lbVerBtn" onclick="lbToggleVersion()" style="display:none;padding:3px 9px;border-radius:6px;border:1px solid #64748b;background:transparent;color:#e2e8f0;cursor:pointer;font-family:inherit;font-size:12px;white-space:nowrap">看裁剪版</button>
    </div>
    <div id="lbCropHint" style="color:#94a3b8;font-size:11px;margin-top:5px;text-align:center;flex:0 0 auto;line-height:1.4"></div>
  </div>

  <div id="lbGrip" title="拖动这里调整窗口大小" style="position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;
       background:linear-gradient(135deg,transparent 0 46%,#64748b 46% 54%,transparent 54% 62%,#64748b 62% 70%,transparent 70%)"></div>
</div>
</body>
</html>
