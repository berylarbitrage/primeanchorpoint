<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电话登记查询 · Prime Anchor Point</title>
<link rel="icon" href="/logo.svg">
<style>
:root{--blue:#1A3F7A;--sky:#29AAE1;--green:#059669;--red:#dc2626;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-800:#1e293b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;background:#eef2f7;color:var(--gray-800);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:1.2rem 1rem 3rem}
.head{display:flex;align-items:center;gap:.8rem;padding:1rem 0 1.2rem}
.head img{height:52px}
.head h1{font-size:1.15rem;color:var(--blue)}
.head p{font-size:.8rem;color:var(--gray-500);margin-top:.15rem}
.card{background:#fff;border-radius:12px;padding:1.1rem 1.2rem;box-shadow:0 2px 10px rgba(15,23,42,.06);margin-bottom:1rem}
.searchrow{display:flex;gap:.6rem}
.searchrow input{flex:1;padding:.7rem .9rem;border:2px solid var(--sky);border-radius:10px;font-size:1.05rem;outline:none;letter-spacing:.05em}
.searchrow input:focus{border-color:var(--blue)}
.searchrow button{padding:.7rem 1.4rem;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;white-space:nowrap}
.searchrow button:disabled{opacity:.5;cursor:default}
.hint{font-size:.76rem;color:var(--gray-400);margin-top:.5rem}
.banner{border-radius:10px;padding:.8rem 1rem;font-weight:700;font-size:.95rem;margin-bottom:1rem;display:none}
.banner.ok{display:block;background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7}
.banner.none{display:block;background:var(--gray-100);color:var(--gray-600);border:1px solid var(--gray-200)}
.banner.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
.sec-title{font-size:.85rem;font-weight:700;color:var(--gray-600);margin:1rem 0 .5rem}
.rec{border:1px solid var(--gray-200);border-left:4px solid var(--sky);border-radius:10px;padding:.7rem .85rem;margin-bottom:.6rem;background:#fff}
.rec.emp{border-left-color:var(--green)}
.rec.fm{border-left-color:#d97706}
.rec .nm{font-weight:700;font-size:1rem;color:var(--blue)}
.rec .meta{display:flex;flex-wrap:wrap;gap:.3rem .9rem;margin-top:.35rem;font-size:.82rem;color:var(--gray-600)}
.rec .meta b{color:var(--gray-800);font-weight:600}
.rec .meta .lbl{color:var(--gray-400)}
.chips{margin-top:.4rem;display:flex;flex-wrap:wrap;gap:.3rem}
.chip{font-size:.7rem;font-weight:600;padding:.12rem .5rem;border-radius:5px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.chip.gray{background:var(--gray-50);color:var(--gray-500);border-color:var(--gray-200)}
.login-tip{display:none;text-align:center;padding:1rem;font-size:.9rem;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;margin-bottom:1rem}
.login-tip a{color:var(--blue);font-weight:700}
@media print{.searchrow button,.hint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="/logo.svg" alt="logo">
    <div>
      <h1>📱 电话登记查询</h1>
      <p>输入电话号码，查这个人是否在系统里登记过 / 提交过招工申请表</p>
    </div>
  </div>

  <div class="card">
    <div class="searchrow">
      <input id="phoneInput" type="tel" placeholder="输入电话号码，如 708-850-2703" autocomplete="off" autofocus>
      <button id="searchBtn" onclick="doSearch()">🔍 查询</button>
    </div>
    <div class="hint">只按数字比对（自动忽略空格、括号、横线和开头的 1）。覆盖：📨 招工申请 · 👷 员工档案 · 🦺 工头。</div>
  </div>

  <div id="loginTip" class="login-tip">⚠️ 需要先登录管理后台才能查询。<a href="/admin.html" target="_blank">去登录</a>，登录后回到本页重试。</div>
  <div id="banner" class="banner"></div>
  <div id="results"></div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const DOC_LABELS={ssn_front:'SSN 正面',ssn_back:'SSN 反面',ead_front:'EAD 正面',ead_back:'EAD 反面'};
document.getElementById('phoneInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

function kv(lbl,val){ return val ? `<span><span class="lbl">${esc(lbl)}</span> <b>${esc(val)}</b></span>` : ''; }

async function doSearch(){
  // 缩略图点开 = 灯箱看原图 (可框选裁剪)。列表缩略图仍显示裁剪版, 原件永不改动。
  window._docSets = window._docSets || {};
  const docThumbs=(subId,docs)=>{
    if(!subId||!Array.isArray(docs)||!docs.length) return '';
    const setId='s'+subId;
    window._docSets[setId]=docs.map(d=>({
      url:'/api/admin/applicant-submissions/'+subId+'/docs/'+d.id+'/download',
      label:DOC_LABELS[d.doc_type]||d.doc_type, sub_id:subId, doc_id:d.id, file_name:d.file_name||''
    }));
    return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+docs.map((d,i)=>{
      const u='/api/admin/applicant-submissions/'+subId+'/docs/'+d.id+'/download';
      const label=DOC_LABELS[d.doc_type]||d.doc_type;
      if(/\.pdf$/i.test(d.file_name||'')) return '<a href="'+u+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:#eef2ff;color:#3730a3;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none">📄 '+esc(label)+'</a>';
      return '<a href="javascript:void(0)" onclick="lbOpen(window._docSets[\''+setId+'\'],'+i+')" title="'+esc(label)+' (点击看原图 / 裁剪)" style="text-decoration:none"><span style="display:block;position:relative">'
        +'<img src="'+u+'" loading="lazy" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid #dbe3ee;background:#000;display:block">'
        +'<span style="position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.62);color:#fff;font-size:10px;font-weight:600;text-align:center;border-radius:0 0 6px 6px;padding:1px 0">'+esc(label)+'</span>'
        +'</span></a>';
    }).join('')+'</div>';
  };
  // 员工的全部证件 (扫码申请 / 档案上传 / SSN 卡 / 工卡)，按来源分组显示
  const allDocThumbs=(docs)=>{
    if(!Array.isArray(docs)||!docs.length) return '<div style="margin-top:8px;font-size:12px;color:#94a3b8">未上传任何证件</div>';
    const bySrc={};
    docs.forEach(d=>{ (bySrc[d.source||'其他']=bySrc[d.source||'其他']||[]).push(d); });
    const setId='e'+(window._docSetSeq=(window._docSetSeq||0)+1);
    window._docSets=window._docSets||{};
    window._docSets[setId]=docs.map(d=>({url:d.url,label:d.label,extra:d.extra||'',file_name:d.file_name||''}));
    let flatIdx=-1;
    return '<div style="margin-top:8px">'+Object.keys(bySrc).map(src=>
      '<div style="margin-bottom:6px">'
      +'<div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:3px">'+esc(src)+'（'+bySrc[src].length+'）</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'+bySrc[src].map(d=>{
        const u=d.url;
        const myIdx=window._docSets[setId].findIndex(x=>x.url===d.url);
        const cap=esc(d.label||'')+(d.extra?' · '+esc(d.extra):'');
        if(/\.pdf$/i.test(d.file_name||'')) return '<a href="'+u+'" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:#eef2ff;color:#3730a3;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none">📄 '+cap+'</a>';
        return '<a href="javascript:void(0)" onclick="lbOpen(window._docSets[\''+setId+'\'],'+myIdx+')" title="'+cap+' (点击看原图)" style="text-decoration:none"><span style="display:block;position:relative">'
          +'<img src="'+u+'" loading="lazy" onerror="this.parentNode.parentNode.parentNode.innerHTML=\'<a href=&quot;'+u+'&quot; target=_blank style=&quot;font-size:12px;color:#3730a3&quot;>📄 '+cap+'</a>\'" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid #dbe3ee;background:#000;display:block">'
          +'<span style="position:absolute;left:0;right:0;bottom:0;background:rgba(15,23,42,.62);color:#fff;font-size:10px;font-weight:600;text-align:center;border-radius:0 0 6px 6px;padding:1px 2px;line-height:1.25">'+esc(d.label||'')+'</span>'
          +'</span></a>'
          +(d.extra?'<div style="font-size:10px;color:#64748b;max-width:84px;line-height:1.2">'+esc(d.extra)+'</div>':'');
      }).join('')+'</div></div>').join('')+'</div>';
  };
  const inp=document.getElementById('phoneInput');
  const btn=document.getElementById('searchBtn');
  const banner=document.getElementById('banner');
  const results=document.getElementById('results');
  const loginTip=document.getElementById('loginTip');
  const phone=(inp.value||'').trim();
  banner.className='banner'; results.innerHTML=''; loginTip.style.display='none';
  if(phone.replace(/\D/g,'').length<7){ banner.className='banner err'; banner.textContent='请输入至少 7 位的电话号码'; return; }
  btn.disabled=true; btn.textContent='查询中…';
  try{
    const res=await fetch('/api/admin/phone-check?phone='+encodeURIComponent(phone),{credentials:'same-origin'});
    if(res.status===401){ loginTip.style.display='block'; return; }
    const data=await res.json().catch(()=>null);
    if(!res.ok||!data||!data.ok) throw new Error((data&&data.error)||('HTTP '+res.status));
    const total=(data.applications||[]).length+(data.employees||[]).length+(data.foremen||[]).length;
    if(!data.found){
      banner.className='banner none';
      banner.textContent='⚪ 未找到：'+data.phone+' 没有在系统里登记过，也没有提交过申请表。';
      return;
    }
    banner.className='banner ok';
    banner.textContent='✅ 已登记：'+data.phone+' 在系统里共找到 '+total+' 条记录。';
    let html='';
    if((data.applications||[]).length){
      html+='<div class="sec-title">📨 招工申请（'+data.applications.length+'）</div>';
      html+=data.applications.map(a=>{
        const addr=[a.address1,a.address2,[a.city,a.state,a.zip].filter(Boolean).join(', ')].filter(Boolean).join(', ');
        const docs=String(a.doc_types||'').split(',').filter(Boolean);
        const le=a.linked_employee;
        // 申请里的名字是工人自己填的, 可能拼错; 档案里改过名不会回写历史记录 → 这里标注清楚
        const editBtn = `<button onclick="editApplicantName(${a.id}, ${JSON.stringify(a.name||'')}, this)" title="修改这条申请里的姓名" style="margin-left:6px;padding:2px 8px;font-size:11px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer;vertical-align:middle">✎ 改名</button>`;
        const nameLine = (le && a.name_mismatch)
          ? `<div class="nm">${esc(le.name)} <span style="font-size:12px;font-weight:600;color:#b45309">（档案正式姓名）</span></div>
             <div style="font-size:12px;color:#64748b;margin-top:2px">工人提交时填的是：<b>${esc(a.name||'—')}</b>
               <button onclick="syncApplicantName(${a.id}, ${le.id}, this)" style="margin-left:6px;padding:2px 8px;font-size:11px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;cursor:pointer">用档案名更正</button>${editBtn}</div>`
          : `<div class="nm">${esc(a.name||'—')}${editBtn}</div>`;
        return `<div class="rec">
          ${nameLine}
          <div class="meta">
            ${kv('电话',a.phone)} ${kv('邮箱',a.email)} ${kv('职位',a.position)}
            ${kv('申请公司',a.partner_name)} ${kv('申请地点',a.apply_state)}
            ${kv('状态',a.status)} ${kv('提交时间',String(a.created_at||'').slice(0,16))}
          </div>
          ${addr?`<div class="meta">${kv('地址',addr)}</div>`:''}
          ${docThumbs(a.id, a.docs)}
        </div>`;
      }).join('');
    }
    if((data.employees||[]).length){
      html+='<div class="sec-title">👷 员工档案（'+data.employees.length+'）</div>';
      html+=data.employees.map(e=>`<div class="rec emp">
        <div class="nm">${esc([e.first_name,e.last_name].filter(Boolean).join(' ')||'—')}</div>
        <div class="meta">
          ${kv('员工编号',e.employee_id)} ${kv('电话',e.phone)} ${kv('邮箱',e.email)}
          ${kv('职位',e.position)} ${kv('部门',e.department)} ${kv('状态',e.status)} ${kv('入职日期',e.hire_date)}
        </div>
        ${allDocThumbs(e.all_docs)}
      </div>`).join('');
    }
    if((data.foremen||[]).length){
      html+='<div class="sec-title">🦺 工头（'+data.foremen.length+'）</div>';
      html+=data.foremen.map(f=>`<div class="rec fm">
        <div class="nm">${esc(f.name||'—')}</div>
        <div class="meta">
          ${kv('电话',f.phone)} ${kv('邮箱',f.email)} ${kv('仓库',f.warehouse)}
          <span><span class="lbl">状态</span> <b>${f.active?'启用':'停用'}</b></span>
          ${kv('创建时间',String(f.created_at||'').slice(0,16))}
        </div>
      </div>`).join('');
    }
    results.innerHTML=html;
  }catch(e){
    banner.className='banner err';
    banner.textContent='查询失败：'+(e.message||e);
  }finally{
    btn.disabled=false; btn.textContent='🔍 查询';
  }
}

// 用员工档案上的正式姓名更正这条招工申请里填错的名字
async function syncApplicantName(subId, empId, btn){
  if(!confirm('把这条招工申请里的名字改成员工档案上的正式姓名？\n（原来填的名字会记入审计日志）')) return;
  btn.disabled=true; btn.textContent='更正中…';
  try{
    const r=await fetch('/api/admin/applicant-submissions/'+subId+'/sync-name',{
      method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({employee_id:empId})
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.success) throw new Error(d.error||'更正失败');
    doSearch();
  }catch(e){ alert(e.message||'更正失败'); btn.disabled=false; btn.textContent='用档案名更正'; }
}

// ══════ 证件大图查看 + 裁剪 ══════
let _lb = { list: [], idx: 0, sel: null, drag: null, rot: 0, img: null };
function lbOpen(docs, idx) {
  _lb.list = docs; _lb.idx = idx; _lb.sel = null; _lb.rot = 0;
  document.getElementById('lightbox').style.display = 'flex';
  lbRender();
}
function lbClose() { document.getElementById('lightbox').style.display = 'none'; _lb.sel = null; _lb.img = null; }
// 跳到后台的完整证件审阅器 (功能齐全: 🔍识别 🤖AI识读 🎛亮度对比 📄文档增强 ✅真假标记 ✂️连续裁剪)
function lbOpenFullReview() {
  const d = lbCur();
  if (!d.sub_id) { alert('此证件来自员工档案，请在后台「员工档案 → 证件」里审阅'); return; }
  window.open('/admin.html?doc_review=' + d.sub_id, '_blank');
}
function lbNav(d) { _lb.idx = (_lb.idx + d + _lb.list.length) % _lb.list.length; _lb.sel = null; _lb.rot = 0; lbRender(); }
function lbCur() { return _lb.list[_lb.idx] || {}; }
function lbRotate(deg) {
  _lb.rot = ((_lb.rot + deg) % 360 + 360) % 360;
  _lb.sel = null;                       // 旋转后原选框失效
  document.getElementById('lbSelBox').style.display = 'none';
  lbDraw();
  lbSyncSaveBtn();
}
function lbSyncSaveBtn() {
  const d = lbCur();
  const canEdit = !!d.sub_id && !!d.doc_id;
  // 有选框(裁剪) 或 转过角度 都可以保存
  document.getElementById('lbSaveBtn').disabled = !canEdit || (!_lb.sel && _lb.rot === 0);
  document.getElementById('lbSaveBtn').textContent = _lb.sel ? '保存裁剪' : (_lb.rot ? '保存旋转' : '保存');
}
function lbDraw() {
  const img = _lb.img;
  if (!img) return;
  const cv = document.getElementById('lbCanvas');
  const swap = (_lb.rot === 90 || _lb.rot === 270);
  const w = swap ? img.naturalHeight : img.naturalWidth;
  const h = swap ? img.naturalWidth : img.naturalHeight;
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(_lb.rot * Math.PI / 180);
  ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
  ctx.restore();
}
function lbRender() {
  const d = lbCur();
  document.getElementById('lbCap').textContent = (d.label || '') + (d.extra ? ' · ' + d.extra : '') + '  (' + (_lb.idx + 1) + '/' + _lb.list.length + ')';
  document.getElementById('lbSelBox').style.display = 'none';
  const canEdit = !!d.sub_id && !!d.doc_id;
  document.getElementById('lbCropTools').style.display = canEdit ? '' : 'none';
  document.getElementById('lbFullBtn').style.display = canEdit ? '' : 'none';
  document.getElementById('lbCropHint').textContent = canEdit
    ? '拖动框选可裁剪 · ↺ ↻ 可旋转（手机拍歪的证件转正后保存）· 原件始终保留'
    : '此证件来自员工档案，可查看和旋转，但暂不支持保存修改';
  document.getElementById('lbSaveBtn').disabled = true;
  // 默认看原件 (?v=orig)，避免"点开还是缩略/裁剪版"
  const im = new Image();
  im.onload = () => { _lb.img = im; lbDraw(); lbSyncSaveBtn(); };
  im.onerror = () => { document.getElementById('lbCap').textContent = '图片加载失败'; };
  im.src = d.url + (d.url.indexOf('?') >= 0 ? '&' : '?') + 'v=orig&t=' + Date.now();
}
function lbDown(e) {
  const d = lbCur(); if (!d.sub_id) return;
  const r = document.getElementById('lbCanvas').getBoundingClientRect();
  _lb.drag = { x: e.clientX - r.left, y: e.clientY - r.top };
  _lb.sel = null;
  const box = document.getElementById('lbSelBox');
  box.style.display = 'block'; box.style.left = _lb.drag.x + 'px'; box.style.top = _lb.drag.y + 'px';
  box.style.width = '0px'; box.style.height = '0px';
  e.preventDefault();
}
function lbMove(e) {
  if (!_lb.drag) return;
  const r = document.getElementById('lbCanvas').getBoundingClientRect();
  const x = Math.max(0, Math.min(e.clientX - r.left, r.width));
  const y = Math.max(0, Math.min(e.clientY - r.top, r.height));
  const left = Math.min(x, _lb.drag.x), top = Math.min(y, _lb.drag.y);
  const w = Math.abs(x - _lb.drag.x), h = Math.abs(y - _lb.drag.y);
  const box = document.getElementById('lbSelBox');
  box.style.left = left + 'px'; box.style.top = top + 'px'; box.style.width = w + 'px'; box.style.height = h + 'px';
  _lb.sel = (w > 8 && h > 8) ? { left, top, w, h } : null;
  lbSyncSaveBtn();
}
function lbUp() { _lb.drag = null; }
async function lbSaveCrop() {
  const d = lbCur();
  if (!d.sub_id) return;
  if (!_lb.sel && _lb.rot === 0) return;
  const src = document.getElementById('lbCanvas');   // 已含旋转结果
  const btn = document.getElementById('lbSaveBtn');
  const prevText = btn.textContent;
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    let out;
    if (_lb.sel) {
      // 选框是显示尺寸 → 换算成 canvas 内部像素
      const scale = src.width / src.clientWidth;
      const cx = Math.max(0, Math.round(_lb.sel.left * scale));
      const cy = Math.max(0, Math.round(_lb.sel.top * scale));
      const cw = Math.max(1, Math.round(_lb.sel.w * scale));
      const ch = Math.max(1, Math.round(_lb.sel.h * scale));
      out = document.createElement('canvas');
      out.width = cw; out.height = ch;
      out.getContext('2d').drawImage(src, cx, cy, cw, ch, 0, 0, cw, ch);
    } else {
      out = src;   // 只旋转、不裁剪 → 整张保存
    }
    const data = out.toDataURL('image/jpeg', 0.92);
    const r = await fetch('/api/admin/applicant-submissions/' + d.sub_id + '/docs/' + d.doc_id + '/cropped', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.error || '保存失败');
    alert('✅ 已保存（列表缩略图会显示这一版，原件始终保留）');
    lbClose(); doSearch();
  } catch (e) { alert(e.message || '保存失败'); }
  btn.disabled = false; btn.textContent = prevText;
}
async function lbClearCrop() {
  const d = lbCur();
  if (!d.sub_id) return;
  if (!confirm('清除这张证件的裁剪版，恢复显示原件？')) return;
  try {
    const r = await fetch('/api/admin/applicant-submissions/' + d.sub_id + '/docs/' + d.doc_id + '/cropped', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: '' })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.error || '清除失败');
    alert('已恢复原件'); lbClose(); doSearch();
  } catch (e) { alert(e.message || '清除失败'); }
}

// 直接更正申请里填错的名字
async function editApplicantName(subId, cur, btn) {
  const nm = prompt('修改这条招工申请里的姓名：', cur || '');
  if (nm === null) return;
  const v = nm.trim();
  if (!v) { alert('姓名不能为空'); return; }
  btn.disabled = true;
  try {
    const r = await fetch('/api/admin/applicant-submissions/' + subId, {
      method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: v })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.success) throw new Error(d.error || '保存失败');
    doSearch();
  } catch (e) { alert(e.message || '保存失败'); btn.disabled = false; }
}

document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').style.display !== 'flex') return;
  if (e.key === 'Escape') lbClose();
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'r' || e.key === 'R') lbRotate(e.shiftKey ? -90 : 90);
});
</script>
<div id="lightbox" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;padding:16px">
  <div style="color:#fff;font-size:13px;margin-bottom:6px" id="lbCap"></div>
  <div id="lbWrap" style="position:relative;user-select:none;line-height:0"
       onmousedown="lbDown(event)" onmousemove="lbMove(event)" onmouseup="lbUp()" onmouseleave="lbUp()">
    <canvas id="lbCanvas" style="max-width:92vw;max-height:70vh;display:block;border-radius:8px;background:#000;cursor:crosshair"></canvas>
    <div id="lbSelBox" style="display:none;position:absolute;border:2px dashed #38bdf8;background:rgba(56,189,248,.18);pointer-events:none"></div>
  </div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center">
    <button onclick="lbNav(-1)" style="padding:6px 12px;border-radius:6px;border:none;background:#334155;color:#fff;cursor:pointer">← 上一张</button>
    <button onclick="lbNav(1)" style="padding:6px 12px;border-radius:6px;border:none;background:#334155;color:#fff;cursor:pointer">下一张 →</button>
    <button onclick="lbRotate(-90)" title="向左旋转 90°" style="padding:6px 12px;border-radius:6px;border:none;background:#475569;color:#fff;cursor:pointer">↺ 左转</button>
    <button onclick="lbRotate(90)" title="向右旋转 90°" style="padding:6px 12px;border-radius:6px;border:none;background:#475569;color:#fff;cursor:pointer">↻ 右转</button>
    <span id="lbCropTools" style="display:flex;gap:8px;align-items:center">
      <button id="lbSaveBtn" onclick="lbSaveCrop()" disabled style="padding:6px 12px;border-radius:6px;border:none;background:#0ea5e9;color:#fff;cursor:pointer">保存</button>
      <button onclick="lbClearCrop()" style="padding:6px 12px;border-radius:6px;border:1px solid #64748b;background:transparent;color:#e2e8f0;cursor:pointer">恢复原件</button>
    </span>
    <button id="lbFullBtn" onclick="lbOpenFullReview()" title="打开后台完整审阅器: 识别文字 / AI 识读 / 亮度对比度 / 文档增强 / 真假标记 / 连续裁剪" style="padding:6px 12px;border-radius:6px;border:none;background:#7c3aed;color:#fff;cursor:pointer">🔍 完整审阅</button>
    <button onclick="lbClose()" style="padding:6px 12px;border-radius:6px;border:none;background:#b45309;color:#fff;cursor:pointer">关闭 (Esc)</button>
  </div>
  <div id="lbCropHint" style="color:#94a3b8;font-size:12px;margin-top:6px"></div>
</div>
</body>
