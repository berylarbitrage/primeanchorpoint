<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公司日历 · Prime Anchor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<style>
:root{--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--blue:#29AAE1;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#eef3f8;color:#1f2937}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:.25rem;border:none;border-radius:8px;padding:.45rem .85rem;font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-red{background:#fff;color:var(--red);border:1px solid #fecaca}.btn-outline{background:#fff;color:var(--g600);border:1px solid var(--g300)}
.btn-sm{padding:.22rem .6rem;font-size:.76rem}
input,textarea,select{padding:.4rem .5rem;border:1px solid var(--g300);border-radius:6px;font-size:.85rem;font-family:inherit;width:100%}
label{font-size:.78rem;color:var(--g600);font-weight:600;display:block;margin:.55rem 0 .2rem}
.muted{color:var(--g500);font-size:.78rem}
.tag{display:inline-block;border-radius:999px;padding:.08rem .55rem;font-size:.72rem;font-weight:700}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--g200);border-left:1px solid var(--g200);margin-top:10px}
.dow{background:#f8fafc;font-size:.74rem;font-weight:700;color:var(--g500);text-align:center;padding:5px 0;border-right:1px solid var(--g200);border-bottom:1px solid var(--g200)}
.day{min-height:104px;border-right:1px solid var(--g200);border-bottom:1px solid var(--g200);padding:4px;background:#fff;cursor:pointer;min-width:0}
.day:hover{background:#f8fbff}
.day.other{background:#fafafa}.day.other .dn{color:var(--g300)}
.day.today .dn{background:#0f4c6b;color:#fff;border-radius:999px;padding:0 6px}
.dn{font-size:.76rem;font-weight:700;color:var(--g600);display:inline-block;margin-bottom:2px}
.ev{display:block;font-size:.72rem;line-height:1.25;border-radius:5px;padding:2px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff}
.ev.pending{background:#fef3c7!important;color:#92400e;border:1px dashed #f59e0b}
.ev.isdone{opacity:.55;text-decoration:line-through}
.ev.rejected{background:var(--g100)!important;color:var(--g500);text-decoration:line-through}
.pend{border-left:4px solid #f59e0b;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
#payModal,#ppModal{z-index:60}
.modal .card{max-width:460px;width:100%;max-height:92vh;overflow:auto}
@media (max-width:640px){.day{min-height:64px;padding:2px}.ev{font-size:0;height:6px;padding:0;margin-top:2px}.dn{font-size:.7rem}}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;background:#eef3f8;display:none;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="max-width:360px;width:100%;text-align:center">
    <div style="font-weight:800;margin-bottom:.6rem">📅 公司日历</div>
    <input id="lu" placeholder="用户名" style="margin-bottom:.5rem">
    <input id="lp" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
    <div id="le" style="color:var(--red);font-size:.8rem;min-height:1.1em;margin-top:.4rem"></div>
    <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="login()">登录</button>
  </div>
</div>
<div class="wrap" id="main" style="display:none">
  <div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start">
    <div style="flex:1;min-width:0"><div style="font-size:1.2rem;font-weight:800;color:#0f4c6b">📅 公司日历</div>
      <div class="muted">公司重要的事情。每个人都可以添加，admin 批准后才对所有人显示；还没批准的只有你自己（和 admin）能看到，显示为黄色虚线。每周三自动提醒 Gusto payroll 截止、周四提醒取现金发工资截止，每周五自动显示「💰 发工资」，列出这周开出的所有 invoice。总监可以把事情标为完成，admin 审核确认。</div></div>
    <button class="btn btn-blue" onclick="openEdit(null, todayStr())">＋ 添加事情</button>
  </div>
  <div id="remind" style="margin-top:12px"></div>
  <div id="pendBox" style="margin-top:12px"></div>
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button class="btn btn-outline btn-sm" onclick="shift(-1)">‹</button>
        <div id="monthLbl" style="font-weight:800;font-size:1.05rem;min-width:120px;text-align:center"></div>
        <button class="btn btn-outline btn-sm" onclick="shift(1)">›</button>
        <button class="btn btn-outline btn-sm" onclick="goToday()">今天</button>
      </div>
      <div class="row muted" id="legend"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div style="font-weight:800;margin-bottom:.4rem">本月事项</div>
    <div id="monthList"></div>
  </div>
</div>

<div class="modal" id="viewModal" onclick="if(event.target===this)closeM('viewModal')"><div class="card" id="viewBody"></div></div>
<div class="modal" id="ppModal" onclick="if(event.target===this)closeM('ppModal')">
  <div class="card">
    <div style="font-weight:800;font-size:1.05rem">⏰ 推迟截止日期</div>
    <div class="muted" id="ppTitle" style="margin-top:.2rem"></div>
    <label>推迟到 *</label><input id="ppDate" type="date">
    <label>推迟原因 *</label><textarea id="ppReason" rows="3" maxlength="500" placeholder="例如：客户付款晚了 / 银行周四休息…"></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:.8rem">
      <button class="btn btn-outline" onclick="closeM('ppModal')">取消</button>
      <button class="btn btn-blue" onclick="ppSave(PP_KEY, document.getElementById('ppDate').value)">保存</button>
    </div>
  </div>
</div>
<div class="modal" id="payModal" onclick="if(event.target===this)closeM('payModal')">
  <div class="card">
    <div style="font-weight:800;font-size:1.05rem">发工资标注</div>
    <div class="muted" id="payTitle" style="margin-top:.2rem"></div>
    <div class="row" style="margin-top:.6rem;gap:1rem">
      <label style="margin:0;display:flex;gap:.3rem;align-items:center;font-size:.88rem"><input type="radio" name="pst" value="done" style="width:auto" onchange="payStatusChanged()"> ✔ 已发</label>
      <label style="margin:0;display:flex;gap:.3rem;align-items:center;font-size:.88rem;color:var(--red)"><input type="radio" name="pst" value="not_done" style="width:auto" onchange="payStatusChanged()"> ✗ 没发</label>
    </div>
    <label id="payNoteLbl">备注</label><textarea id="payNote" rows="3" maxlength="1000"></textarea>
    <label>截图（可多张）</label>
    <input type="file" id="payFile" accept="image/*" multiple onchange="addPayFiles(this)">
    <div class="row" id="payPhotos" style="margin-top:.4rem"></div>
    <div class="row" style="justify-content:flex-end;margin-top:.8rem">
      <button class="btn btn-outline" onclick="closeM('payModal')">取消</button>
      <button class="btn btn-blue" onclick="savePay()">保存</button>
    </div>
  </div>
</div>
<div class="modal" id="editModal" onclick="if(event.target===this)closeM('editModal')">
  <div class="card">
    <div style="font-weight:800;font-size:1.05rem" id="editTitle">添加事情</div>
    <label>标题 *</label><input id="fTitle" maxlength="200" placeholder="例如：季度报税截止">
    <div class="row" style="flex-wrap:nowrap">
      <div style="flex:1"><label>开始日期 *</label><input id="fStart" type="date"></div>
      <div style="flex:1"><label>结束日期（多天才填）</label><input id="fEnd" type="date"></div>
    </div>
    <div class="row" style="flex-wrap:nowrap">
      <div style="flex:1"><label>时间</label><input id="fTime" maxlength="40" placeholder="例如 10:00 / 全天"></div>
      <div style="flex:1"><label>类别</label><select id="fCat"></select></div>
    </div>
    <label>说明</label><textarea id="fDesc" rows="4" maxlength="2000" placeholder="细节、地点、负责人…"></textarea>
    <div class="muted" id="editHint" style="margin-top:.5rem"></div>
    <div class="row" style="justify-content:flex-end;margin-top:.8rem">
      <button class="btn btn-outline" onclick="closeM('editModal')">取消</button>
      <button class="btn btn-blue" id="saveBtn" onclick="save()">保存</button>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('adminToken') || localStorage.getItem('acct_token') || '';
let D = { events: [], approver: false, me: null };
let CUR = new Date(); CUR.setDate(1);
let EDIT_ID = null;
const CATS = { '': ['一般', '#0E7BB8'], deadline: ['截止日期', '#dc2626'], meeting: ['会议', '#7c3aed'], holiday: ['假期', '#16a34a'], client: ['客户', '#d97706'], payroll: ['发薪 / 财务', '#0f766e'] };
function esc(s) { if (s == null) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML.replace(/"/g, '&quot;'); }
function toast(msg, bad) {
  const t = document.createElement('div'); t.textContent = msg;
  t.style.cssText = `position:fixed;left:50%;top:18px;transform:translateX(-50%);background:${bad ? '#dc2626' : '#16a34a'};color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;z-index:3000`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || 'GET', headers: { ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}), ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { document.getElementById('gate').style.display = 'flex'; document.getElementById('main').style.display = 'none'; throw new Error('请先登录'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}
async function login() {
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('lu').value.trim(), password: document.getElementById('lp').value }) }).then(x => x.json()).catch(() => ({}));
  if (r.mfa_required) { location.href = '/mfa?token=' + encodeURIComponent(r.mfa_token) + '&next=/calendar' + (r.phone_hint ? '&hint=' + encodeURIComponent(r.phone_hint) : ''); return; }
  if (!r.success) { document.getElementById('le').textContent = r.error || '登录失败'; return; }
  TOKEN = r.token; localStorage.setItem('adminToken', TOKEN);
  document.getElementById('gate').style.display = 'none'; load();
}
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const cat = e => CATS[e.category] || CATS[''];
const range = e => e.end_date && e.end_date !== e.start_date ? `${e.start_date} ~ ${e.end_date}` : e.start_date;
const onDay = (e, ds) => ds >= e.start_date && ds <= (e.end_date || e.start_date);
const ST = { pending: ['⏳ 等 admin 批准', '#92400e', '#fef3c7'], approved: ['✅ 已批准', '#166534', '#dcfce7'], rejected: ['✗ 未批准', '#4b5563', '#f3f4f6'] };
const stTag = e => { if (e.auto) return '<span class="tag" style="background:#ccfbf1;color:#0f766e">⚙ 自动</span>'; const [l, c, b] = ST[e.status] || ST.pending; return `<span class="tag" style="background:${b};color:${c}">${l}</span>`; };
// 完成状态: 总监标完成 → admin 审核
const DONE = { pending_review: ['⏳ 已标完成 · 等 admin 审核', '#92400e', '#fef3c7', '⏳'], approved: ['✔ 已完成', '#166534', '#dcfce7', '✔'], rejected: ['↩ admin 退回', '#991b1b', '#fee2e2', '↩'] };
const doneTag = e => { const d = e.done && DONE[e.done.status]; return d ? `<span class="tag" style="background:${d[2]};color:${d[1]}">${d[0]}</span>` : ''; };
const doneIcon = e => { const d = e.done && DONE[e.done.status]; return d ? d[3] + ' ' : ''; };
const catTag = e => { const [l, c] = cat(e); return `<span class="tag" style="background:${c}1a;color:${c}">${esc(l)}</span>`; };

async function load() {
  let j; try { j = await api('/api/calendar'); } catch (e) { return; }
  document.getElementById('main').style.display = '';
  if (j.error) { toast(j.error, true); return; }
  // 发工资事项: 按每张 invoice 的标注算整体状态 (全部已发且 admin 确认 = 完成)
  for (const e of j.events) if (e.invoices) {
    const ps = e.invoices.map(i => i.pay);
    const ok = ps.filter(p => p && p.status === 'done' && p.review_status === 'approved').length;
    e.progress = `${ok}/${ps.length}`;
    e.done = ok === ps.length ? { status: 'approved' }
      : ps.every(p => p && p.status === 'done' && p.review_status !== 'rejected') ? { status: 'pending_review' } : null;
  }
  D = j; render();
}
function shift(n) { CUR.setMonth(CUR.getMonth() + n); render(); }
function goToday() { CUR = new Date(); CUR.setDate(1); render(); }
function render() {
  document.getElementById('legend').innerHTML = Object.values(CATS).map(([l, c]) => `<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:3px"></span>${esc(l)}</span>`).join(' ');
  const y = CUR.getFullYear(), m = CUR.getMonth();
  document.getElementById('monthLbl').textContent = `${y} 年 ${m + 1} 月`;
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  const today = todayStr();
  // 被拒的只在自己的列表里显示, 不上日历格子
  const shown = D.events.filter(e => e.status !== 'rejected');
  let html = ['日', '一', '二', '三', '四', '五', '六'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d);
    const evs = shown.filter(e => onDay(e, ds));
    html += `<div class="day ${d.getMonth() !== m ? 'other' : ''} ${ds === today ? 'today' : ''}" onclick="openEdit(null,'${ds}')">
      <span class="dn">${d.getDate()}</span>
      ${evs.map(e => `<span class="ev ${esc(e.status)}${e.done && e.done.status === 'approved' ? ' isdone' : ''}" style="background:${cat(e)[1]}" title="${esc(e.title)}" onclick="event.stopPropagation();view('${e.id}')">${doneIcon(e)}${e.time ? esc(e.time) + ' ' : ''}${esc(e.title)}${e.progress ? ' · ' + e.progress : ''}</span>`).join('')}
    </div>`;
  }
  document.getElementById('grid').innerHTML = html;

  const mStart = `${y}-${pad(m + 1)}-01`, mEnd = `${y}-${pad(m + 1)}-31`;
  const inMonth = D.events.filter(e => e.start_date <= mEnd && (e.end_date || e.start_date) >= mStart)
    .sort((a, b) => a.start_date.localeCompare(b.start_date) || String(a.time || '').localeCompare(String(b.time || '')));
  document.getElementById('monthList').innerHTML = inMonth.map(e => `<div class="row" style="padding:.4rem 0;border-top:1px solid var(--g100);cursor:pointer" onclick="view('${e.id}')">
      <span style="font-family:monospace;font-size:.8rem;color:var(--g500);min-width:96px">${esc(range(e))}</span>
      <b style="font-size:.88rem">${esc(e.title)}</b>${e.time ? `<span class="muted">${esc(e.time)}</span>` : ''}${catTag(e)}${e.status !== 'approved' ? stTag(e) : ''}${e.progress ? `<span class="muted">已发 ${e.progress}</span>` : ''}${ppTag(e)}${doneTag(e)}${quick(e)}
    </div>`).join('') || '<div class="muted">这个月还没有事项</div>';

  // 提醒: 今天 / 明天到期、还没确认完成的
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  const soon = [[today, '今天'], [ymd(tmr), '明天']].flatMap(([ds, lbl]) => D.events
    .filter(e => e.status === 'approved' && onDay(e, ds) && !(e.done && e.done.status === 'approved')).map(e => [lbl, e]));
  document.getElementById('remind').innerHTML = soon.length ? `<div class="card" style="border-left:4px solid #dc2626;background:#fff7f7">
      <div style="font-weight:800;margin-bottom:.3rem">🔔 提醒</div>
      ${soon.map(([lbl, e]) => `<div class="row" style="padding:.2rem 0;cursor:pointer" onclick="view('${e.id}')">
        <span class="tag" style="background:${lbl === '今天' ? '#dc2626' : '#f59e0b'};color:#fff">${lbl}</span><b style="font-size:.88rem">${esc(e.title)}</b>${ppTag(e)}${doneTag(e)}${quick(e)}</div>`).join('')}
    </div>` : '';

  // admin: 等批准的列表; 其他人: 自己等批准 / 被拒的
  const pend = D.events.filter(e => e.status === 'pending' || (!D.approver && e.status === 'rejected'));
  document.getElementById('pendBox').innerHTML = pend.length ? `<div class="card">
      <div style="font-weight:800;margin-bottom:.5rem">${D.approver ? `⏳ 等你批准（${pend.length}）` : '我提交的（还没对大家显示）'}</div>
      ${pend.map(e => `<div class="card pend" style="padding:10px 12px${e.status === 'rejected' ? ';border-left-color:var(--g400)' : ''}">
        <div class="row"><b>${esc(e.title)}</b><span class="muted">${esc(range(e))}${e.time ? ' · ' + esc(e.time) : ''}</span>${catTag(e)}${stTag(e)}</div>
        ${e.description ? `<div style="font-size:.82rem;margin-top:.3rem;white-space:pre-wrap">${esc(e.description)}</div>` : ''}
        <div class="muted" style="margin-top:.25rem">${esc(e.created_by_name)} 提交 · ${esc(fmt(e.created_at))}${e.status === 'rejected' && e.note ? ' · admin 备注：' + esc(e.note) : ''}</div>
        <div class="row" style="margin-top:.45rem">
          ${D.approver ? `<input id="note${e.id}" placeholder="备注（可不填）" style="flex:1;min-width:160px;width:auto">
            <button class="btn btn-green btn-sm" onclick="decide(${e.id},true)">✓ 批准</button><button class="btn btn-outline btn-sm" onclick="decide(${e.id},false)">✗ 不批准</button>` : ''}
          <button class="btn btn-outline btn-sm" onclick="openEdit(${e.id})">编辑</button>
          <button class="btn btn-red btn-sm" onclick="del(${e.id})">删除</button>
        </div>
      </div>`).join('')}
    </div>` : '';
  // admin: 总监标了完成、等审核的
  const rev = D.approver ? D.events.filter(e => !e.invoices && e.done && e.done.status === 'pending_review') : [];
  const prev = D.approver ? D.events.filter(e => e.invoices).flatMap(e => e.invoices.filter(i => i.pay && i.pay.review_status === 'pending').map(i => [e, i])) : [];
  if (prev.length) document.getElementById('pendBox').innerHTML += `<div class="card" style="margin-top:12px">
      <div class="row" style="justify-content:space-between;margin-bottom:.5rem"><b>💰 发工资标注等你审核（${prev.length} 张）</b><button class="btn btn-green btn-sm" onclick="payReviewAll()">✓ 全部确认</button></div>
      ${prev.map(([e, i]) => `<div class="card pend" style="padding:10px 12px;border-left-color:${i.pay.status === 'done' ? '#16a34a' : '#dc2626'}">
        <div class="row"><b style="cursor:pointer" onclick="view('${e.id}')">${esc(i.number)}</b><span class="muted">${esc(i.company)} · ${esc(e.start_date)} 发工资</span>${payTag(i)}</div>
        ${payDetail(i)}
        <div class="row" style="margin-top:.45rem"><input id="prnote-${i.id}" placeholder="备注（可不填）" style="flex:1;min-width:160px;width:auto">
          <button class="btn btn-green btn-sm" onclick="payReview(${i.id},true)">✓ 确认</button><button class="btn btn-outline btn-sm" onclick="payReview(${i.id},false)">↩ 退回</button></div>
      </div>`).join('')}
    </div>`;
  if (rev.length) document.getElementById('pendBox').innerHTML += `<div class="card" style="margin-top:12px">
      <div class="row" style="justify-content:space-between;margin-bottom:.5rem"><b>✔ 等你审核完成（${rev.length}）</b><button class="btn btn-green btn-sm" onclick="reviewAll()">✓ 全部确认</button></div>
      ${rev.map(e => `<div class="card pend" style="padding:10px 12px;border-left-color:#16a34a">
        <div class="row"><b style="cursor:pointer" onclick="view('${e.id}')">${esc(e.title)}</b><span class="muted">${esc(range(e))}</span>${catTag(e)}</div>
        <div class="muted" style="margin-top:.25rem">${esc(e.done.done_by)} 标完成 · ${esc(fmt(e.done.done_at))}${e.done.done_note ? ' · ' + esc(e.done.done_note) : ''}</div>
        <div class="row" style="margin-top:.45rem"><input id="rnote-${esc(e.key)}" placeholder="备注（可不填）" style="flex:1;min-width:160px;width:auto">
          <button class="btn btn-green btn-sm" onclick="review('${e.key}',true)">✓ 确认完成</button><button class="btn btn-outline btn-sm" onclick="review('${e.key}',false)">↩ 退回</button></div>
      </div>`).join('')}
    </div>`;
}
function fmt(t) { if (!t) return ''; const d = new Date(String(t).includes('T') ? t : String(t).replace(' ', 'T') + 'Z'); return isNaN(d) ? t : d.toLocaleString(); }
function canEdit(e) { return !e.auto && (D.approver || e.created_by === D.me); }
let VIEW_ID = null;
function view(id) {
  VIEW_ID = id;
  const e = D.events.find(x => String(x.id) === String(id)); if (!e) return;
  document.getElementById('viewBody').innerHTML = `
    <div class="row" style="justify-content:space-between"><div style="font-weight:800;font-size:1.05rem">${esc(e.title)}</div><button class="btn btn-outline btn-sm" onclick="closeM('viewModal')">✕</button></div>
    <div class="row" style="margin-top:.4rem">${catTag(e)}${stTag(e)}</div>
    <div style="margin-top:.5rem;font-size:.88rem">📅 ${esc(range(e))}${e.time ? ' · ' + esc(e.time) : ''}${e.postponed ? ` <span class="muted">（原 ${esc(e.orig_date)}）</span>` : ''}</div>
    ${e.description ? `<div style="margin-top:.5rem;font-size:.86rem;white-space:pre-wrap;background:#f8fafc;border-radius:8px;padding:.5rem .7rem">${esc(e.description)}</div>` : ''}
    ${e.invoices ? invTable(e) : ''}
    ${doneBox(e)}
    ${ppBox(e)}
    <div class="muted" style="margin-top:.6rem">${esc(e.created_by_name)} 添加${e.decided_by ? ` · ${esc(e.decided_by)} ${e.status === 'approved' ? '批准' : '处理'}` : ''}${e.note ? ' · 备注：' + esc(e.note) : ''}</div>
    ${canEdit(e) ? `<div class="row" style="justify-content:flex-end;margin-top:.8rem">
      ${D.approver && e.status !== 'approved' ? `<button class="btn btn-green btn-sm" onclick="decide(${e.id},true)">✓ 批准</button>` : ''}
      <button class="btn btn-outline btn-sm" onclick="closeM('viewModal');openEdit(${e.id})">编辑</button>
      <button class="btn btn-red btn-sm" onclick="del(${e.id})">删除</button></div>` : ''}`;
  document.getElementById('viewModal').classList.add('show');
}
function doneBox(e) {
  if (e.status !== 'approved' || e.invoices) return '';
  const d = e.done;
  let h = '';
  if (d) h += `<div style="margin-top:.6rem">${doneTag(e)} <span class="muted">${esc(d.done_by)} 标完成 · ${esc(fmt(d.done_at))}${d.done_note ? ' · ' + esc(d.done_note) : ''}</span></div>`
    + (d.reviewed_by && d.status !== 'pending_review' ? `<div class="muted">${esc(d.reviewed_by)} ${d.status === 'approved' ? '确认' : '退回'} · ${esc(fmt(d.reviewed_at))}${d.review_note ? ' · ' + esc(d.review_note) : ''}</div>` : '');
  const btns = [];
  if (D.canMark && (!d || d.status === 'rejected')) btns.push(`<input id="dnote" placeholder="完成说明（可不填）" style="flex:1;min-width:150px;width:auto"><button class="btn btn-green btn-sm" onclick="markDone('${e.key}',true)">✓ 标记完成</button>`);
  if (D.approver && d && d.status === 'pending_review') btns.push(`<input id="mrnote" placeholder="备注（可不填）" style="flex:1;min-width:150px;width:auto"><button class="btn btn-green btn-sm" onclick="review('${e.key}',true,'mrnote')">✓ 确认完成</button><button class="btn btn-outline btn-sm" onclick="review('${e.key}',false,'mrnote')">↩ 退回</button>`);
  if (d && d.status !== 'rejected' && (D.approver || (D.canMark && d.status === 'pending_review'))) btns.push(`<button class="btn btn-outline btn-sm" onclick="markDone('${e.key}',false)">撤回完成</button>`);
  if (btns.length) h += `<div class="row" style="margin-top:.45rem">${btns.join('')}</div>`;
  return h ? `<div style="margin-top:.6rem;border-top:1px solid var(--g100);padding-top:.4rem">${h}</div>` : '';
}
// 列表 / 提醒里直接点: 完成、推迟, 不用点开弹窗
function quick(e) {
  if (!D.canMark || e.status !== 'approved') return '';
  const b = [];
  if (!e.invoices && (!e.done || e.done.status === 'rejected')) b.push(`<button class="btn btn-green btn-sm" onclick="event.stopPropagation();markDone('${e.key}',true)">✓ 完成</button>`);
  if (!(e.done && e.done.status === 'approved')) b.push(`<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openPp('${e.id}')">⏰ 推迟</button>`);
  return b.length ? `<span style="flex:1"></span>${b.join('')}` : '';
}
const ppTag = e => e.postponed ? `<span class="tag" style="background:#ede9fe;color:#6d28d9" title="${esc(e.postponed.reason)}">⏰ 已推迟（原 ${esc(e.orig_date.slice(5))}）</span>` : '';
function ppBox(e) {
  if (e.status !== 'approved') return '';
  const p = e.postponed;
  let h = p ? `<div style="font-size:.82rem">${ppTag(e)} <span class="muted">${esc(p.postponed_by)} · ${esc(fmt(p.postponed_at))}</span></div><div style="font-size:.8rem;margin-top:.2rem"><b>推迟原因：</b>${esc(p.reason)}</div>` : '';
  if (D.canMark && !(e.done && e.done.status === 'approved')) h += `<div class="row" style="margin-top:.4rem"><button class="btn btn-outline btn-sm" onclick="openPp('${e.id}')">⏰ ${p ? '改推迟日期' : '推迟截止日期'}</button>${p ? `<button class="btn btn-outline btn-sm" onclick="ppSave('${e.key}',null)">取消推迟</button>` : ''}</div>`;
  return h ? `<div style="margin-top:.6rem;border-top:1px solid var(--g100);padding-top:.4rem">${h}</div>` : '';
}
let PP_KEY = null;
function openPp(id) {
  const e = D.events.find(x => String(x.id) === String(id)); if (!e) return;
  PP_KEY = e.key;
  document.getElementById('ppTitle').textContent = `${e.title}（${e.postponed ? '原 ' + e.orig_date + '，现 ' : ''}${e.start_date}）`;
  const d = new Date(e.start_date + 'T00:00:00'); d.setDate(d.getDate() + 1);
  document.getElementById('ppDate').value = e.postponed ? e.start_date : ymd(d);
  document.getElementById('ppReason').value = e.postponed ? e.postponed.reason : '';
  document.getElementById('ppModal').classList.add('show');
  setTimeout(() => document.getElementById('ppReason').focus(), 50);
}
async function ppSave(key, date) {
  const reason = document.getElementById('ppReason').value.trim();
  if (date !== null) { if (!date) return toast('请选新的日期', true); if (!reason) return toast('推迟要写原因', true); }
  const j = await api('/api/calendar/postpone', { method: 'POST', body: { key, new_date: date, reason } }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  closeM('ppModal'); toast(date ? '已推迟到 ' + date : '已取消推迟'); reloadView();
}
async function reviewAll() {
  const keys = D.events.filter(e => !e.invoices && e.done && e.done.status === 'pending_review').map(e => e.key);
  for (const key of keys) { const j = await api('/api/calendar/done/review', { method: 'POST', body: { key, approve: true } }).catch(e => ({ error: e.message })); if (j.error) { toast(j.error, true); break; } }
  toast(`已确认 ${keys.length} 件`); reloadView();
}
async function payReviewAll() {
  const ids = D.events.filter(e => e.invoices).flatMap(e => e.invoices.filter(i => i.pay && i.pay.review_status === 'pending').map(i => i.id));
  for (const id of ids) { const j = await api('/api/calendar/invpay/review', { method: 'POST', body: { invoice_id: id, approve: true } }).catch(e => ({ error: e.message })); if (j.error) { toast(j.error, true); break; } }
  toast(`已确认 ${ids.length} 张`); reloadView();
}
async function markDone(key, done) {
  const n = document.getElementById('dnote');
  const j = await api('/api/calendar/done', { method: 'POST', body: { key, done, note: n ? n.value : '' } }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  toast(!done ? '已撤回' : j.status === 'approved' ? '已标记完成' : '已标记完成，等 admin 审核'); reloadView();
}
async function review(key, ok, inputId) {
  const n = document.getElementById(inputId || 'rnote-' + key);
  const j = await api('/api/calendar/done/review', { method: 'POST', body: { key, approve: ok, note: n ? n.value : '' } }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  toast(ok ? '已确认完成' : '已退回'); reloadView();
}
// 自动「发工资」事项: 这周开出的 invoice 列表
function invTable(e) {
  const money = n => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const tot = e.invoices.reduce((s, i) => s + i.subtotal, 0);
  return `<div class="muted" style="margin-top:.5rem">这周开出的 invoice，周五要发工资（每张单独标注，已发 ${e.progress}）：</div>
    <div style="margin-top:.3rem">
      ${e.invoices.map(i => `<div style="border-top:1px solid var(--g100);padding:.4rem 0">
        <div class="row" style="font-size:.8rem">
          <span style="font-family:monospace;flex:1;min-width:150px">${esc(i.number)}</span><span style="min-width:110px">${esc(i.company)}</span>
          <b style="min-width:80px;text-align:right">${money(i.subtotal)}</b>
          ${i.sub_paid ? '<span class="tag" style="background:#dcfce7;color:#166534">分包已付</span>' : ''}${i.paid ? '<span class="tag" style="background:#e0f2fe;color:#075985">客户已付</span>' : ''}
        </div>
        <div class="row" style="margin-top:.25rem">${payTag(i)}${payButtons(i)}</div>
        ${payDetail(i)}
      </div>`).join('')}
      <div class="row" style="border-top:2px solid var(--g200);padding-top:.35rem;font-weight:700;font-size:.82rem;justify-content:space-between"><span>合计 ${e.invoices.length} 张</span><span>${money(tot)}</span></div>
    </div>`;
}
// 每张 invoice 的发工资标注
const PAY = { done: ['✔ 已发', '#166534', '#dcfce7'], not_done: ['✗ 没发', '#991b1b', '#fee2e2'] };
const REV = { pending: ['等 admin 审核', '#92400e', '#fef3c7'], approved: ['admin 已确认', '#166534', '#dcfce7'], rejected: ['admin 退回', '#991b1b', '#fee2e2'] };
function payTag(i) {
  if (!i.pay) return '<span class="tag" style="background:var(--g100);color:var(--g500)">未标注</span>';
  const [l, c, b] = PAY[i.pay.status] || PAY.done, [rl, rc, rb] = REV[i.pay.review_status] || REV.pending;
  return `<span class="tag" style="background:${b};color:${c}">${l}</span><span class="tag" style="background:${rb};color:${rc}">${rl}</span>`;
}
function payDetail(i) {
  const p = i.pay; if (!p) return '';
  return `<div style="font-size:.78rem;margin-top:.25rem;background:#f8fafc;border-radius:6px;padding:.35rem .5rem">
    ${p.note ? `<div style="white-space:pre-wrap">${p.status === 'not_done' ? '<b>原因：</b>' : ''}${esc(p.note)}</div>` : ''}
    ${p.photos && p.photos.length ? `<div class="row" style="margin-top:.25rem">${p.photos.map(k => { const u = '/api/calendar/file/' + encodeURIComponent(k.replace(/^calendar\//, '')); return `<a href="${u}" target="_blank"><img src="${u}" style="width:56px;height:56px;object-fit:cover;border-radius:5px;border:1px solid var(--g200)"></a>`; }).join('')}</div>` : ''}
    <div class="muted" style="margin-top:.15rem">${esc(p.marked_by)} 标注 · ${esc(fmt(p.marked_at))}${p.reviewed_by && p.review_status !== 'pending' ? ` · ${esc(p.reviewed_by)} ${p.review_status === 'approved' ? '确认' : '退回'}${p.review_note ? '：' + esc(p.review_note) : ''}` : ''}</div>
  </div>`;
}
function payButtons(i) {
  const p = i.pay, b = [];
  const locked = p && p.review_status === 'approved' && !D.approver;
  if (D.canMark && !locked) b.push(`<button class="btn btn-green btn-sm" onclick="openPay(${i.id},'done')">✓ 已发</button><button class="btn btn-outline btn-sm" style="color:var(--red)" onclick="openPay(${i.id},'not_done')">✗ 没发</button>`);
  if (D.approver && p && p.review_status === 'pending') b.push(`<button class="btn btn-green btn-sm" onclick="payReview(${i.id},true)">确认</button><button class="btn btn-outline btn-sm" onclick="payReview(${i.id},false)">退回</button>`);
  if (D.canMark && p && !locked) b.push(`<button class="btn btn-outline btn-sm" onclick="payUndo(${i.id})">撤回</button>`);
  return b.length ? `<span style="flex:1"></span>${b.join('')}` : '';
}
let PAY_ID = null, PAY_PHOTOS = [];
function findInv(id) { for (const e of D.events) for (const i of (e.invoices || [])) if (i.id === id) return i; return null; }
function openPay(id, status) {
  const i = findInv(id); if (!i) return;
  PAY_ID = id; PAY_PHOTOS = (i.pay && i.pay.photos) ? i.pay.photos.slice() : [];
  document.getElementById('payTitle').textContent = `${i.number} · ${i.company}`;
  document.querySelector(`input[name=pst][value=${status}]`).checked = true;
  document.getElementById('payNote').value = i.pay ? (i.pay.note || '') : '';
  document.getElementById('payFile').value = '';
  payStatusChanged(); renderPayPhotos();
  document.getElementById('payModal').classList.add('show');
}
function payStatusChanged() {
  const nd = document.querySelector('input[name=pst]:checked').value === 'not_done';
  document.getElementById('payNoteLbl').textContent = nd ? '没完成的原因 *（必填，写清楚）' : '备注（可不填）';
  document.getElementById('payNote').placeholder = nd ? '例如：客户还没付款 / 工人银行信息不对 / 现金不够…' : '例如：已在 Gusto 提交 / 现金已发';
}
function renderPayPhotos() {
  document.getElementById('payPhotos').innerHTML = PAY_PHOTOS.map((k, n) => { const u = '/api/calendar/file/' + encodeURIComponent(k.replace(/^calendar\//, ''));
    return `<span style="position:relative;display:inline-block"><img src="${u}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--g200)"><button onclick="PAY_PHOTOS.splice(${n},1);renderPayPhotos()" style="position:absolute;top:-6px;right:-6px;border:none;border-radius:999px;background:#dc2626;color:#fff;width:18px;height:18px;font-size:.7rem;cursor:pointer">✕</button></span>`; }).join('');
}
// 截图压成最长边 1600px 的 JPEG 再传
function shrink(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85)); };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('读不了这张图片')); };
    img.src = url;
  });
}
async function addPayFiles(inp) {
  for (const f of [...inp.files]) {
    if (PAY_PHOTOS.length >= 10) { toast('最多 10 张截图', true); break; }
    try { const j = await api('/api/calendar/upload', { method: 'POST', body: { data: await shrink(f) } }); if (j.error) throw new Error(j.error); PAY_PHOTOS.push(j.key); renderPayPhotos(); }
    catch (e) { toast(e.message, true); }
  }
  inp.value = '';
}
async function savePay() {
  const status = document.querySelector('input[name=pst]:checked').value, note = document.getElementById('payNote').value.trim();
  if (status === 'not_done' && !note) return toast('没完成要写清楚原因', true);
  const j = await api('/api/calendar/invpay', { method: 'POST', body: { invoice_id: PAY_ID, status, note, photos: PAY_PHOTOS } }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  closeM('payModal'); toast(j.review_status === 'approved' ? '已标注' : '已标注，等 admin 审核'); reloadView();
}
async function payUndo(id) {
  const j = await api('/api/calendar/invpay', { method: 'POST', body: { invoice_id: id, status: null } }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  toast('已撤回'); reloadView();
}
async function payReview(id, ok) {
  const n = document.getElementById('prnote-' + id);
  const j = await api('/api/calendar/invpay/review', { method: 'POST', body: { invoice_id: id, approve: ok, note: n ? n.value : '' } }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  toast(ok ? '已确认' : '已退回'); reloadView();
}
// 改完重新加载, 弹窗开着的话刷新弹窗内容
async function reloadView() {
  const open = document.getElementById('viewModal').classList.contains('show') ? VIEW_ID : null;
  await load();
  if (open) view(open);
}
function closeM(id) { document.getElementById(id).classList.remove('show'); }
function openEdit(id, date) {
  const e = id ? D.events.find(x => x.id === id) : null;
  EDIT_ID = e ? e.id : null;
  document.getElementById('editTitle').textContent = e ? '编辑事情' : '添加事情';
  document.getElementById('fCat').innerHTML = Object.entries(CATS).map(([k, [l]]) => `<option value="${k}">${esc(l)}</option>`).join('');
  document.getElementById('fTitle').value = e ? e.title : '';
  document.getElementById('fStart').value = e ? e.start_date : (date || todayStr());
  document.getElementById('fEnd').value = e ? (e.end_date || '') : '';
  document.getElementById('fTime').value = e ? (e.time || '') : '';
  document.getElementById('fCat').value = e ? (e.category || '') : '';
  document.getElementById('fDesc').value = e ? (e.description || '') : '';
  document.getElementById('editHint').textContent = D.approver ? '你是 admin，保存后直接对所有人显示。' : (e ? '修改后需要 admin 重新批准才会显示。' : '提交后需要 admin 批准才会对所有人显示。');
  document.getElementById('editModal').classList.add('show');
  setTimeout(() => document.getElementById('fTitle').focus(), 50);
}
async function save() {
  const body = { title: document.getElementById('fTitle').value, start_date: document.getElementById('fStart').value, end_date: document.getElementById('fEnd').value,
    time: document.getElementById('fTime').value, category: document.getElementById('fCat').value, description: document.getElementById('fDesc').value };
  if (!body.title.trim() || !body.start_date) return toast('请填写标题和日期', true);
  const btn = document.getElementById('saveBtn'); btn.disabled = true;
  const j = await api(EDIT_ID ? '/api/calendar/' + EDIT_ID : '/api/calendar', { method: EDIT_ID ? 'PUT' : 'POST', body }).catch(e => ({ error: e.message }));
  btn.disabled = false;
  if (j.error) return toast(j.error, true);
  closeM('editModal');
  toast(j.status === 'approved' ? '已保存' : '已提交，等 admin 批准后显示');
  load();
}
async function decide(id, ok) {
  const n = document.getElementById('note' + id);
  const j = await api(`/api/calendar/${id}/decide`, { method: 'POST', body: { approve: ok, note: n ? n.value : '' } }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  closeM('viewModal'); toast(ok ? '已批准，所有人可见' : '已标记为不批准'); load();
}
async function del(id) {
  if (!confirm('删除这件事？')) return;
  const j = await api('/api/calendar/' + id, { method: 'DELETE' }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  closeM('viewModal'); toast('已删除'); load();
}
load();
</script>
