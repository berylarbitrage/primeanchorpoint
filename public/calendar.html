<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公司日历 · Prime Anchor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<style>
:root{--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;--g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--blue:#29AAE1;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#eef3f8;color:#1f2937}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:.25rem;border:none;border-radius:8px;padding:.45rem .85rem;font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-red{background:#fff;color:var(--red);border:1px solid #fecaca}.btn-outline{background:#fff;color:var(--g600);border:1px solid var(--g300)}
.btn-sm{padding:.22rem .6rem;font-size:.76rem}
input,textarea,select{padding:.4rem .5rem;border:1px solid var(--g300);border-radius:6px;font-size:.85rem;font-family:inherit;width:100%}
label{font-size:.78rem;color:var(--g600);font-weight:600;display:block;margin:.55rem 0 .2rem}
.muted{color:var(--g500);font-size:.78rem}
.tag{display:inline-block;border-radius:999px;padding:.08rem .55rem;font-size:.72rem;font-weight:700}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--g200);border-left:1px solid var(--g200);margin-top:10px}
.dow{background:#f8fafc;font-size:.74rem;font-weight:700;color:var(--g500);text-align:center;padding:5px 0;border-right:1px solid var(--g200);border-bottom:1px solid var(--g200)}
.day{min-height:104px;border-right:1px solid var(--g200);border-bottom:1px solid var(--g200);padding:4px;background:#fff;cursor:pointer;min-width:0}
.day:hover{background:#f8fbff}
.day.other{background:#fafafa}.day.other .dn{color:var(--g300)}
.day.today .dn{background:#0f4c6b;color:#fff;border-radius:999px;padding:0 6px}
.dn{font-size:.76rem;font-weight:700;color:var(--g600);display:inline-block;margin-bottom:2px}
.ev{display:block;font-size:.72rem;line-height:1.25;border-radius:5px;padding:2px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff}
.ev.pending{background:#fef3c7!important;color:#92400e;border:1px dashed #f59e0b}
.ev.rejected{background:var(--g100)!important;color:var(--g500);text-decoration:line-through}
.pend{border-left:4px solid #f59e0b;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.modal .card{max-width:460px;width:100%;max-height:92vh;overflow:auto}
@media (max-width:640px){.day{min-height:64px;padding:2px}.ev{font-size:0;height:6px;padding:0;margin-top:2px}.dn{font-size:.7rem}}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;background:#eef3f8;display:none;align-items:center;justify-content:center;padding:16px">
  <div class="card" style="max-width:360px;width:100%;text-align:center">
    <div style="font-weight:800;margin-bottom:.6rem">📅 公司日历</div>
    <input id="lu" placeholder="用户名" style="margin-bottom:.5rem">
    <input id="lp" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
    <div id="le" style="color:var(--red);font-size:.8rem;min-height:1.1em;margin-top:.4rem"></div>
    <button class="btn btn-blue" style="width:100%;justify-content:center" onclick="login()">登录</button>
  </div>
</div>
<div class="wrap" id="main" style="display:none">
  <div class="row" style="justify-content:space-between">
    <div><div style="font-size:1.2rem;font-weight:800;color:#0f4c6b">📅 公司日历</div>
      <div class="muted">公司重要的事情。每个人都可以添加，admin 批准后才对所有人显示；还没批准的只有你自己（和 admin）能看到，显示为黄色虚线。</div></div>
    <button class="btn btn-blue" onclick="openEdit(null, todayStr())">＋ 添加事情</button>
  </div>
  <div id="pendBox" style="margin-top:12px"></div>
  <div class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button class="btn btn-outline btn-sm" onclick="shift(-1)">‹</button>
        <div id="monthLbl" style="font-weight:800;font-size:1.05rem;min-width:120px;text-align:center"></div>
        <button class="btn btn-outline btn-sm" onclick="shift(1)">›</button>
        <button class="btn btn-outline btn-sm" onclick="goToday()">今天</button>
      </div>
      <div class="row muted" id="legend"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div style="font-weight:800;margin-bottom:.4rem">本月事项</div>
    <div id="monthList"></div>
  </div>
</div>

<div class="modal" id="viewModal" onclick="if(event.target===this)closeM('viewModal')"><div class="card" id="viewBody"></div></div>
<div class="modal" id="editModal" onclick="if(event.target===this)closeM('editModal')">
  <div class="card">
    <div style="font-weight:800;font-size:1.05rem" id="editTitle">添加事情</div>
    <label>标题 *</label><input id="fTitle" maxlength="200" placeholder="例如：季度报税截止">
    <div class="row" style="flex-wrap:nowrap">
      <div style="flex:1"><label>开始日期 *</label><input id="fStart" type="date"></div>
      <div style="flex:1"><label>结束日期（多天才填）</label><input id="fEnd" type="date"></div>
    </div>
    <div class="row" style="flex-wrap:nowrap">
      <div style="flex:1"><label>时间</label><input id="fTime" maxlength="40" placeholder="例如 10:00 / 全天"></div>
      <div style="flex:1"><label>类别</label><select id="fCat"></select></div>
    </div>
    <label>说明</label><textarea id="fDesc" rows="4" maxlength="2000" placeholder="细节、地点、负责人…"></textarea>
    <div class="muted" id="editHint" style="margin-top:.5rem"></div>
    <div class="row" style="justify-content:flex-end;margin-top:.8rem">
      <button class="btn btn-outline" onclick="closeM('editModal')">取消</button>
      <button class="btn btn-blue" id="saveBtn" onclick="save()">保存</button>
    </div>
  </div>
</div>

<script>
let TOKEN = localStorage.getItem('adminToken') || localStorage.getItem('acct_token') || '';
let D = { events: [], approver: false, me: null };
let CUR = new Date(); CUR.setDate(1);
let EDIT_ID = null;
const CATS = { '': ['一般', '#0E7BB8'], deadline: ['截止日期', '#dc2626'], meeting: ['会议', '#7c3aed'], holiday: ['假期', '#16a34a'], client: ['客户', '#d97706'], payroll: ['发薪 / 财务', '#0f766e'] };
function esc(s) { if (s == null) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML.replace(/"/g, '&quot;'); }
function toast(msg, bad) {
  const t = document.createElement('div'); t.textContent = msg;
  t.style.cssText = `position:fixed;left:50%;top:18px;transform:translateX(-50%);background:${bad ? '#dc2626' : '#16a34a'};color:#fff;padding:.5rem 1rem;border-radius:8px;font-size:.85rem;z-index:3000`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { method: opts.method || 'GET', headers: { ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}), ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { document.getElementById('gate').style.display = 'flex'; document.getElementById('main').style.display = 'none'; throw new Error('请先登录'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}
async function login() {
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('lu').value.trim(), password: document.getElementById('lp').value }) }).then(x => x.json()).catch(() => ({}));
  if (r.mfa_required) { location.href = '/mfa?token=' + encodeURIComponent(r.mfa_token) + '&next=/calendar' + (r.phone_hint ? '&hint=' + encodeURIComponent(r.phone_hint) : ''); return; }
  if (!r.success) { document.getElementById('le').textContent = r.error || '登录失败'; return; }
  TOKEN = r.token; localStorage.setItem('adminToken', TOKEN);
  document.getElementById('gate').style.display = 'none'; load();
}
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const cat = e => CATS[e.category] || CATS[''];
const range = e => e.end_date && e.end_date !== e.start_date ? `${e.start_date} ~ ${e.end_date}` : e.start_date;
const onDay = (e, ds) => ds >= e.start_date && ds <= (e.end_date || e.start_date);
const ST = { pending: ['⏳ 等 admin 批准', '#92400e', '#fef3c7'], approved: ['✅ 已批准', '#166534', '#dcfce7'], rejected: ['✗ 未批准', '#4b5563', '#f3f4f6'] };
const stTag = e => { const [l, c, b] = ST[e.status] || ST.pending; return `<span class="tag" style="background:${b};color:${c}">${l}</span>`; };
const catTag = e => { const [l, c] = cat(e); return `<span class="tag" style="background:${c}1a;color:${c}">${esc(l)}</span>`; };

async function load() {
  let j; try { j = await api('/api/calendar'); } catch (e) { return; }
  document.getElementById('main').style.display = '';
  if (j.error) { toast(j.error, true); return; }
  D = j; render();
}
function shift(n) { CUR.setMonth(CUR.getMonth() + n); render(); }
function goToday() { CUR = new Date(); CUR.setDate(1); render(); }
function render() {
  document.getElementById('legend').innerHTML = Object.values(CATS).map(([l, c]) => `<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${c};margin-right:3px"></span>${esc(l)}</span>`).join(' ');
  const y = CUR.getFullYear(), m = CUR.getMonth();
  document.getElementById('monthLbl').textContent = `${y} 年 ${m + 1} 月`;
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  const today = todayStr();
  // 被拒的只在自己的列表里显示, 不上日历格子
  const shown = D.events.filter(e => e.status !== 'rejected');
  let html = ['日', '一', '二', '三', '四', '五', '六'].map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d);
    const evs = shown.filter(e => onDay(e, ds));
    html += `<div class="day ${d.getMonth() !== m ? 'other' : ''} ${ds === today ? 'today' : ''}" onclick="openEdit(null,'${ds}')">
      <span class="dn">${d.getDate()}</span>
      ${evs.map(e => `<span class="ev ${esc(e.status)}" style="background:${cat(e)[1]}" title="${esc(e.title)}" onclick="event.stopPropagation();view(${e.id})">${e.time ? esc(e.time) + ' ' : ''}${esc(e.title)}</span>`).join('')}
    </div>`;
  }
  document.getElementById('grid').innerHTML = html;

  const mStart = `${y}-${pad(m + 1)}-01`, mEnd = `${y}-${pad(m + 1)}-31`;
  const inMonth = D.events.filter(e => e.start_date <= mEnd && (e.end_date || e.start_date) >= mStart);
  document.getElementById('monthList').innerHTML = inMonth.map(e => `<div class="row" style="padding:.4rem 0;border-top:1px solid var(--g100);cursor:pointer" onclick="view(${e.id})">
      <span style="font-family:monospace;font-size:.8rem;color:var(--g500);min-width:96px">${esc(range(e))}</span>
      <b style="font-size:.88rem">${esc(e.title)}</b>${e.time ? `<span class="muted">${esc(e.time)}</span>` : ''}${catTag(e)}${e.status !== 'approved' ? stTag(e) : ''}
    </div>`).join('') || '<div class="muted">这个月还没有事项</div>';

  // admin: 等批准的列表; 其他人: 自己等批准 / 被拒的
  const pend = D.events.filter(e => e.status === 'pending' || (!D.approver && e.status === 'rejected'));
  document.getElementById('pendBox').innerHTML = pend.length ? `<div class="card">
      <div style="font-weight:800;margin-bottom:.5rem">${D.approver ? `⏳ 等你批准（${pend.length}）` : '我提交的（还没对大家显示）'}</div>
      ${pend.map(e => `<div class="card pend" style="padding:10px 12px${e.status === 'rejected' ? ';border-left-color:var(--g400)' : ''}">
        <div class="row"><b>${esc(e.title)}</b><span class="muted">${esc(range(e))}${e.time ? ' · ' + esc(e.time) : ''}</span>${catTag(e)}${stTag(e)}</div>
        ${e.description ? `<div style="font-size:.82rem;margin-top:.3rem;white-space:pre-wrap">${esc(e.description)}</div>` : ''}
        <div class="muted" style="margin-top:.25rem">${esc(e.created_by_name)} 提交 · ${esc(fmt(e.created_at))}${e.status === 'rejected' && e.note ? ' · admin 备注：' + esc(e.note) : ''}</div>
        <div class="row" style="margin-top:.45rem">
          ${D.approver ? `<input id="note${e.id}" placeholder="备注（可不填）" style="flex:1;min-width:160px;width:auto">
            <button class="btn btn-green btn-sm" onclick="decide(${e.id},true)">✓ 批准</button><button class="btn btn-outline btn-sm" onclick="decide(${e.id},false)">✗ 不批准</button>` : ''}
          <button class="btn btn-outline btn-sm" onclick="openEdit(${e.id})">编辑</button>
          <button class="btn btn-red btn-sm" onclick="del(${e.id})">删除</button>
        </div>
      </div>`).join('')}
    </div>` : '';
}
function fmt(t) { if (!t) return ''; const d = new Date(String(t).includes('T') ? t : String(t).replace(' ', 'T') + 'Z'); return isNaN(d) ? t : d.toLocaleString(); }
function canEdit(e) { return D.approver || e.created_by === D.me; }
function view(id) {
  const e = D.events.find(x => x.id === id); if (!e) return;
  document.getElementById('viewBody').innerHTML = `
    <div class="row" style="justify-content:space-between"><div style="font-weight:800;font-size:1.05rem">${esc(e.title)}</div><button class="btn btn-outline btn-sm" onclick="closeM('viewModal')">✕</button></div>
    <div class="row" style="margin-top:.4rem">${catTag(e)}${stTag(e)}</div>
    <div style="margin-top:.5rem;font-size:.88rem">📅 ${esc(range(e))}${e.time ? ' · ' + esc(e.time) : ''}</div>
    ${e.description ? `<div style="margin-top:.5rem;font-size:.86rem;white-space:pre-wrap;background:#f8fafc;border-radius:8px;padding:.5rem .7rem">${esc(e.description)}</div>` : ''}
    <div class="muted" style="margin-top:.6rem">${esc(e.created_by_name)} 添加${e.decided_by ? ` · ${esc(e.decided_by)} ${e.status === 'approved' ? '批准' : '处理'}` : ''}${e.note ? ' · 备注：' + esc(e.note) : ''}</div>
    ${canEdit(e) ? `<div class="row" style="justify-content:flex-end;margin-top:.8rem">
      ${D.approver && e.status !== 'approved' ? `<button class="btn btn-green btn-sm" onclick="decide(${e.id},true)">✓ 批准</button>` : ''}
      <button class="btn btn-outline btn-sm" onclick="closeM('viewModal');openEdit(${e.id})">编辑</button>
      <button class="btn btn-red btn-sm" onclick="del(${e.id})">删除</button></div>` : ''}`;
  document.getElementById('viewModal').classList.add('show');
}
function closeM(id) { document.getElementById(id).classList.remove('show'); }
function openEdit(id, date) {
  const e = id ? D.events.find(x => x.id === id) : null;
  EDIT_ID = e ? e.id : null;
  document.getElementById('editTitle').textContent = e ? '编辑事情' : '添加事情';
  document.getElementById('fCat').innerHTML = Object.entries(CATS).map(([k, [l]]) => `<option value="${k}">${esc(l)}</option>`).join('');
  document.getElementById('fTitle').value = e ? e.title : '';
  document.getElementById('fStart').value = e ? e.start_date : (date || todayStr());
  document.getElementById('fEnd').value = e ? (e.end_date || '') : '';
  document.getElementById('fTime').value = e ? (e.time || '') : '';
  document.getElementById('fCat').value = e ? (e.category || '') : '';
  document.getElementById('fDesc').value = e ? (e.description || '') : '';
  document.getElementById('editHint').textContent = D.approver ? '你是 admin，保存后直接对所有人显示。' : (e ? '修改后需要 admin 重新批准才会显示。' : '提交后需要 admin 批准才会对所有人显示。');
  document.getElementById('editModal').classList.add('show');
  setTimeout(() => document.getElementById('fTitle').focus(), 50);
}
async function save() {
  const body = { title: document.getElementById('fTitle').value, start_date: document.getElementById('fStart').value, end_date: document.getElementById('fEnd').value,
    time: document.getElementById('fTime').value, category: document.getElementById('fCat').value, description: document.getElementById('fDesc').value };
  if (!body.title.trim() || !body.start_date) return toast('请填写标题和日期', true);
  const btn = document.getElementById('saveBtn'); btn.disabled = true;
  const j = await api(EDIT_ID ? '/api/calendar/' + EDIT_ID : '/api/calendar', { method: EDIT_ID ? 'PUT' : 'POST', body }).catch(e => ({ error: e.message }));
  btn.disabled = false;
  if (j.error) return toast(j.error, true);
  closeM('editModal');
  toast(j.status === 'approved' ? '已保存' : '已提交，等 admin 批准后显示');
  load();
}
async function decide(id, ok) {
  const n = document.getElementById('note' + id);
  const j = await api(`/api/calendar/${id}/decide`, { method: 'POST', body: { approve: ok, note: n ? n.value : '' } }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  closeM('viewModal'); toast(ok ? '已批准，所有人可见' : '已标记为不批准'); load();
}
async function del(id) {
  if (!confirm('删除这件事？')) return;
  const j = await api('/api/calendar/' + id, { method: 'DELETE' }).catch(e => ({ error: e.message }));
  if (j.error) return toast(j.error, true);
  closeM('viewModal'); toast('已删除'); load();
}
load();
</script>
<script src="/account-badge.js" defer></script>
</body>
</html>
