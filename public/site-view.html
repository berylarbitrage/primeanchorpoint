<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡记录查看 · Time Records</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AD%3C/text%3E%3C/svg%3E">
<style>
:root{--blue:#0F2B5B;--green:#2D9D78;--orange:#F5A623;--red:#E63946;--g100:#f2f4f7;--g200:#e2e5ea;--g400:#9BA3B0;--g600:#5F6B7A;--ink:#1a2433}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','DM Sans',sans-serif;background:#FDF9F0;color:var(--ink);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:1.2rem 1rem 3rem}
.hdr{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
h1{font-size:1.25rem;color:var(--blue)}
.sub{font-size:.82rem;color:var(--g600)}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.bar input[type=date]{padding:.5rem .6rem;border:1.5px solid var(--g200);border-radius:10px;font-family:inherit;font-size:.9rem;background:#fff}
.qbtn{padding:.45rem .8rem;border:1.5px solid var(--g200);border-radius:999px;background:#fff;color:var(--g600);font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit}
.qbtn:hover{border-color:var(--blue);color:var(--blue)}
.stats{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}
.stat{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:.7rem 1.1rem;min-width:120px}
.stat b{display:block;font-size:1.3rem;color:var(--orange)}
.stat span{font-size:.75rem;color:var(--g600)}
.tblbox{background:#fff;border:1px solid var(--g200);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{position:sticky;top:0;text-align:left;font-size:.76rem;color:var(--g600);font-weight:700;padding:.7rem .9rem;border-bottom:1.5px solid var(--g200);background:#fff;white-space:nowrap}
td{padding:.65rem .9rem;border-bottom:1px solid var(--g100);font-size:.88rem;white-space:nowrap}
tr:last-child td{border-bottom:none}
.nm{font-weight:700}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.st.open{background:#FFF4DE;color:#B87400}
.st.closed{background:#E8F5E9;color:var(--green)}
.muted{color:var(--g400)}
.err{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:2.5rem 1rem;text-align:center;color:var(--red);font-weight:700}
.foot{margin-top:1.2rem;text-align:center;font-size:.72rem;color:var(--g400)}
@media (max-width:640px){h1{font-size:1.05rem}.stat{min-width:100px;padding:.55rem .8rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <h1 id="siteName">…</h1>
      <div class="sub">打卡记录（只读） · Time Clock Records (view only)</div>
    </div>
    <div class="sub" id="tzNote"></div>
  </div>
  <div class="bar">
    <input type="date" id="dFrom">
    <span class="sub">至 to</span>
    <input type="date" id="dTo">
    <button class="qbtn" onclick="quick(0)">今天 Today</button>
    <button class="qbtn" onclick="quick(6)">近7天 7d</button>
    <button class="qbtn" onclick="quick(29)">近30天 30d</button>
    <button class="qbtn" onclick="load()">↻ 刷新 Refresh</button>
  </div>
  <div class="stats" id="stats" style="display:none">
    <div class="stat"><b id="stN">0</b><span>班次 Shifts</span></div>
    <div class="stat"><b id="stH">0h</b><span>总工时 Total hours</span></div>
    <div class="stat"><b id="stOn">0</b><span>当前在班 On duty</span></div>
  </div>
  <div class="tblbox" id="tblbox" style="display:none">
    <table>
      <thead><tr><th>员工 Employee</th><th>日期 Date</th><th>上班 In</th><th>下班 Out</th><th>休息 Break</th><th>合计 Hours</th><th>状态 Status</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="err" id="errBox" style="display:none"></div>
  <div class="foot">Prime Anchor Workforce · 本页面不含照片等其他信息 / No photos on this page</div>
</div>
<script>
const $ = id => document.getElementById(id);
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let TZ = 'America/Chicago';

// 兼容 ISO(带Z) 与 'YYYY-MM-DD HH:MM:SS'(UTC) 两种存储格式
function pT(s) {
  if (!s) return null;
  const str = String(s);
  const d = new Date(/[zZ]$|[+\-]\d{2}:?\d{2}$/.test(str) ? str : str.replace(' ', 'T') + 'Z');
  return isNaN(d) ? null : d;
}
function fmtD(d) { return d ? d.toLocaleDateString('zh-CN', { timeZone: TZ, month: '2-digit', day: '2-digit' }) : '—'; }
function fmtT(d) { return d ? d.toLocaleTimeString('en-GB', { timeZone: TZ, hour12: false, hour: '2-digit', minute: '2-digit' }) : '—'; }
function esc(s) { return String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c])); }

function quick(days) {
  const now = new Date();
  $('dTo').value = now.toISOString().slice(0, 10);
  $('dFrom').value = new Date(now - days * 86400000).toISOString().slice(0, 10);
  load();
}

async function load() {
  $('errBox').style.display = 'none';
  try {
    const q = new URLSearchParams({ t: TOKEN });
    if ($('dFrom').value) q.set('from', $('dFrom').value);
    if ($('dTo').value) q.set('to', $('dTo').value);
    const r = await fetch('/api/site-view?' + q.toString());
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '加载失败');
    TZ = d.site.timezone || TZ;
    $('siteName').textContent = '🏭 ' + d.site.name + (d.site.code ? ' (' + d.site.code + ')' : '');
    document.title = d.site.name + ' · 打卡记录';
    try {
      const tzn = new Intl.DateTimeFormat('en-US', { timeZone: TZ, timeZoneName: 'short' }).formatToParts(new Date()).find(p => p.type === 'timeZoneName');
      $('tzNote').textContent = '时区 Timezone: ' + (tzn ? tzn.value : TZ);
    } catch (_) { $('tzNote').textContent = ''; }
    if (!$('dFrom').value) $('dFrom').value = d.from;
    if (!$('dTo').value) $('dTo').value = d.to;
    let totalH = 0, onDuty = 0;
    const rowsH = d.entries.map(e => {
      const ci = pT(e.clock_in), co = pT(e.clock_out);
      totalH += e.total_hours || 0;
      const isOpen = e.status === 'open';
      if (isOpen) onDuty++;
      return `<tr>
        <td class="nm">${esc(e.name)}</td>
        <td>${fmtD(ci || co)}</td>
        <td>${fmtT(ci)}</td>
        <td>${isOpen ? '<span class="st open">进行中 on duty</span>' : fmtT(co)}</td>
        <td class="muted">${e.break_minutes ? e.break_minutes + ' min' : (e.break_count ? e.break_count + ' 次' : '—')}</td>
        <td>${e.total_hours ? e.total_hours.toFixed(2) + 'h' : (isOpen ? '—' : '0h')}</td>
        <td><span class="st ${isOpen ? 'open' : 'closed'}">${isOpen ? '上班中' : '完成'}</span></td>
      </tr>`;
    });
    $('tbody').innerHTML = rowsH.join('') || '<tr><td colspan="7" class="muted" style="text-align:center;padding:1.6rem">该时段没有打卡记录 · No records in this period</td></tr>';
    $('stN').textContent = d.entries.length;
    $('stH').textContent = totalH.toFixed(1) + 'h';
    $('stOn').textContent = onDuty;
    $('stats').style.display = '';
    $('tblbox').style.display = '';
  } catch (e) {
    $('stats').style.display = 'none';
    $('tblbox').style.display = 'none';
    $('errBox').style.display = '';
    $('errBox').textContent = '⚠ ' + e.message + ' / Link invalid or disabled';
    $('siteName').textContent = '打卡记录查看';
  }
}
if (!TOKEN) { $('errBox').style.display = ''; $('errBox').textContent = '⚠ 链接无效 / Invalid link'; }
else load();
</script>
</body>
</html>
