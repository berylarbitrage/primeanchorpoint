<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打卡台 Time Clock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B0%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="kiosk-manifest.json">
<meta name="theme-color" content="#0F2B5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--blue:#0F2B5B;--sky:#4A90D9;--green:#2D9D78;--red:#E63946;--orange:#F5A623;--off:#F7F8FA;--gray-200:#e2e5ea;--gray-400:#9BA3B0;--gray-600:#5F6B7A}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','DM Sans',sans-serif;background:var(--blue);color:#fff;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation}
/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.4rem;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:.8rem;min-width:0}
.hdr-left img{width:42px;height:auto;flex-shrink:0}
.hdr-title{font-size:1.05rem;font-weight:700;line-height:1.25}
.hdr-site{font-size:.85rem;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{text-align:right;flex-shrink:0}
.hdr-clock{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1.1}
.hdr-date{font-size:.8rem;color:rgba(255,255,255,.6);margin-top:2px}
.lang-bar{display:flex;gap:.35rem;justify-content:center;padding:.15rem 0 .5rem;flex-shrink:0}
.lang-btn{padding:.28rem .85rem;border:1.5px solid rgba(255,255,255,.35);border-radius:20px;background:transparent;color:rgba(255,255,255,.65);font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit}
.lang-btn.active{background:#fff;color:var(--blue);border-color:#fff}
/* Screens */
.stage{flex:1;display:flex;align-items:safe center;justify-content:center;padding:.4rem 1rem 1.2rem;min-height:0;overflow:auto}
.screen{display:none;width:100%;max-width:540px}
.screen.active{display:block}
/* Screen 1: keypad */
.pw-hint{text-align:center;font-size:1.05rem;font-weight:700;margin-bottom:.9rem}
.pw-dots{display:flex;justify-content:center;gap:.7rem;margin-bottom:.5rem}
.pw-dot{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5);transition:all .12s}
.pw-dot.on{background:#fff;border-color:#fff}
.pw-err{text-align:center;color:#FFB3B9;font-size:.95rem;font-weight:700;min-height:1.4em;margin-bottom:.5rem}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;max-width:400px;margin:0 auto}
.key{padding:0;height:min(11.5vh,84px);border:none;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font-size:2rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .1s}
.key:active{background:rgba(255,255,255,.32)}
.key.fn{font-size:1.25rem;background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:shake .4s}
/* Screen 2: actions */
.who-card{background:#fff;color:#1a2433;border-radius:20px;padding:1.4rem 1.5rem;box-shadow:0 10px 44px rgba(0,0,0,.3)}
.who-name{font-size:1.55rem;font-weight:800;color:var(--blue);text-align:center}
.who-status{text-align:center;font-size:.95rem;color:var(--gray-600);margin:.45rem 0 1.1rem;font-weight:600}
.who-status .on{color:var(--green)}.who-status .brk{color:var(--orange)}.who-status .offd{color:var(--gray-400)}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.act-btn{border:none;border-radius:16px;padding:1.15rem .5rem;font-size:1.15rem;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;display:flex;flex-direction:column;align-items:center;gap:.3rem;opacity:.92;transition:transform .08s}
.act-btn:active{transform:scale(.97)}
.act-btn .ic{font-size:1.7rem}
.act-in{background:var(--green)}.act-out{background:var(--red)}.act-bs{background:var(--orange)}.act-be{background:var(--sky)}
.act-btn.suggest{outline:4px solid #FFD666;outline-offset:2px;opacity:1}
.act-cancel{margin-top:1rem;width:100%;padding:.85rem;border:2px solid var(--gray-200);border-radius:12px;background:#fff;color:var(--gray-600);font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.count-note{text-align:center;color:var(--gray-400);font-size:.78rem;margin-top:.7rem}
/* Screen 3: result */
.res-card{background:#fff;color:#1a2433;border-radius:20px;padding:2rem 1.5rem;text-align:center;box-shadow:0 10px 44px rgba(0,0,0,.3)}
.res-ic{width:96px;height:96px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:3.2rem;margin-bottom:.9rem}
.res-ok .res-ic{background:#E8F5E9;color:var(--green)}
.res-title{font-size:1.5rem;font-weight:800;color:var(--blue)}
.res-name{font-size:1.1rem;color:var(--gray-600);font-weight:700;margin-top:.3rem}
.res-time{font-size:1rem;color:var(--gray-600);margin-top:.55rem;font-variant-numeric:tabular-nums}
.res-note{margin-top:1rem;color:var(--gray-400);font-size:.82rem}
.foot{flex-shrink:0;text-align:center;font-size:.7rem;color:rgba(255,255,255,.35);padding:0 1rem .6rem}
.alt-btn{flex:1;padding:.8rem .4rem;border:1.5px solid rgba(255,255,255,.3);border-radius:14px;background:transparent;color:rgba(255,255,255,.85);font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.alt-btn:active{background:rgba(255,255,255,.15)}
.fp-num{text-align:center;font-size:1.8rem;font-weight:800;letter-spacing:.1em;min-height:2.6rem;margin-bottom:.5rem;font-variant-numeric:tabular-nums}
/* 横屏平板: 左边提示/功能按钮 + 右边数字键盘 两栏排布, 避免竖列溢出跟语言栏挤在一起 */
/* 暗环境补光: 打卡过程整页转为亮白, 屏幕本身当补光灯照亮人脸 */
body.brite{background:#fff;color:var(--blue)}
body.brite .hdr-site,body.brite .hdr-date{color:rgba(15,43,91,.55)}
body.brite .pw-dot{border-color:rgba(15,43,91,.45)}
body.brite .pw-dot.on{background:var(--blue);border-color:var(--blue)}
body.brite .key{background:rgba(15,43,91,.08);color:var(--blue)}
body.brite .key:active{background:rgba(15,43,91,.22)}
body.brite .key.fn{background:rgba(15,43,91,.04);color:rgba(15,43,91,.75)}
body.brite .lang-btn{border-color:rgba(15,43,91,.3);color:rgba(15,43,91,.6)}
body.brite .lang-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
body.brite .alt-btn{border-color:rgba(15,43,91,.3);color:rgba(15,43,91,.78)}
body.brite .alt-btn:active{background:rgba(15,43,91,.1)}
body.brite .pw-err{color:var(--red)}
body.brite .foot{color:rgba(15,43,91,.35)}
body.brite #fsBtn{border-color:rgba(15,43,91,.3);color:rgba(15,43,91,.6)}
body.brite #fpNum{color:rgba(15,43,91,.9)!important}
/* 提交打卡瞬间的全屏白光闪拍层 */
#flashOv{position:fixed;inset:0;background:#fff;z-index:9999;display:none;pointer-events:none}
@media (orientation: landscape) and (max-height: 900px) {
  #scrPw.active, #scrForgot.active{
    display:grid;max-width:880px;column-gap:3.5rem;align-items:center;justify-content:center;
    grid-template-columns:minmax(260px,1fr) minmax(330px,400px);
    grid-template-areas:'hint pad' 'dots pad' 'err pad' 'alt pad';
  }
  #scrPw .pw-hint, #scrForgot .pw-hint{grid-area:hint;font-size:1.2rem;margin-bottom:1rem}
  #scrPw .pw-dots, #scrForgot .fp-num{grid-area:dots;margin-bottom:.8rem}
  #scrPw .pw-err, #scrForgot .pw-err{grid-area:err;margin-bottom:0}
  #scrPw .keypad, #scrForgot .keypad{grid-area:pad;margin:0;width:100%}
  #scrPw .altrow, #scrForgot .altrow{grid-area:alt;margin:1.4rem auto 0;width:100%;max-width:none}
  .key{height:min(14vh,78px);font-size:1.7rem}
  .lang-bar{padding-bottom:.8rem}
}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left">
    <div>
      <div class="hdr-title" id="siteName">…</div>
    </div>
  </div>
  <div class="hdr-right" style="display:flex;align-items:center;gap:.8rem">
    <button id="fsBtn" onclick="goFullscreen()" title="全屏" style="border:1.5px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.7);border-radius:10px;padding:.35rem .6rem;font-size:1rem;cursor:pointer;font-family:inherit">⛶</button>
    <div>
      <div class="hdr-clock" id="clock">--:--:--</div>
      <div class="hdr-date" id="clockDate"></div>
    </div>
  </div>
</div>
<div class="lang-bar">
  <button class="lang-btn" id="kLangZh" onclick="setKLang('zh')">中文</button>
  <button class="lang-btn" id="kLangEn" onclick="setKLang('en')">English</button>
  <button class="lang-btn" id="kLangEs" onclick="setKLang('es')">Español</button>
</div>

<div class="stage">
  <!-- Screen 1: password keypad -->
  <div class="screen active" id="scrPw">
    <div class="pw-hint" id="pwHint">输入您的 8 位打卡密码</div>
    <div class="pw-dots" id="pwDots"></div>
    <div class="pw-err" id="pwErr"></div>
    <div class="keypad" id="keypad">
      <button class="key" onclick="kp('1')">1</button>
      <button class="key" onclick="kp('2')">2</button>
      <button class="key" onclick="kp('3')">3</button>
      <button class="key" onclick="kp('4')">4</button>
      <button class="key" onclick="kp('5')">5</button>
      <button class="key" onclick="kp('6')">6</button>
      <button class="key" onclick="kp('7')">7</button>
      <button class="key" onclick="kp('8')">8</button>
      <button class="key" onclick="kp('9')">9</button>
      <button class="key fn" id="keyClear" onclick="kpClear()">清空</button>
      <button class="key" onclick="kp('0')">0</button>
      <button class="key fn" onclick="kpBack()">⌫</button>
    </div>
    <div class="altrow" style="display:flex;gap:.7rem;max-width:400px;margin:.85rem auto 0">
      <button class="alt-btn" onclick="scanStart()">📷 <span id="lblScan">扫码打卡</span></button>
      <button class="alt-btn" onclick="forgotStart()">❓ <span id="lblForgot">忘记密码</span></button>
    </div>
  </div>

  <!-- Screen: QR scan punch -->
  <div class="screen" id="scrScan">
    <div style="text-align:center">
      <div class="pw-hint" id="scanHint">将您的打卡二维码对准摄像头</div>
      <video id="scanVid" autoplay playsinline muted style="width:min(92vw,420px);height:min(52vh,320px);object-fit:cover;border-radius:18px;background:#0b1f42"></video>
      <div class="pw-err" id="scanErr" style="margin-top:.5rem"></div>
      <button class="act-cancel" style="max-width:420px" id="btnScanCancel" onclick="scanStop(true)">取消</button>
    </div>
  </div>

  <!-- Screen: forgot password (phone lookup) -->
  <div class="screen" id="scrForgot">
    <div class="pw-hint" id="fpHint">输入手机号（美国 10 位；其他国家含国家代码）</div>
    <div class="fp-num" id="fpNum"></div>
    <div class="pw-err" id="fpErr"></div>
    <div class="keypad">
      <button class="key" onclick="fp('1')">1</button>
      <button class="key" onclick="fp('2')">2</button>
      <button class="key" onclick="fp('3')">3</button>
      <button class="key" onclick="fp('4')">4</button>
      <button class="key" onclick="fp('5')">5</button>
      <button class="key" onclick="fp('6')">6</button>
      <button class="key" onclick="fp('7')">7</button>
      <button class="key" onclick="fp('8')">8</button>
      <button class="key" onclick="fp('9')">9</button>
      <button class="key fn" id="fpKeyClear" onclick="fpClear()">清空</button>
      <button class="key" onclick="fp('0')">0</button>
      <button class="key fn" onclick="fpBack()">⌫</button>
    </div>
    <div class="altrow" style="display:flex;gap:.7rem;max-width:400px;margin:.85rem auto 0">
      <button class="act-cancel" style="margin:0;flex:1" id="btnFpCancel" onclick="resetToPw()">取消</button>
      <button id="btnFpGo" onclick="fpSubmit()" disabled style="flex:1.2;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;opacity:.5">发送</button>
    </div>
  </div>

  <!-- Screen: forgot result (SMS sent / register QR) -->
  <div class="screen" id="scrFRes">
    <div class="res-card" id="fresCard"></div>
  </div>

  <!-- Screen 2: choose action -->
  <div class="screen" id="scrAct">
    <div class="who-card">
      <div class="who-name" id="whoName"></div>
      <div class="who-status" id="whoStatus"></div>
      <button class="act-btn act-in" id="btnPunch" onclick="doPunchNow()" style="width:100%;font-size:1.6rem;padding:1.6rem .5rem"><span class="ic">👆</span><span id="lblPunch">打卡</span></button>
      <button class="act-cancel" id="btnCancel" onclick="resetToPw()">取消</button>
      <div class="count-note" id="actCount"></div>
    </div>
  </div>

  <!-- Screen 3: result -->
  <div class="screen" id="scrRes">
    <div class="res-card res-ok">
      <div class="res-ic" id="resIc">✓</div>
      <div class="res-title" id="resTitle"></div>
      <div class="res-name" id="resName"></div>
      <div class="res-time" id="resTime"></div>
      <div class="res-note" id="resNote"></div>
    </div>
  </div>
</div>
<!-- 打卡留档拍照: 摄像头页面打开即常驻(装机时授权一次), 静默抓拍, 照片仅后台打卡记录可见 -->
<!-- 视频元素留在屏幕内 2px 大小（近乎不可见）: 完全移出屏幕/opacity:0 时安卓 Chrome 会停止渲染帧, 抓到全黑 -->
<video id="camVid" autoplay playsinline muted style="position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none"></video>
<div id="flashOv"></div>
<div class="foot"></div>

<script>
// 客户端报错上报 (独立 script 块: 主脚本哪怕整体解析失败也能上报) —— 平板上出问题
// 没法接调试器, 全靠服务器日志里的 [kiosk-client-error] 远程诊断
window.addEventListener('error', function (e) {
  try {
    fetch('/api/kiosk/client-error', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        site: new URLSearchParams(location.search).get('site') || '',
        msg: String((e && e.message) || '').slice(0, 300),
        src: (String((e && e.filename) || '').slice(0, 200)) + ':' + ((e && e.lineno) || 0),
        ua: String(navigator.userAgent || '').slice(0, 200)
      }) }).catch(function () {});
  } catch (_) {}
});
</script>

const ERR_MAP = {
  '打卡密码错误或员工已离职': { en: 'Wrong password, or employee is no longer active', es: 'Contraseña incorrecta o empleado inactivo' },
  '打卡密码为 8 位数字': { en: 'Password must be 8 digits', es: 'La contraseña debe tener 8 dígitos' },
  '尝试次数过多，请 15 分钟后再试': { en: 'Too many attempts. Try again in 15 minutes', es: 'Demasiados intentos. Intente en 15 minutos' },

  '缺少必要参数': { en: 'Missing parameters', es: 'Faltan parámetros' },

let _kl = localStorage.getItem('kiosk_lang') || 'zh';
let _pw = '';
let _pwLocked = false;     // true while a status request is in flight
let _actTimer = null, _actLeft = 0;
let _resTimer = null;

const $ = id => document.getElementById(id);
// 记住仓库: 从主屏幕图标打开(没有 ?site=)时沿用上次的仓库
const _siteParam = new URLSearchParams(location.search).get('site') || '';

// ── 扫码打卡: 员工把自己的打卡二维码对准摄像头, 内容等同 8 位密码 ──
// 复用常驻的打卡摄像头流, 扫码屏只是把它显示出来
let _scanning = false, _scanTimer = null, _jsqrLoading = null;
function _loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  if (_jsqrLoading) return _jsqrLoading;
  _jsqrLoading = new Promise((ok, bad) => {
    const s = document.createElement('script');
    s.src = '/js/jsqr.min.js';
    s.onload = ok; s.onerror = () => { _jsqrLoading = null; bad(new Error('QR 组件加载失败')); };
    document.head.appendChild(s);
  });
  return _jsqrLoading;
}
async function scanStart() {
  briteAuto();
  showScr('scrScan');
  $('scanErr').textContent = '';
  await camStart();
  if (!_camStream) { $('scanErr').textContent = KL[_kl].scanNoCam; return; }
  $('scanVid').srcObject = _camStream;
  _scanning = true;
  let detector = null;
  if ('BarcodeDetector' in window) {
    try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (_) {}
  }
  if (!detector) { try { await _loadJsQR(); } catch (e) { $('scanErr').textContent = e.message; return; } }
  const cvs = document.createElement('canvas');
  const tickScan = async () => {
    if (!_scanning) return;
    const v = $('scanVid');
    if (v.videoWidth) {
      try {
        let text = '';
        if (detector) {
          const codes = await detector.detect(v);
          if (codes && codes.length) text = codes[0].rawValue || '';
        } else {
          const w = 480, h = Math.round(v.videoHeight * (w / v.videoWidth)) || 360;
          cvs.width = w; cvs.height = h;
          const ctx = cvs.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(v, 0, 0, w, h);
          const img = ctx.getImageData(0, 0, w, h);
          const r = window.jsQR(img.data, w, h);
          if (r && r.data) text = r.data;
        }
        if (text && handleScanCode(text)) return; // 有效码 → 结束扫描
        if (text) $('scanErr').textContent = KL[_kl].scanBadQr; // 无效码 → 提示并继续扫
      } catch (_) {}
    }
    _scanTimer = setTimeout(tickScan, 250);
  };
  tickScan();
}
// 有效的打卡二维码 (PAWTC:12345678 或纯 8 位数字) → 当作密码走原有流程
function handleScanCode(text) {
  const m = /^(?:PAWTC:)?(\d{8})$/.exec(String(text || '').trim());
  if (!m) return false;
  scanStop();
  _pw = m[1]; renderDots();
  showScr('scrPw');
  checkPw();
  return true;
}
function scanStop(backToPw) {
  clearTimeout(_scanTimer); _scanTimer = null;
  _scanning = false;
  $('scanVid').srcObject = null; // 只是不再显示, 摄像头流保持常驻供打卡抓拍
  if (backToPw) resetToPw();
}

// ── 忘记密码: 输手机号 → 短信发密码+二维码; 未登记 → 显示注册二维码 ──
let _fp = '', _fpBusy = false;
function forgotStart() { briteAuto(); _fp = ''; _fpBusy = false; renderFpNum(); $('fpErr').textContent = ''; showScr('scrForgot'); }
function renderFpNum() {
  const el = $('fpNum');
  el.textContent = _fp || '···';
  el.style.color = _fp ? '#fff' : 'rgba(255,255,255,.35)';
  const ok = _fp.length >= 7;
  const go = $('btnFpGo');
  go.disabled = !ok; go.style.opacity = ok ? '1' : '.5';
}
function fp(d) { if (_fpBusy || _fp.length >= 15) return; $('fpErr').textContent = ''; _fp += d; renderFpNum(); }
function fpBack() { if (_fpBusy) return; _fp = _fp.slice(0, -1); renderFpNum(); $('fpErr').textContent = ''; }
function fpClear() { if (_fpBusy) return; _fp = ''; renderFpNum(); $('fpErr').textContent = ''; }
async function fpSubmit() {
  if (_fpBusy || _fp.length < 7) return;
  _fpBusy = true;
  $('fpErr').textContent = KL[_kl].checking;
  try {
    const r = await _fetchT('/api/kiosk/forgot', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ site_id: _siteId, phone: _fp }) }, 20000);

}
function showFResFound(d) {

    <button class="act-cancel" onclick="resetToPw()">${t.fpOk}</button>`;
  showScr('scrFRes');

}

// ── 前置摄像头：页面打开即常驻（装机时授权一次），打卡瞬间抓一帧随打卡上传 ──
let _camStream = null, _camStarting = null, _imageCapture = null;
function camStart() {
  if (_camStream) return Promise.resolve();
  if (_camStarting) return _camStarting;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve();
  _camStarting = navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
    .then(s => {
      _camStream = s;
      const tr = s.getVideoTracks()[0];
      if (tr) tr.addEventListener('ended', () => { _camStream = null; _imageCapture = null; });
      // ImageCapture 直接从摄像头轨道抓帧, 不依赖隐藏 video 元素的渲染 (安卓黑帧问题)
      try { _imageCapture = ('ImageCapture' in window && tr) ? new ImageCapture(tr) : null; } catch (_) { _imageCapture = null; }
      $('camVid').srcObject = s;
    })
    .catch(() => { _camStream = null; })
    .finally(() => { _camStarting = null; });
  return _camStarting;
}
// 画到 canvas 并标记是否为暗帧。暗帧不丢弃 (夜间/暗环境的真实画面亮度也很低,
// 丢了会导致整条记录没照片) —— 只用于「优先选亮帧」的偏好, 拍不到亮的就用暗的。
function _frameToCanvas(src, sw, sh) {
  const w = 640, h = Math.round(sh * (w / sw)) || 480;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(src, 0, 0, w, h);
  c.isDark = false; c.lum = 128;
  try {
    const d = ctx.getImageData(0, 0, w, h).data;
    let sum = 0, n = 0;
    for (let i = 0; i < d.length; i += 4 * 101) { sum += d[i] + d[i + 1] + d[i + 2]; n += 3; }
    if (n) { c.lum = sum / n; c.isDark = c.lum < 4; }
  } catch (_) {}
  return c;
}
async function camGrabCanvas() {
  if (!_camStream) return null;
  if (_imageCapture) {
    try {
      // grabFrame 在部分安卓设备上会挂起不返回 → 900ms 超时, 退回隐藏 video 抓帧
      const bm = await Promise.race([
        _imageCapture.grabFrame(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('grab timeout')), 900))
      ]);
      const c = _frameToCanvas(bm, bm.width, bm.height);
      if (bm.close) bm.close();
      if (c) return c;
    } catch (_) {}
  }
  try {
    const v = $('camVid');
    if (!v.videoWidth) return null;
    return _frameToCanvas(v, v.videoWidth, v.videoHeight);
  } catch (_) { return null; }
}
async function camShot() {
  const c = await camGrabCanvas();
  return c ? c.toDataURL('image/jpeg', 0.7) : null;
}
// 三连拍: 打卡时把滚动缓存里最近 3 帧 (约跨 3 秒) 横向拼成一张, 方便辨认是谁
let _recentShots = [];
function camComposite() {
  const shots = _recentShots.slice(-3);
  if (!shots.length) return null;
  if (shots.length === 1) return shots[0].toDataURL('image/jpeg', 0.7);
  const fw = 440;
  const fh = Math.round(shots[0].height * (fw / shots[0].width)) || 330;
  const c = document.createElement('canvas');
  c.width = fw * shots.length; c.height = fh;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
  shots.forEach((s, i) => ctx.drawImage(s, i * fw, 0, fw, fh));
  return c.toDataURL('image/jpeg', 0.72);
}
// 打卡瞬间取一帧; 优先等一张亮帧, 超时就用最后抓到的帧 (哪怕偏暗), 保证有照片
async function camShotWait(maxMs) {
  const t0 = Date.now();
  camStart();
  let last = null;
  while (Date.now() - t0 < (maxMs || 1200)) {
    const c = await camGrabCanvas();
    if (c) { last = c; if (!c.isDark) break; }
    await new Promise(r2 => setTimeout(r2, 150));
  }
  return last ? last.toDataURL('image/jpeg', 0.7) : null;
}
// ── 暗环境补光: 光线不足时把屏幕本身当补光灯 ──
// 1) 开始打卡 (按第一个数字/进扫码屏) 就把整页切成亮白「补光模式」, 预拍缓存里的帧都是被照亮的
// 2) 提交打卡瞬间若画面仍偏暗, 全屏白光 ~0.6s 内闪拍 3 帧替换缓存, 保证照片能辨认
function _envDark() {
  const last = _recentShots[_recentShots.length - 1];
  return !last || last.lum < 50;
}
function briteSet(on) {
  document.body.classList.toggle('brite', !!on);
  // Fully Kiosk Browser: 顺便把系统屏幕亮度拉满 (普通浏览器无此 API, 忽略)
  if (on) { try { if (typeof fully !== 'undefined' && fully.setScreenBrightness) fully.setScreenBrightness(255); } catch (_) {} }
}
function briteAuto() { if (_envDark()) briteSet(true); }
async function camFlashShots() {
  const ov = $('flashOv');
  ov.style.display = 'block';
  // 兜底: 无论中途发生什么, 白光层最多 4 秒必然消失, 绝不挡住屏幕
  const wd = setTimeout(() => { ov.style.display = 'none'; }, 4000);
  try {
    await new Promise(r2 => setTimeout(r2, 260)); // 等屏幕点亮 + 摄像头曝光适应
    for (let i = 0; i < 3; i++) {
      const c = await camGrabCanvas();
      if (c) { _recentShots.push(c); if (_recentShots.length > 3) _recentShots.shift(); }
      if (i < 2) await new Promise(r2 => setTimeout(r2, 170));
    }
  } finally { clearTimeout(wd); ov.style.display = 'none'; }
}
function xerr(msg) {
  if (_kl !== 'zh' && ERR_MAP[msg] && ERR_MAP[msg][_kl]) return ERR_MAP[msg][_kl];
  return msg;
}

// Live clock
(function tick() {

  $('clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
  $('clockDate').textContent = now.toLocaleDateString(_kl === 'zh' ? 'zh-CN' : _kl === 'es' ? 'es-MX' : 'en-US',
    { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });

})();

// Site name
(async function () {
  if (!_siteId) { $('siteName').textContent = '⚠ missing ?site='; return; }
  try {
    const r = await fetch('/api/checkin/site-info?site=' + encodeURIComponent(_siteId));
    const d = await r.json();
    $('siteName').textContent = d && d.name ? d.name + (d.code ? ' (' + d.code + ')' : '') : '⚠';
    if (d && d.name) document.title = d.name + ' — 打卡台 Time Clock';
  } catch (_) { $('siteName').textContent = '⚠'; }

// ── Screen switching ──
function showScr(id) {

  $(id).classList.add('active');
}
function resetToPw() {
  clearInterval(_actTimer); clearTimeout(_resTimer);
  scanStop();
  _pw = ''; _pwLocked = false; _fp = ''; _fpBusy = false;
  renderDots(); $('pwErr').textContent = '';
  briteSet(false);

}

// ── Keypad ──
function renderDots() {
  $('pwDots').innerHTML = Array.from({ length: 8 }, (_, i) =>
    `<span class="pw-dot${i < _pw.length ? ' on' : ''}"></span>`).join('');
}
renderDots();
function kp(d) {
  if (_pwLocked || _pw.length >= 8) return;
  if (!_pw) briteAuto(); // 开始输密码就检查光线, 暗则立即切补光模式照亮人脸
  $('pwErr').textContent = '';
  _pw += d; renderDots();
  if (_pw.length === 8) checkPw();
}
function kpBack() { if (_pwLocked) return; _pw = _pw.slice(0, -1); renderDots(); $('pwErr').textContent = ''; }
function kpClear() { if (_pwLocked) return; _pw = ''; renderDots(); $('pwErr').textContent = ''; }
// 实体键盘（有些平板接了键盘）也能用；忘记密码屏同样支持
document.addEventListener('keydown', e => {
  const pwActive = $('scrPw').classList.contains('active');
  const fpActive = $('scrForgot').classList.contains('active');
  if (!pwActive && !fpActive) return;
  const h = pwActive ? { d: kp, b: kpBack, c: kpClear } : { d: fp, b: fpBack, c: fpClear };
  if (/^[0-9]$/.test(e.key)) h.d(e.key);
  else if (e.key === 'Backspace') h.b();
  else if (e.key === 'Escape') h.c();
  else if (e.key === 'Enter' && fpActive) fpSubmit();
});

// 请求卡死 (网络断/服务器重启中) 时 fetch 可能永远不返回, _pwLocked 一直为 true
// 键盘就再也点不动了 —— 所有请求都必须带超时, 保证键盘总能恢复
function _fetchT(url, opts, ms) {
  const ac = ('AbortController' in window) ? new AbortController() : null;
  const t = setTimeout(() => { try { if (ac) ac.abort(); } catch (_) {} }, ms || 12000);
  const o = Object.assign({}, opts);
  if (ac) o.signal = ac.signal;
  return fetch(url, o)
    .catch(e => { throw (e && /abort/i.test(e.name || '')) ? new Error(KL[_kl].errReq) : e; })
    .finally(() => clearTimeout(t));
}
async function checkPw() {
  _pwLocked = true;
  $('pwErr').textContent = KL[_kl].checking;
  // 兜底: 就算 fetch 连 abort 都不响应, 15 秒后也强制解锁键盘
  const wd = setTimeout(() => {
    if (_pwLocked) { _pwLocked = false; _pw = ''; renderDots(); $('pwErr').textContent = KL[_kl].errReq; }
  }, 15000);
  try {
    const r = await _fetchT('/api/kiosk/status', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ site_id: _siteId, password: _pw })
    }, 10000);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || KL[_kl].errReq);
    _pwLocked = false;
    $('pwErr').textContent = '';
    buildActScreen(d);
  } catch (e) {
    _pwLocked = false; _pw = ''; renderDots();
    $('pwErr').textContent = xerr(e.message);
    const pad = $('keypad'); pad.classList.remove('shake'); void pad.offsetWidth; pad.classList.add('shake');
  } finally { clearTimeout(wd); }
}

// ── Action screen ──
function buildActScreen(d) {
  const t = KL[_kl];
  $('whoName').textContent = '👋 ' + d.name;
  let st;
  if (!d.clocked_in) st = `<span class="offd">● ${t.stOff}</span>`;
  else if (d.on_break) st = `<span class="brk">● ${t.stBrk}</span>`;
  else st = `<span class="on">● ${t.stOn(d.clock_in_time || '')}</span>`;
  $('whoStatus').innerHTML = st;
  // 只有一个「打卡」按钮: 上班还是下班由系统按当前状态自动判断, 不在按钮上区分
  _punchType = d.clocked_in ? 'out' : 'in';
  showScr('scrAct');
  camStart();
  // 无操作自动返回，避免下一位员工看到上一位的信息
  clearInterval(_actTimer);
  _actLeft = 30;
  $('actCount').textContent = t.actCount(_actLeft);
  _actTimer = setInterval(() => {
    _actLeft--;
    if (_actLeft <= 0) return resetToPw();
    $('actCount').textContent = t.actCount(_actLeft);
  }, 1000);
}

let _punching = false, _punchType = 'in';
async function doPunchNow() {
  if (_punching) return;
  _punching = true;
  clearInterval(_actTimer);
  const btn = $('btnPunch');
  btn.style.opacity = '.6';
  try {
    // 光线仍不足 (缓存帧偏暗/缓存空) → 全屏白光闪拍 3 帧替换缓存, 保证暗环境照片可辨认
    if (_envDark()) { await camStart(); await camFlashShots(); }
    // 最近 3 帧拼成三连拍零等待; 极少数缓存还空时短暂等一下 (最多 1.2s), 保证记录带照片
    const photo = camComposite() || await camShotWait(1200);
    const r = await _fetchT('/api/kiosk/punch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ site_id: _siteId, password: _pw, punch_type: _punchType, photo_data: photo })
    }, 20000);
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || KL[_kl].errReq);
    showResult(d);
  } catch (e) {
    $('whoStatus').innerHTML = '<span style="color:var(--red)">' + xerr(e.message) + '</span>';
    buildCountRestart();
  } finally {
    _punching = false;
    btn.style.opacity = '';
  }
}
function buildCountRestart() {
  clearInterval(_actTimer);
  _actLeft = 15;
  _actTimer = setInterval(() => { if (--_actLeft <= 0) resetToPw(); }, 1000);
}

// ── Result screen ──

  $('resIc').textContent = icons[d.action] || '✓';
  $('resTitle').textContent = t.resTitle[d.action] || d.action;

setKLang(_kl);
// ── 自动更新: 平板上页面常开不刷新, 部署新版后永远跑旧代码 → 定时对比服务器版本, 空闲时自动刷新 ──
let _pageVer = null;
async function _verCheck() {
  try {
    const d = await (await fetch('/api/kiosk/version')).json();
    if (!d || !d.v) return;
    if (_pageVer === null) { _pageVer = d.v; return; } // 首次记录自己加载的版本
    if (d.v !== _pageVer && $('scrPw').classList.contains('active') && !_pw && !_punching && !_scanning) {
      location.reload();
    }
  } catch (_) {}
}
_verCheck();
setInterval(_verCheck, 5 * 60 * 1000);
camStart(); // 页面打开即申请摄像头: 装机时授权一次, 之后打卡抓拍/扫码即刻可用
// 全程每秒滚动预拍并保留最近 3 帧: 任何时刻点打卡, 立即拼出三连拍 (专用打卡平板, 开销可忽略)
setInterval(async () => {
  if (document.hidden || _punching) return;
  const c = await camGrabCanvas();
  if (c) { _recentShots.push(c); if (_recentShots.length > 3) _recentShots.shift(); }
}, 1000);

// ── 电池管理: 每 2 分钟上报电量, 服务器按阈值控制智能插座充/停 ──
(async function batteryLoop() {
  if (!navigator.getBattery || !_siteId) return;
  try {
    const b = await navigator.getBattery();
    const report = () => fetch('/api/kiosk/battery', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ site_id: _siteId, level: Math.round(b.level * 100), charging: b.charging })
    }).catch(() => {});
    report();
    setInterval(report, 120000);
    b.addEventListener('levelchange', report);
  } catch (_) {}
})();
</script>
