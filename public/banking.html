<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>银行对账</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<style>
  :root{
    --amber:#b45309;--amber-deep:#92400e;--amber-100:#fef3c7;--amber-50:#fffbeb;--amber-soft:#fde68a;
    --bg:#f8f4ea;--card:#ffffff;--ink:#292524;--red:#c5221f;--green:#047857;--green-bright:#059669;
    --gray-50:#fafaf9;--gray-100:#f4f4f2;--gray-200:#e7e5e4;--gray-300:#d6d3d1;--gray-400:#a8a29e;
    --gray-500:#78716c;--gray-600:#57534e;--white:#fff;
    --radius:14px;--shadow:0 1px 2px rgba(41,37,36,.05),0 4px 16px rgba(41,37,36,.05)}
  *{box-sizing:border-box;margin:0}
  body{font-family:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  ::selection{background:var(--amber-100)}
  .top{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--gray-200);padding:12px 20px;display:flex;
    align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .top h1{font-size:1.08rem;color:var(--amber);letter-spacing:.2px}
  .btn{border:1px solid var(--gray-200);background:var(--white);border-radius:999px;padding:7px 16px;
    font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;color:var(--gray-600);
    transition:background .15s,border-color .15s,transform .15s;box-shadow:0 1px 2px rgba(41,37,36,.04)}
  .btn:hover{background:var(--gray-50);border-color:var(--gray-300);transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,#d97706,var(--amber));border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(180,83,9,.3)}
  .btn.primary:hover{background:linear-gradient(135deg,var(--amber),var(--amber-deep))}
  .btn.sm{padding:4px 12px;font-size:.72rem}
  .btn:disabled{opacity:.55;cursor:default;transform:none}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
  /* 账户小卡：放在交易表下面右下角, 不占页面头部空间 */
  .cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:16px 0 0}
  .acct{background:var(--card);border:1px solid var(--gray-200);border-radius:12px;padding:9px 14px 9px 15px;
    box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s;position:relative;overflow:hidden;min-width:190px}
  .acct::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#f59e0b,var(--amber))}
  .acct:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(41,37,36,.1)}
  .acct .bank{font-size:.68rem;color:var(--gray-500);font-weight:600;letter-spacing:.3px}
  .acct .nm{font-weight:800;font-size:.8rem;margin:2px 0}
  .acct .bal{font-size:1.05rem;font-weight:800;color:var(--green);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .acct .sub{font-size:.68rem;color:var(--gray-400);margin-top:1px}
  /* 筛选工具条 */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px;background:var(--card);
    border:1px solid var(--gray-200);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow)}
  .filters input,.filters select{border:1px solid var(--gray-200);border-radius:9px;padding:7px 10px;
    font-size:.8rem;font-family:inherit;background:var(--gray-50);color:var(--ink);transition:border-color .15s,box-shadow .15s}
  .filters input:focus,.filters select:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15);background:#fff}
  .note{font-size:.78rem;color:var(--gray-500);margin:10px 4px}
  /* 交易表 */
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--gray-200);font-size:.8rem;box-shadow:var(--shadow)}
  th{background:var(--gray-50);text-align:left;padding:10px 12px;font-size:.7rem;color:var(--gray-500);font-weight:700;
    letter-spacing:.5px;border-bottom:1px solid var(--gray-200)}
  td{padding:9px 12px;border-top:1px solid var(--gray-100);vertical-align:middle}
  table tr:hover td{background:#fffdf5}
  .amt-in{color:var(--green-bright);font-weight:700;font-variant-numeric:tabular-nums}
  .amt-out{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  /* 分类徽章 */
  .cat-b{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.68rem;font-weight:600;white-space:nowrap;
    background:var(--gray-100);color:var(--gray-500)}
  .cat-in{background:#ecfdf5;color:#047857}
  .cat-tin{background:#f0fdfa;color:#0f766e}
  .cat-tout{background:#eff6ff;color:#1d4ed8}
  .cat-loan{background:#faf5ff;color:#7e22ce}
  .cat-fee{background:#fffbeb;color:#b45309}
  .cat-gov{background:#f1f5f9;color:#475569}
  /* 分组头（按周/按月） */
  .grp-head td{background:linear-gradient(90deg,#fef3c7,#fdf6e3);cursor:pointer;font-size:.78rem;padding:9px 12px;
    border-top:1px solid var(--amber-soft);user-select:none;white-space:nowrap}
  .grp-head:hover td{background:linear-gradient(90deg,#fde68a,#fef3c7)}
  .grp-arrow{display:inline-block;font-size:.6rem;color:var(--amber);width:14px}
  .grp-chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.7rem;font-weight:700;background:rgba(255,255,255,.75);
    font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--gray-400);padding:60px 0;font-size:.88rem}
  .setup{background:var(--card);border:1px solid var(--gray-200);border-radius:var(--radius);padding:18px;line-height:1.9;
    font-size:.85rem;box-shadow:var(--shadow)}
  .setup code{background:var(--gray-100);border-radius:6px;padding:2px 6px;font-size:.78rem}
  #gate{max-width:340px;margin:90px auto;background:var(--card);border:1px solid var(--gray-200);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
  #gate input{width:100%;border:1px solid var(--gray-200);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:8px;font-family:inherit;background:var(--gray-50)}
  #gate input:focus{outline:none;border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15);background:#fff}
  .err{color:var(--red);font-size:.8rem;margin-top:8px}
  .hint{font-size:.74rem;color:var(--gray-400)}
  /* ── 交易标注抽屉（复刻后台银行账单的标注面板）── */
  #annBackdrop{position:fixed;inset:0;background:rgba(41,37,36,.28);z-index:55;display:none}
  #annBackdrop.open{display:block}
  #annDrawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--card);border-left:1px solid var(--gray-200);
    box-shadow:-12px 0 40px rgba(41,37,36,.18);z-index:60;display:none;flex-direction:column}
  #annDrawer.open{display:flex}
  #annHead{padding:12px 16px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,#fffbeb,#fff)}
  #annBody{flex:1;overflow:auto;padding:12px 14px}
  .ann-add{border:1px dashed var(--gray-300);background:transparent;border-radius:999px;padding:3px 11px;font-size:.72rem;
    color:var(--gray-400);cursor:pointer;font-family:inherit;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
  .ann-add:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-50)}
  .ann-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;
    border-radius:999px;padding:3px 11px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;max-width:190px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .15s}
  .ann-chip:hover{background:#dbeafe}
  #annToast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:none;background:#16a34a;color:#fff;
    padding:8px 18px;border-radius:10px;font-size:.82rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #annLightbox{position:fixed;inset:0;z-index:98;background:rgba(15,23,42,.85);display:none;align-items:center;justify-content:center;cursor:zoom-out}
  #annLightbox img{max-width:92vw;max-height:92vh;border-radius:8px}
  #annLightbox iframe{width:92vw;height:92vh;border:none;background:#fff;border-radius:8px}
  @media (max-width:640px){ .wrap{padding:12px 8px 60px} td,th{padding:8px 8px} }
</style>
</head>
<body>

<div id="gate" style="display:none">
  <h1 style="color:var(--amber);font-size:1.1rem">🏦 银行对账</h1>
  <input id="user" placeholder="用户名（仅管理员）">
  <input id="pw" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')login()">
  <div class="err" id="gateErr"></div>
  <button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">登录</button>
</div>

<div id="app" style="display:none">
  <div class="top">
    <h1>🏦 银行对账</h1>
    <span class="hint" id="envTag"></span>
    <div style="flex:1"></div>
    <button class="btn" id="whBtn" onclick="testWebhook()" style="display:none">📡 测试 Webhook</button>
    <button class="btn" id="syncBtn" onclick="syncNow()">🔄 同步交易</button>
    <button class="btn primary" onclick="connectBank()">➕ 连接银行</button>
  </div>
  <div class="wrap">
    <div id="setupBox" style="display:none" class="setup"></div>
    <div class="filters">
      <input type="date" id="fStart" onchange="loadTxns()">
      <span class="hint">到</span>
      <input type="date" id="fEnd" onchange="loadTxns()">
      <select id="fAcct" onchange="loadTxns()"><option value="">全部账户</option></select>
      <select id="fView" onchange="localStorage.setItem('bankTxnView', this.value); loadTxns()">
        <option value="flat">按笔显示</option>
        <option value="week">按周显示</option>
        <option value="month">按月显示</option>
      </select>
      <select id="fCat" onchange="loadTxns()"><option value="">全部分类</option></select>
      <input id="fQ" placeholder="搜描述 / 商户 / 分类…" oninput="qDebounce()" style="flex:1;min-width:160px">
      <a class="btn" id="csvBtn" href="#">⬇ 导出 CSV 给会计</a>
    </div>
    <div class="note" id="sumLine"></div>
    <div id="txns"></div>
    <div class="cards" id="accounts"></div>
  </div>
</div>

<div id="annBackdrop" onclick="annClose()"></div>
<div id="annDrawer">
  <div id="annHead">
    <div style="flex:1;min-width:0">
      <div style="font-weight:800;font-size:.88rem">🧾 交易标注</div>
      <div id="annTxnInfo" class="hint" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
    </div>
    <span id="bsEdStatus" class="hint"></span>
    <button class="btn sm" onclick="annClose()">✕ 关闭</button>
  </div>
  <div id="annBody"></div>
</div>
<div id="annToast"></div>
<div id="annLightbox" onclick="this.style.display='none';this.innerHTML=''"></div>

<script>
let TOKEN = localStorage.getItem('adminToken') || '';
let ACCTS = [], qTimer = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(v, cur){ if (v == null) return '—';
  return (v < 0 ? '-' : '') + '$' + Math.abs(v).toFixed(2) + (cur && cur !== 'USD' ? ' ' + cur : ''); }

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Authorization': 'Bearer ' + TOKEN, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
    body: opts.body
  });
  const j = await res.json().catch(() => ({}));
  if (res.status === 401) { showGate('登录已过期'); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}
function showGate(msg){ document.getElementById('gate').style.display=''; document.getElementById('app').style.display='none';
  if (msg) document.getElementById('gateErr').textContent = msg; }

async function login() {
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username: document.getElementById('user').value.trim(), password: document.getElementById('pw').value })
  }).then(x=>x.json()).catch(()=>({}));
  if (r.mfa_required) { location.href = '/mfa?token=' + encodeURIComponent(r.mfa_token || '') + '&next=' + encodeURIComponent(location.pathname + location.search); return; }
  if (!r.success) { document.getElementById('gateErr').textContent = r.error || '登录失败'; return; }
  if (r.role !== 'admin') { document.getElementById('gateErr').textContent = '银行数据只有管理员能看'; return; }
  TOKEN = r.token; localStorage.setItem('adminToken', TOKEN);
  start();
}

function start(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='';
  init(); }

async function init() {
  try {
    const s = await api('/plaid/status');
    document.getElementById('envTag').textContent = s.ready ? ('环境: ' + s.env) : '';
    if (s.ready && s.env === 'sandbox') document.getElementById('whBtn').style.display = '';
    if (!s.ready) {
      document.getElementById('setupBox').style.display = '';
      document.getElementById('setupBox').innerHTML = '<b>还差一步：配置 Plaid 密钥（一次性）</b><br>'
        + '1. 到 <a href="https://dashboard.plaid.com/signup" target="_blank" rel="noopener">dashboard.plaid.com</a> 注册（免费），拿到 <code>client_id</code> 和 <code>secret</code><br>'
        + '2. 在网站服务器的环境变量里（和 ANTHROPIC_API_KEY 放一起）加：<br>'
        + '<code>PLAID_CLIENT_ID=…</code>　<code>PLAID_SECRET=…</code>　<code>PLAID_ENV=sandbox</code>（先用 sandbox 测试，正式接自己银行改成 <code>production</code>，需在 Plaid 后台申请开通）<br>'
        + '3. 重启网站后回到本页，点右上角「➕ 连接银行」。';
      return;
    }
    try { const v = localStorage.getItem('bankTxnView'); if (v) document.getElementById('fView').value = v; } catch (e) {}
    await loadAccounts();
    await loadCats();
    await annLoadAll();
    await loadTxns();
    plaidOauthResume();
  } catch (e) { console.error(e); }
}

async function loadAccounts() {
  const r = await api('/plaid/accounts');
  ACCTS = r.accounts || [];
  const itemRowId = {};
  (r.items || []).forEach(i => { itemRowId[i.item_id] = i.id; });
  const sel = document.getElementById('fAcct');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部账户</option>'
    + ACCTS.map(a => '<option value="' + esc(a.account_id) + '">' + esc(a.name) + (a.mask ? ' ····' + a.mask : '') + '</option>').join('');
  sel.value = cur;
  document.getElementById('accounts').innerHTML = ACCTS.map(a =>
    '<div class="acct"><div class="bank">🏦 ' + esc(a.institution || a.type)
    + (itemRowId[a.item_id] ? ' <a href="javascript:void(0)" onclick="unlinkItem(' + itemRowId[a.item_id] + ',\'' + esc(a.institution || a.name).replace(/'/g, '') + '\')" style="color:var(--red);float:right;text-decoration:none">✕ 解绑</a>' : '')
    + '</div>'
    + '<div class="nm">' + esc(a.name) + (a.mask ? ' <span class="sub">····' + a.mask + '</span>' : '') + '</div>'
    + '<div class="bal">' + money(a.balance_current, a.currency) + '</div>'
    + '<div class="sub">' + (a.balance_available != null ? '可用 ' + money(a.balance_available, a.currency) + ' · ' : '')
    + esc(a.subtype || '') + '</div></div>').join('')
    || '<div class="empty">还没连接银行账户 — 点右上角「➕ 连接银行」</div>';
}

async function unlinkItem(id, name) {
  if (!confirm('确定解绑「' + name + '」这个银行连接吗？\n该连接下所有账户和已同步的交易记录都会删除。')) return;
  try {
    await api('/plaid/items/' + id, { method: 'DELETE' });
    await loadAccounts();
    await loadTxns();
  } catch (e) { alert(e.message); }
}

function qDebounce(){ clearTimeout(qTimer); qTimer = setTimeout(loadTxns, 350); }
function txnQuery() {
  const p = new URLSearchParams();
  const s = document.getElementById('fStart').value, e = document.getElementById('fEnd').value;
  const a = document.getElementById('fAcct').value, q = document.getElementById('fQ').value.trim();
  const c = document.getElementById('fCat').value;
  if (s) p.set('start', s); if (e) p.set('end', e);
  if (a) p.set('account_id', a); if (q) p.set('q', q);
  if (c) p.set('category', c);
  return p.toString();
}

// Plaid 大分类 → 中文（Plaid 个人财务分类共 16 个大类；旧数据可能是自由文本，原样显示）
const PLAID_CAT_ZH = {
  INCOME: '收入', TRANSFER_IN: '转入', TRANSFER_OUT: '转出', LOAN_PAYMENTS: '贷款/还款',
  BANK_FEES: '银行费用', ENTERTAINMENT: '娱乐', FOOD_AND_DRINK: '餐饮',
  GENERAL_MERCHANDISE: '一般购物', HOME_IMPROVEMENT: '家居装修', MEDICAL: '医疗',
  PERSONAL_CARE: '个人护理', GENERAL_SERVICES: '综合服务', GOVERNMENT_AND_NON_PROFIT: '政府/公益',
  TRANSPORTATION: '交通', TRAVEL: '差旅', RENT_AND_UTILITIES: '房租/水电',
};
function catZh(c) { return PLAID_CAT_ZH[c] || c || ''; }
const PLAID_CAT_CLS = { INCOME: 'cat-in', TRANSFER_IN: 'cat-tin', TRANSFER_OUT: 'cat-tout', LOAN_PAYMENTS: 'cat-loan', BANK_FEES: 'cat-fee', GOVERNMENT_AND_NON_PROFIT: 'cat-gov' };
function catBadge(c) { return c ? '<span class="cat-b ' + (PLAID_CAT_CLS[c] || '') + '">' + esc(catZh(c)) + '</span>' : ''; }
async function loadCats() {
  try {
    const r = await api('/plaid/txn-categories');
    const sel = document.getElementById('fCat');
    const cur = sel.value;
    sel.innerHTML = '<option value="">全部分类（' + (r.categories || []).length + ' 类）</option>'
      + (r.categories || []).map(c =>
        '<option value="' + esc(c.category) + '">' + esc(catZh(c.category) || '（无分类）') + '（' + c.n + ' 笔）</option>').join('');
    sel.value = cur;
  } catch (e) { console.error(e); }
}

async function loadTxns() {
  const qs = txnQuery();
  document.getElementById('csvBtn').href = '/api/plaid/transactions.csv?' + qs;
  const r = await api('/plaid/transactions' + (qs ? '?' + qs : ''));
  const rows = r.transactions || [];
  const accName = id => { const a = ACCTS.find(x => x.account_id === id); return a ? a.name + (a.mask ? ' ····' + a.mask : '') : ''; };
  document.getElementById('sumLine').textContent =
    '共 ' + (r.total || 0) + ' 笔' + (rows.length < (r.total || 0) ? '（显示最近 ' + rows.length + ' 笔）' : '')
    + ' · 净额 ' + money(-(r.sum || 0));
  _TXNS = rows;
  // Plaid 的正数是支出、负数是入账；显示按会计习惯反过来
  const rowHtml = (t, grp) =>
    '<tr' + (grp ? ' data-grp="' + esc(grp) + '"' : '') + '><td style="white-space:nowrap">' + esc(t.date) + (t.pending ? ' <span class="hint">待清算</span>' : '') + '</td>'
    + '<td>' + esc(accName(t.account_id)) + '</td>'
    + '<td>' + esc(t.merchant || t.name) + '</td>'
    + '<td style="white-space:nowrap" title="' + esc(t.category || '') + '">' + catBadge(t.category) + '</td>'
    + '<td style="text-align:right;white-space:nowrap" class="' + (t.amount < 0 ? 'amt-in' : 'amt-out') + '">'
    + (t.amount < 0 ? '+' : '−') + money(Math.abs(t.amount), t.currency) + '</td>'
    + '<td class="ann-cell" data-txn="' + esc(t.txn_id) + '">' + annChipHtml(t.txn_id) + '</td></tr>';
  const head = '<tr><th style="white-space:nowrap">日期</th><th>账户</th><th>描述</th><th style="white-space:nowrap">分类</th><th style="text-align:right">金额</th><th>标注</th></tr>';
  const view = document.getElementById('fView').value;
  let body;
  if (!rows.length) {
    document.getElementById('txns').innerHTML = '<div class="empty">这个范围内没有交易。连接银行后点「🔄 同步交易」。</div>';
    return;
  }
  if (view === 'flat') {
    body = rows.map(t => rowHtml(t)).join('');
  } else {
    // 按周（周一起）或按月分组，每组带收入/支出/净额小计，点组头可折叠
    const groups = [], byKey = {};
    for (const t of rows) {
      const g = view === 'week' ? txnWeek(t.date) : { key: String(t.date || '').slice(0, 7), label: String(t.date || '').slice(0, 7) };
      if (!byKey[g.key]) { byKey[g.key] = { ...g, txns: [], inSum: 0, outSum: 0 }; groups.push(byKey[g.key]); }
      byKey[g.key].txns.push(t);
      if (t.amount < 0) byKey[g.key].inSum += -t.amount; else byKey[g.key].outSum += t.amount;
    }
    body = groups.map(g => {
      const net = g.inSum - g.outSum;
      return '<tr class="grp-head" onclick="toggleGrp(this,\'' + esc(g.key) + '\')">'
        + '<td colspan="6"><span class="grp-arrow">▼</span> <b>📅 ' + esc(g.label) + '</b>'
        + ' <span class="hint">' + g.txns.length + ' 笔</span> '
        + ' <span class="grp-chip" style="color:#047857">收入 +' + money(g.inSum) + '</span>'
        + ' <span class="grp-chip" style="color:#57534e">支出 −' + money(g.outSum) + '</span>'
        + ' <span class="grp-chip" style="color:' + (net >= 0 ? '#047857' : '#c5221f') + '">净额 ' + (net >= 0 ? '+' : '−') + money(Math.abs(net)) + '</span>'
        + '</td></tr>'
        + g.txns.map(t => rowHtml(t, g.key)).join('');
    }).join('');
  }
  document.getElementById('txns').innerHTML = '<table>' + head + body + '</table>';
}

// 一笔交易所在的周（周一为一周起点）
function txnWeek(dateStr) {
  const d = new Date(String(dateStr || '') + 'T00:00:00');
  if (isNaN(d)) return { key: String(dateStr || ''), label: String(dateStr || '') };
  const fmt = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return { key: fmt(mon), label: fmt(mon) + ' ~ ' + fmt(sun) };
}
function toggleGrp(headRow, key) {
  const hidden = headRow._collapsed = !headRow._collapsed;
  headRow.parentElement.querySelectorAll('tr[data-grp="' + key + '"]').forEach(r => { r.style.display = hidden ? 'none' : ''; });
  const a = headRow.querySelector('.grp-arrow');
  if (a) a.textContent = hidden ? '▶' : '▼';
}

function openPlaidLink(linkToken, receivedRedirectUri) {
  const handler = Plaid.create({
    token: linkToken,
    receivedRedirectUri: receivedRedirectUri || null,
    onSuccess: async (publicToken, metadata) => {
      localStorage.removeItem('plaid_link_token');
      await api('/plaid/exchange', { method: 'POST', body: JSON.stringify({
        public_token: publicToken,
        institution: (metadata && metadata.institution && metadata.institution.name) || '' }) });
      await syncNow();
    },
    onExit: () => { localStorage.removeItem('plaid_link_token'); },
  });
  handler.open();
}

async function connectBank() {
  try {
    const r = await api('/plaid/link-token', { method: 'POST', body: '{}' });
    // OAuth 银行会整页跳去银行授权, 授权完带 oauth_state_id 跳回本页;
    // 先存下 link_token, 跳回后用它 + receivedRedirectUri 恢复 Link
    localStorage.setItem('plaid_link_token', r.link_token);
    openPlaidLink(r.link_token);
  } catch (e) { alert(e.message); }
}

function plaidOauthResume() {
  const stateId = new URLSearchParams(location.search).get('oauth_state_id');
  const saved = localStorage.getItem('plaid_link_token');
  if (!stateId || !saved) return;
  const uri = window.location.href;
  history.replaceState(null, '', location.pathname);
  openPlaidLink(saved, uri);
}

    await new Promise(r2 => setTimeout(r2, 2500));

      <div class="bs-rent-wrap" style="display:${_bsIsRent(box.payee) ? '' : 'none'};background:#fdf4ff;border:1px dashed #e9d5ff;border-radius:6px;padding:.4rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#7e22ce;margin-bottom:.25rem">选择公司（房东）</div>
        <select class="bs-bx-rent-co" onchange="bsRentUpdate(${box.id},this)" style="width:100%;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem;background:#fff">${_bsRentCoOptions(_bsRentParse(box.payee))}</select>
      </div>
      <div class="bs-whdep-wrap" style="display:${_bsIsWhdep(box.payee) ? '' : 'none'};background:#ecfeff;border:1px dashed #a5f3fc;border-radius:6px;padding:.4rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#0e7490;margin-bottom:.25rem">选择仓库（押金付给哪个仓库）</div>
        <select class="bs-bx-whdep-co" onchange="bsWhdepUpdate(${box.id},this)" style="width:100%;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem;background:#fff">${_bsWhdepCoOptions(_bsWhdepParse(box.payee))}</select>
      </div>
      <div class="bs-referral-wrap" style="display:${_bsIsReferral(box.payee) ? '' : 'none'};background:#fdf2f8;border:1px dashed #fbcfe8;border-radius:6px;padding:.4rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#be185d;margin-bottom:.25rem">推荐人姓名（推荐费付给谁）</div>
        <input type="text" class="bs-bx-referral-name" list="bsReferrerList" value="${esc(_bsReferralParse(box.payee))}" onchange="bsReferralUpdate(${box.id},this)" placeholder="推荐人姓名（可打字或从列表选）" style="width:100%;box-sizing:border-box;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem;background:#fff">
      </div>
      <div class="bs-wagebonus-wrap" style="display:${_bsIsWageBonus(box.payee) ? '' : 'none'};background:#fefce8;border:1px dashed #fde047;border-radius:6px;padding:.4rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#a16207;margin-bottom:.25rem">奖励发给谁（姓名，多个用逗号隔开）</div>
        <input type="text" class="bs-bx-wagebonus-name" value="${esc(_bsWageBonusParse(box.payee))}" onchange="bsWageBonusUpdate(${box.id},this)" placeholder="姓名（多个用逗号隔开）" style="width:100%;box-sizing:border-box;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem;background:#fff">
      </div>
      <div class="bs-fee-wrap" style="display:${box.payee === BS_PAYEE_BANKFEE ? '' : 'none'};background:#fffbeb;border:1px dashed #fde68a;border-radius:6px;padding:.45rem .5rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#92400e;margin-bottom:.3rem">银行费用类型</div>
        <input type="text" class="bs-bx-fee" list="bsFeeList" placeholder="如：服务费 / 支票费" value="${esc(box.payee === BS_PAYEE_BANKFEE ? (box.purpose || '') : '')}" onchange="bsUpdateBoxField(${box.id},'purpose',this.value)" style="width:100%;box-sizing:border-box;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem">
      </div>
      <div class="bs-office-wrap" style="display:${box.payee === BS_PAYEE_OFFICE ? '' : 'none'};background:#f0f9ff;border:1px dashed #bae6fd;border-radius:6px;padding:.45rem .5rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#0369a1;margin-bottom:.3rem">办公费用分类</div>
        <input type="text" class="bs-bx-office" list="bsOfficeList" placeholder="如：Claude (Anthropic) / ChatGPT (OpenAI)" value="${esc(box.payee === BS_PAYEE_OFFICE ? (box.purpose || '') : '')}" onchange="bsUpdateBoxField(${box.id},'purpose',this.value)" style="width:100%;box-sizing:border-box;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem">
      </div>
      <div class="bs-compfee-wrap" style="display:${box.payee === BS_PAYEE_COMPFEE ? '' : 'none'};background:#faf5ff;border:1px dashed #e9d5ff;border-radius:6px;padding:.45rem .5rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#7e22ce;margin-bottom:.3rem">公司相关费用分类</div>
        <input type="text" class="bs-bx-compfee" list="bsCompFeeList" placeholder="如：税务 Tax / 成立费 Incorporation" value="${esc(box.payee === BS_PAYEE_COMPFEE ? (box.purpose || '') : '')}" onchange="bsUpdateBoxField(${box.id},'purpose',this.value)" style="width:100%;box-sizing:border-box;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem">
      </div>
      <div class="bs-personal-wrap" style="display:${_bsPayeeKind(box) === 'personal' ? '' : 'none'};background:#eff6ff;border:1px dashed #bfdbfe;border-radius:6px;padding:.45rem .5rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#1d4ed8;margin-bottom:.3rem">类别（拿回家）</div>
        <input type="text" class="bs-bx-cat" list="bsPersonalCatList" placeholder="换汇 / 自己工资 / 公司转账" value="${esc(_bsPayeeKind(box) === 'personal' ? (box.purpose || '') : '')}" onchange="bsUpdateBoxField(${box.id},'purpose',this.value)" style="width:100%;box-sizing:border-box;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem">
      </div>
      <div class="bs-income-wrap" style="display:${_bsWantsInvoice(box) ? '' : 'none'};background:#f0fdf4;border:1px dashed #bbf7d0;border-radius:6px;padding:.45rem .5rem;margin-bottom:.35rem">
        <div style="font-size:.72rem;color:#059669;margin-bottom:.3rem">Invoice / 账期</div>
        <div class="bs-portion-row" style="display:${_bsPayeeKind(box) === 'employee' ? '' : 'none'};margin-bottom:.3rem">
          <select class="bs-bx-portion" onchange="bsUpdateBoxField(${box.id},'pay_portion',this.value);bsRecolorPortion(this)" style="width:100%;padding:.3rem .4rem;border:1px solid ${box.pay_portion ? 'var(--gray-200)' : '#dc2626'};border-radius:6px;font-size:.82rem;${box.pay_portion ? 'background:#fff' : 'background:#fff5f5'}">
            <option value="">— 全额 / 部分（必选）—</option>
            <option value="full"${box.pay_portion === 'full' ? ' selected' : ''}>全额 Full</option>
            <option value="partial"${box.pay_portion === 'partial' ? ' selected' : ''}>部分 Partial</option>
          </select>
        </div>
        <div class="bs-purpose-row" style="display:${(isIn && _bsPayeeKind(box) === 'company') ? '' : 'none'}">
          <input type="text" class="bs-bx-purpose" list="bsPurposeList" placeholder="用途（如：劳务工资）" value="${esc(box.purpose || '')}" onchange="bsUpdateBoxField(${box.id},'purpose',this.value)" style="width:100%;box-sizing:border-box;padding:.3rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem;margin-bottom:.3rem">
        </div>
        ${_bsInvItemsHtml(box)}
      </div>
      <div style="display:flex;align-items:center;gap:.3rem;margin-bottom:.35rem">
        <span style="color:#94a3b8;font-size:.82rem">$</span>
        <input type="number" class="bs-bx-amt" value="${box.amount || 0}" readonly title="金额来自银行同步的交易，不可修改" style="flex:1;padding:.32rem .4rem;border:1px solid var(--gray-200);border-radius:6px;font-size:.82rem;background:var(--gray-100);color:var(--gray-600);cursor:not-allowed">
        <span class="hint" style="flex:0 0 auto">银行同步，不可改</span>
      </div>
      <input type="text" class="bs-bx-note" placeholder="原因 / 备注${_bsNoteSatisfied(box) ? '（选填）' : '（需补上）'}" value="${esc(box.note || '')}" onchange="bsUpdateBoxField(${box.id},'note',this.value)" oninput="bsNoteInput(${box.id},this)" style="width:100%;box-sizing:border-box;padding:.32rem .4rem;border:1px solid ${_bsNoteSatisfied(box) ? 'var(--gray-200)' : '#dc2626'};border-radius:6px;font-size:.82rem;margin-bottom:.4rem;${_bsNoteSatisfied(box) ? '' : 'background:#fff5f5'}">
      <div class="bs-bx-photozone" ondragover="bsPhotoDragOver(event,this)" ondragleave="bsPhotoDragLeave(event,this)" ondrop="bsPhotoDrop(event,${box.id},this)" style="border:1px dashed var(--gray-300);border-radius:6px;padding:.4rem .5rem;transition:background .15s,border-color .15s">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem;flex-wrap:wrap">
          <span style="font-size:.75rem;color:var(--gray-500)">📷 照片${(box.photos_urls && box.photos_urls.length) ? ' (' + box.photos_urls.length + ')' : ''}</span>
          <label style="cursor:pointer;font-size:.75rem;color:#2563eb;font-weight:600">＋ 加照片<input type="file" accept="image/*,application/pdf" multiple style="display:none" onchange="bsBoxUploadPhotos(${box.id}, this.files)"></label>
          <span style="font-size:.72rem;color:var(--gray-400)">· 或把图片拖到这里</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:.3rem">${(box.photos_urls || []).map(u => `<div style="position:relative;width:46px;height:46px">${_bsPhotoThumbInner(u, 46)}<button onclick="bsBoxDeletePhoto(${box.id},'${esc(u)}')" title="删除照片" style="position:absolute;top:-6px;right:-6px;background:rgba(15,23,42,.85);color:#fff;border:none;border-radius:999px;width:17px;height:17px;font-size:10px;line-height:17px;cursor:pointer;padding:0">×</button></div>`).join('')}</div>
      </div>
    </div>`
    + '<datalist id="bsPurposeList"><option value="劳务工资"></option></datalist>'
    + '<datalist id="bsFeeList">' + BS_FEE_TYPES.map(f => `<option value="${esc(f)}"></option>`).join('') + '</datalist>'
    + '<datalist id="bsOfficeList">' + BS_OFFICE_TYPES.map(f => `<option value="${esc(f)}"></option>`).join('') + '</datalist>'
    + '<datalist id="bsCompFeeList">' + BS_COMPFEE_TYPES.map(f => `<option value="${esc(f)}"></option>`).join('') + '</datalist>'
    + '<datalist id="bsPersonalCatList">' + BS_PERSONAL_CATS.map(c => `<option value="${esc(c)}"></option>`).join('') + '</datalist>'
    + '<datalist id="bsReferrerList">' + (_bsReferrers || []).map(n => `<option value="${esc(n)}"></option>`).join('') + '</datalist>';
  bsValidateBoxDates(box.id);
}

// ── 行内徽章 + 抽屉开关 ──
function annChipHtml(txnId) {
  const b = ANN[txnId];
  if (!b) return '<button class="ann-add" data-txn="' + esc(txnId) + '" onclick="annOpen(this.dataset.txn)">＋ 标注</button>';
  const warn = _bsNoteSatisfied(b) ? '' : ' <span style="color:#dc2626">⚠</span>';
  const label = _bsPayeeDisplay(b.payee) || (b.direction === 'in' ? '收入' : '支出') + '（待填）';
  return '<button class="ann-chip" data-txn="' + esc(txnId) + '" onclick="annOpen(this.dataset.txn)" title="' + esc(label) + '">' + esc(label) + warn + '</button>';
}
function annRefreshChip(box) {
  if (!box || !box.plaid_txn_id) return;
  const cell = document.querySelector('.ann-cell[data-txn="' + box.plaid_txn_id + '"]');
  if (cell) cell.innerHTML = annChipHtml(box.plaid_txn_id);
}
function annStore(box) {
  if (typeof box.inv_items === 'string') { try { box.inv_items = JSON.parse(box.inv_items || '[]'); } catch (e) { box.inv_items = []; } }
  const i = _bsBoxList.findIndex(b => b.id === box.id);
  if (i >= 0) _bsBoxList[i] = box; else _bsBoxList.push(box);
  if (box.plaid_txn_id) ANN[box.plaid_txn_id] = box;
  return box;
}
async function annLoadAll() {
  try {
    const r = await api('/plaid/annotations');
    Object.values(r.annotations || {}).forEach(annStore);
  } catch (e) { console.error(e); }
}
async function annOpen(txnId) {
  try {
    await Promise.all([bsEnsureCompanies(), bsEnsureWarehouses(), bsEnsureReferrers()]);
    const box = annStore(await api('/plaid/annotations', { method: 'POST', body: JSON.stringify({ txn_id: txnId }) }));
    _annOpenId = box.id;
    const t = _TXNS.find(x => x.txn_id === txnId);
    // 收支方向由交易金额定死 (Plaid 正数=支出)；旧标注若被改错，打开时纠正回来
    if (t) {
      const expect = (t.amount || 0) > 0 ? 'out' : 'in';
      if (box.direction !== expect) {
        box.direction = expect;
        try { await api('/admin/bank-statements/' + box.statement_id + '/boxes/' + box.id, { method: 'PUT', body: JSON.stringify({ direction: expect }) }); } catch (e2) {}
      }
    }
    document.getElementById('annTxnInfo').textContent = t
      ? (t.date + ' · ' + (t.merchant || t.name || '') + ' · ' + money(-t.amount, t.currency))
      : ((box.txn_date || '') + ' · $' + (box.amount || 0));
    document.getElementById('annDrawer').classList.add('open');
    document.getElementById('annBackdrop').classList.add('open');
    _bsRenderBoxPanel();
    annRefreshChip(box);
  } catch (e) { showToast(e.message || '打开标注失败', 'error'); }
}
function annClose() {
  document.getElementById('annDrawer').classList.remove('open');
  document.getElementById('annBackdrop').classList.remove('open');
  _annOpenId = null;
}

if (TOKEN) {
  fetch('/api/admin/me', { headers: { 'Authorization': 'Bearer ' + TOKEN } })
    .then(r => r.json()).then(r => {
      if (r && r.username && r.role === 'admin') start();
      else showGate(r && r.username ? '银行数据只有管理员能看' : '');
    }).catch(() => showGate(''));
} else showGate('');
</script>
</body>
</html>
