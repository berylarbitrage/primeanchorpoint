name: Build SMS Translator (Windows)

# Builds the Windows installer on a real Windows runner. Cross-building from
# Linux is possible but needs Wine to stamp the exe's icon and metadata, so the
# downloadable binaries are produced here instead.

on:
  push:
    branches:
      - 'claude/windows-sms-translator-**'
    tags:
      - 'sms-translator-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: >
          Publish a Release under this tag (e.g. sms-translator-v0.1.0). The tag
          is created at the current commit. Leave empty to only build artifacts.
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Some assertions cannot run on Windows (a fake adb .exe cannot be synthesised
  # there), so the full suite runs on Linux as well.
  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sms-translator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/sms-translator/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/sms-translator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/sms-translator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build renderer and main process
        run: npm run build

      - name: Package Windows installer and portable exe
        run: npx electron-builder --win --x64 --publish never

      - name: List build output
        run: Get-ChildItem release -Filter *.exe | Select-Object Name, Length
        shell: pwsh

      # Downloadable from the run's summary page for 90 days.
      - uses: actions/upload-artifact@v4
        with:
          name: sms-translator-windows
          path: apps/sms-translator/release/*.exe
          if-no-files-found: error
          retention-days: 90

      # A Release gives a permanent download link, which is what non-technical
      # users should be sent. Two ways in: push a `sms-translator-v*` tag, or run
      # this workflow manually with `release_tag` set (the runner creates the tag).
      #
      # Note: every line below must stay indented — a PowerShell here-string
      # starting at column 0 is not valid inside a YAML block scalar.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/sms-translator-v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $files = (Get-ChildItem release -Filter *.exe).FullName
          $notes = @(
            '安卓短信翻译收件箱 — Windows 版。',
            '',
            '- `SMS Translator-*-Setup.exe` — 安装版',
            '- `SMS Translator-*-Portable.exe` — 免安装，双击就跑',
            '',
            '**首次运行 Windows 会拦一下**：这个 exe 没有代码签名证书，会弹「Windows 已保护你的电脑」。点「更多信息」→「仍要运行」。',
            '',
            '**还需要 adb**：下载 [Android Platform Tools](https://developer.android.com/tools/releases/platform-tools) 解压即可，不用配环境变量——软件会自动在常见位置查找，找不到时点设置里的「浏览…」选中 `adb.exe`。手机上还要打开 USB 调试，或用无线调试（不插线）。',
            '',
            '**三星用户注意**：如果开发者选项里的「USB 调试」是灰色的、写着 `Blocked by Auto Blocker`，先到 设置 → 安全和隐私 → **自动拦截器（Auto Blocker）** 里把它关掉，否则电脑连不上手机。',
            '',
            '**仅支持 Android。** iOS 不向第三方开放短信接口。发短信是唤起手机短信 App 再自动点发送，不是真正的直发；图片短信只收不发。',
            '',
            '完整说明见 `apps/sms-translator/README.md`。'
          ) -join "`n"
          # `gh release create` creates the tag at --target when it does not exist.
          gh release create $tag $files --target $env:GITHUB_SHA --title "SMS Translator $tag" --notes $notes
